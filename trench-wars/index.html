function noise(dur,vol,fq,type){const a=ac();if(!a||mute)return;const n=a.sampleRate*dur|0,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type=type||"lowpass";f.frequency.value=fq;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}

function snd(k,loud){const n=performance.now();if(n-(lastS[k]||0)<(loud?20:70))return;lastS[k]=n;const v=loud?1:.35;

function reset(){WALLS=MAPS[mi].walls;buildBG();const mt=60+5*bonus("tix");S={u:[],b:[],g:[],ms:[],pk:[],fx:[],tk:[mt,60],mt:[mt,60],t:0,over:-1,sp:[0,0],resp:[0,0],shake:0,feed:[],pkT:6,st:[{k:0,ck:0,sh:0,ht:0,gk:0,dmg:0},{k:0,ck:0,sh:0,ht:0,gk:0,dmg:0}],flashT:0};
 for(let s=0;s<2;s++){S.u.push(mk(s,true));for(let i=0;i<3;i++)S.u.push(mk(s,false))}}

function move(u,dx,dy,sp,dt){const r=u.cmd?11:8;let nx=u.x+dx*sp*dt,ny=u.y+dy*sp*dt;nx=Math.max(r,Math.min(W-r,nx));ny=Math.max(r,Math.min(H-r,ny));
 if(!wallHit(nx,u.y,r))u.x=nx;if(!wallHit(u.x,ny,r))u.y=ny;if(dx||dy)u.mv=.12}
function shoot(u,ang){const st=S.st[u.s];

function dmg(u,d,src,gren){if(u.hp<=0||u.inv>0)return;if(u.shield>0)d*=.45;u.hp-=d;u.hit=.1;if(src){S.st[src.s].dmg+=d;if(src.cmd)S.st[src.s].ht+=0}

  feed(`${NAME[src?src.s:1-u.s]}${src&&src.cmd?" commander":" soldier"} eliminated ${NAME[u.s].toLowerCase()}${u.cmd?" commander (-3)":""}`,COL[src?src.s:1-u.s])}}
function nearest(u,range){let best=null,bd=range;for(const v of S.u)if(v.s!==u.s&&v.hp>0){const d=Math.hypot(v.x-u.x,v.y-u.y);if(d<bd){bd=d;best=v}}return best}
function los(a,b){for(let i=1;i<10;i++){if(wallHit(a.x+(b.x-a.x)*i/10,a.y+(b.y-a.y)*i/10,0))return false}return true}
function takePk(u,p){const T={heal:["Medkit","hp"],rapid:["Rapid fire","rapid"],shot:["Shotgun","shot"],shield:["Shield","shield"]};
 if(p.k==="heal")u.hp=Math.min(u.mhp,u.hp+55);else u[p.k]=9;snd("pick");spark(p.x,p.y,"#fff",10,120,.5);feed(`${NAME[u.s]} got ${T[p.k][0]}`,COL[u.s])}
function spawnPk(){const ks=["heal","rapid","shot","shield"];for(let i=0;i<25;i++){const px=rnd(170,630),py=rnd(50,450);if(wallHit(px,py,18)||S.pk.some(q=>Math.hypot(q.x-px,q.y-py)<70))continue;S.pk.push({x:px,y:py,k:ks[Math.random()*4|0],t:0,l:25});return}}
function botMove(u,dt,T){const sp=[105,125,150][diff],err=[.28,.16,.05][diff];let mx=0,my=0,ang=u.ang;
 if(T){const d=Math.hypot(T.x-u.x,T.y-u.y),a=Math.atan2(T.y-u.y,T.x-u.x);ang=a;if(d>210){mx=Math.cos(a);my=Math.sin(a)}else if(d<115){mx=-Math.cos(a);my=-Math.sin(a)}

function upd(dt){if(S.over>=0||paused)return;S.t+=dt;S.shake=Math.max(0,S.shake-dt*14);
 for(let s=0;s<2;s++){S.sp[s]-=dt;const n=S.u.filter(u=>u.s===s&&!u.cmd).length;if(S.sp[s]<=0&&n<8){S.sp[s]=2.4;S.u.push(mk(s,false))}

  if(u.dash>0){u.dash-=dt;move(u,u.dx,u.dy,520,dt);if(Math.random()<.6)fx({x:u.x,y:u.y,vx:0,vy:0,l:.25,ml:.25,c:"#fff8",r:5})}

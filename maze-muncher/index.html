<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze Muncher | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 50% 0,#7c3aed,#0b1020)}
main{width:min(100%,40rem);padding:1.5rem;border:.2rem solid #fde047;border-radius:1.25rem;background:rgb(8 12 30 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.6rem 0;color:#fde047;letter-spacing:.05em;font-size:1.6rem}
canvas{display:block;width:100%;max-width:28rem;height:auto;margin:1rem auto;border:.2rem solid #475569;border-radius:.4rem;background:#0b1020;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,4rem);grid-template-rows:repeat(2,4rem);gap:.4rem;justify-content:center;user-select:none;-webkit-user-select:none}
button{border:0;border-radius:.5rem;background:#fde047;color:#1e293b;cursor:pointer;font:inherit;font-weight:bold;touch-action:none;font-size:1.4rem}
button[data-k=up]{grid-column:2;grid-row:1}button[data-k=left]{grid-column:1;grid-row:2}button[data-k=down]{grid-column:2;grid-row:2}button[data-k=right]{grid-column:3;grid-row:2}
</style></head>
<body><main><a href="../">← All games</a><h1>🟡 Maze Muncher</h1>
<p>Gobble every dot in the maze! Avoid the three ghosts — or grab a big power pellet and munch them for bonus points. Use the side tunnel to escape. Each level gets faster.</p>
<p><strong>Arrows</strong> or <strong>WASD</strong> to move · swipe on the game or use the buttons · <strong>E / Space</strong> start</p>
<canvas id="g" width="456" height="552" aria-label="Maze Muncher game"></canvas>
<div class="pad"><button data-k="up" type="button">▲</button><button data-k="left" type="button">◀</button><button data-k="down" type="button">▼</button><button data-k="right" type="button">▶</button></div>
</main>
<script>
const C=document.querySelector("#g"),x=C.getContext("2d"),T=24,COLS=19,ROWS=21,OY=36,W=456,H=552,TUN=10;
const LAYOUT=[
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.###...###.####",
"####.####-####.####",
"####.#       #.####",
"####.#########.####",
" ................. ",
"#........#........#",
"#.##.###.#.###.##.#",
"#..#...........#..#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"#o##.###.#.###.##o#",
"#........#........#",
"###################"];
// dirs: 0 up,1 left,2 down,3 right
const DX=[0,-1,0,1],DY=[-1,0,1,0];
const GCOL=["#ef4444","#f472b6","#22d3ee"],CORNER=[[17,1],[1,1],[1,19]];
let map=[],dots=0,mode="title",t=0,score=0,lives=3,level=1,hi=0,pac,ghosts=[],fright=0,chain=0,phaseT=0,modeT=0,msg=null,want=-1;
try{hi=+localStorage.getItem("mazeMuncherHi")||0}catch(e){}
function loadMap(){map=LAYOUT.map(r=>r.split(""));dots=0;for(const r of map)for(const c of r)if(c==="."||c==="o")dots++}
function speeds(){return{p:Math.min(3,1.8+level*.1),g:Math.min(2.9,1.5+level*.14),f:Math.max(.8,1.1-level*.02),e:3}}
function resetActors(){
 pac={x:9*T,y:17*T,dir:3,acc:0,mouth:0,moving:false};want=-1;
 const st=[[9,6,0],[9,8,1],[8,8,2]];
 ghosts=st.map(([c,r,i])=>({i,x:c*T,y:r*T,dir:i?0:1,acc:0,mode:i?"house":"normal",scared:false,rel:i?Math.max(30,i*170-level*25):0}));
 fright=0;chain=0;phaseT=0;
}
function start(){score=0;lives=3;level=1;loadMap();resetActors();mode="ready";modeT=90}
function open(c,r,door){if(c<0||c>=COLS)return r===TUN;const ch=map[r][c];return ch==="-"?!!door:ch!=="#"}
function bfs(c,r,tc,tr){
 const seen=new Set([c+","+r]),q=[[c,r,-1]];
 while(q.length){const[a,b,f]=q.shift();if(a===tc&&b===tr)return f;
  for(let d=0;d<4;d++){const na=a+DX[d],nb=b+DY[d];if(na<0||na>=COLS||nb<0||nb>=ROWS||!open(na,nb,true))continue;const k=na+","+nb;if(seen.has(k))continue;seen.add(k);q.push([na,nb,f<0?d:f])}}
 return -1}
function wrap(e){if(e.x<=-T)e.x=(COLS-1)*T;else if(e.x>=COLS*T)e.x=0}
function move(e){e.x+=DX[e.dir];e.y+=DY[e.dir];wrap(e)}
function stepPac(){
 if(want>=0&&want===(pac.dir+2)%4&&pac.moving)pac.dir=want;
 if(pac.x%T===0&&pac.y%T===0){
  const c=pac.x/T,r=pac.y/T,ch=map[r][c];
  if(ch==="."||ch==="o"){map[r][c]=" ";dots--;score+=ch==="o"?50:10;if(ch==="o"){fright=Math.max(150,Math.round(430-level*40));chain=0;for(const g of ghosts)if(g.mode!=="eaten"&&g.mode!=="house"){g.scared=true;g.dir=(g.dir+2)%4}}}
  if(want>=0&&open(c+DX[want],r+DY[want],false))pac.dir=want;
  pac.moving=open(c+DX[pac.dir],r+DY[pac.dir],false)}
 if(pac.moving)move(pac)}
function SCAT(){return Math.max(180,420-level*40)}
const CHASE=1200;
function stepGhost(g){
 if(g.x%T===0&&g.y%T===0){
  const c=g.x/T,r=g.y/T;
  if(g.mode==="exit"&&c===9&&r<=6)g.mode="normal";
  if(g.mode==="eaten"&&c===9&&r===8){g.mode="exit";g.scared=false}
  let d=-1;
  if(g.mode==="exit")d=bfs(c,r,9,6);
  else if(g.mode==="eaten")d=bfs(c,r,9,8);
  else{
   const opts=[];for(let k=0;k<4;k++)if(open(c+DX[k],r+DY[k],false))opts.push(k);
   const fw=opts.filter(k=>k!==(g.dir+2)%4),use=fw.length?fw:opts;
   if(g.scared)d=use[Math.floor(Math.random()*use.length)];
   else{
    const pc=Math.round(pac.x/T),pr=Math.round(pac.y/T);let tx,ty;
    if(phaseT%(SCAT()+CHASE)<SCAT()){[tx,ty]=CORNER[g.i]}
    else if(g.i===0){tx=pc;ty=pr}
    else if(g.i===1){tx=pc+DX[pac.dir]*4;ty=pr+DY[pac.dir]*4}
    else if(Math.hypot(pc-c,pr-r)>6){tx=pc;ty=pr}else{[tx,ty]=CORNER[g.i]}
    let best=1e9;for(const k of use){const dd=(c+DX[k]-tx)**2+(r+DY[k]-ty)**2;if(dd<best){best=dd;d=k}}}
  }
  if(d>=0)g.dir=d}
 move(g)}
function update(){
 t++;
 if(mode==="ready"){if(--modeT<=0)mode="play";return}
 if(mode==="dying"){if(--modeT<=0){lives--;if(lives<=0){mode="over";if(score>hi){hi=score;try{localStorage.setItem("mazeMuncherHi",hi)}catch(e){}}}else{resetActors();mode="ready";modeT=90}}return}
 if(mode==="clear"){if(--modeT<=0){level++;loadMap();resetActors();mode="ready";modeT=90}return}
 if(mode!=="play")return;
 if(msg&&--msg.l<=0)msg=null;
 const sp=speeds();phaseT++;
 if(fright>0&&--fright===0)for(const g of ghosts)g.scared=false;
 pac.acc+=sp.p;pac.mouth+=.3;
 while(pac.acc>=1){pac.acc--;stepPac()}
 for(const g of ghosts){
  if(g.mode==="house"){if(--g.rel<=0)g.mode="exit";continue}
  g.acc+=g.mode==="eaten"?sp.e:g.scared?sp.f:sp.g;
  while(g.acc>=1){g.acc--;stepGhost(g)}
  if(g.mode!=="eaten"&&Math.abs(g.x-pac.x)<T*.6&&Math.abs(g.y-pac.y)<T*.6){
   if(g.scared){g.scared=false;g.mode="eaten";chain++;const p=100*2**chain;score+=p;msg={s:"+"+p,l:50,x:g.x,y:g.y}}
   else{mode="dying";modeT=70;return}}}
 if(dots<=0){mode="clear";modeT=100}
}
const KEYS={ArrowUp:0,KeyW:0,ArrowLeft:1,KeyA:1,ArrowDown:2,KeyS:2,ArrowRight:3,KeyD:3};
const NAMES={up:0,left:1,down:2,right:3};
function go(){if(mode==="title"||mode==="over")start()}
addEventListener("keydown",e=>{if(e.code==="KeyE"||e.code==="Space"||e.code==="Enter"){e.preventDefault();go();return}const k=KEYS[e.code];if(k!==undefined){e.preventDefault();want=k;go()}});
document.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();go();want=NAMES[b.dataset.k]}));
let sw=null;
C.addEventListener("pointerdown",e=>{e.preventDefault();go();sw=[e.clientX,e.clientY];C.setPointerCapture(e.pointerId)});
C.addEventListener("pointermove",e=>{if(!sw)return;const dx=e.clientX-sw[0],dy=e.clientY-sw[1];if(Math.hypot(dx,dy)>20){want=Math.abs(dx)>Math.abs(dy)?(dx<0?1:3):(dy<0?0:2);sw=[e.clientX,e.clientY]}});
["pointerup","pointercancel"].forEach(ev=>C.addEventListener(ev,()=>{sw=null}));
function text(s,a,b,size=18,color="#fff",align="left"){x.font=`bold ${size}px Arial,sans-serif`;x.fillStyle=color;x.textAlign=align;x.lineWidth=4;x.strokeStyle="#0f172a";x.strokeText(s,a,b);x.fillText(s,a,b)}
function drawGhost(g){
 const cx=g.x+T/2,cy=OY+g.y+T/2,r=T/2-2;
 let col=GCOL[g.i];
 if(g.scared)col=fright<60&&Math.floor(t/8)%2?"#f8fafc":"#3b82f6";
 if(g.mode!=="eaten"){
  x.fillStyle=col;x.beginPath();x.arc(cx,cy-1,r,Math.PI,0);x.lineTo(cx+r,cy+r);
  for(let i=1;i<=6;i++)x.lineTo(cx+r-i*r/3,cy+r-(i%2?4:0));
  x.closePath();x.fill()}
 x.fillStyle="#fff";
 if(g.scared&&g.mode!=="eaten"){x.fillRect(cx-5,cy-4,3,3);x.fillRect(cx+2,cy-4,3,3)}
 else{for(const s of[-4,4]){x.beginPath();x.arc(cx+s,cy-3,3.4,0,7);x.fill()}x.fillStyle="#1e3a8a";for(const s of[-4,4]){x.beginPath();x.arc(cx+s+DX[g.dir]*1.5,cy-3+DY[g.dir]*1.5,1.6,0,7);x.fill()}}
}
function draw(){
 x.fillStyle="#0b1020";x.fillRect(0,0,W,H);
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const ch=map[r][c],px=c*T,py=OY+r*T;
  if(ch==="#"){x.fillStyle="#6366f1";x.beginPath();x.roundRect(px+1,py+1,T-2,T-2,6);x.fill();x.fillStyle="#818cf8";x.beginPath();x.roundRect(px+4,py+4,T-8,T-8,4);x.fill()}
  else if(ch==="-"){x.fillStyle="#f9a8d4";x.fillRect(px,py+T/2-2,T,4)}
  else if(ch==="."){x.fillStyle="#fde68a";x.beginPath();x.arc(px+T/2,py+T/2,2.5,0,7);x.fill()}
  else if(ch==="o"){x.fillStyle=Math.floor(t/12)%2?"#fb923c":"#fde047";x.beginPath();x.arc(px+T/2,py+T/2,7,0,7);x.fill()}}
 for(const g of ghosts)drawGhost(g);
 const cx=pac.x+T/2,cy=OY+pac.y+T/2,r=T/2-1,a=mode==="dying"?Math.min(3.1,(70-modeT)/22):(pac.moving&&mode==="play"?Math.abs(Math.sin(pac.mouth))*.6:.2);
 const rot=[-Math.PI/2,Math.PI,Math.PI/2,0][pac.dir];
 if(!(mode==="dying"&&modeT<8)){x.fillStyle="#fde047";x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,rot+a,rot+Math.PI*2-a);x.closePath();x.fill()}
 text(`${score}`,12,26,24);text(`BEST ${hi}`,W/2,24,14,"#fde047","center");text("Lv "+level,W-12,14,12,"#93c5fd","right");text("🟡".repeat(Math.max(0,lives)),W-12,30,12,"#fff","right");
 if(msg)text(msg.s,msg.x+T/2,OY+msg.y,16,"#67e8f9","center");
 if(mode==="ready")text("READY!",W/2,OY+12*T+16,26,"#fde047","center");
 if(mode==="clear"&&Math.floor(t/10)%2)text("LEVEL CLEAR!",W/2,OY+12*T+16,26,"#86efac","center");
 if(mode==="title"||mode==="over"){
  x.fillStyle="rgb(2 6 23 / 65%)";x.fillRect(0,0,W,H);
  text(mode==="title"?"MAZE MUNCHER":"GAME OVER",W/2,230,44,mode==="title"?"#fde047":"#f87171","center");
  if(mode==="over")text(`Score ${score}`,W/2,280,26,"#fff","center");
  if(Math.floor(t/30)%2)text("Press E or tap to play",W/2,350,22,"#fff","center")}
}
let last=0,accT=0;
function frame(ts){accT+=Math.min(100,ts-last);last=ts;while(accT>=1000/60){accT-=1000/60;update()}draw();requestAnimationFrame(frame)}
loadMap();resetActors();requestAnimationFrame(ts=>{last=ts;frame(ts)});
</script></body></html>

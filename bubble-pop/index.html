<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bubble Pop | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial;background:#083344;color:#ecfeff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(135deg,#164e63,#0f766e)}main{width:min(100%,44rem);text-align:center;padding:1.5rem;border:1px solid #67e8f9;border-radius:1rem;background:#083344}a{color:#a5f3fc}h1{color:#fef08a}canvas{display:block;width:100%;height:auto;margin:1rem auto;border:3px solid #67e8f9;border-radius:.6rem;touch-action:none;background:#155e75}button{padding:.65rem 1rem;border:0;border-radius:.5rem;background:#fef08a;color:#164e63;font-weight:bold;cursor:pointer}#status{min-height:1.4rem;color:#fef08a;font-weight:bold}</style></head>
<body><main><a href="../">← All games</a><h1>🫧 Bubble Pop</h1><p>Pop as many rising bubbles as you can before the timer reaches zero.</p><p>Popped: <strong id="score">0</strong> · Time: <strong id="time">30</strong></p><canvas id="game" width="640" height="420" aria-label="Bubble Pop game"></canvas><button id="restart">Play again</button><p id="status" aria-live="polite">Tap bubbles to pop them!</p></main><script>
const c=document.querySelector("#game"),x=c.getContext("2d"),scoreEl=document.querySelector("#score"),timeEl=document.querySelector("#time"),status=document.querySelector("#status");let bubbles,score,time,last,live;
function start(){bubbles=[];score=0;time=30;live=true;last=performance.now();scoreEl.textContent=0;timeEl.textContent=30;status.textContent="Tap bubbles to pop them!";requestAnimationFrame(loop)}
function loop(t){if(!live)return;let d=Math.min((t-last)/1000,.05);last=t;time-=d;if(Math.random()<d*2)bubbles.push({x:30+Math.random()*580,y:450,r:16+Math.random()*18,s:25+Math.random()*35,h:Math.random()*360});bubbles.forEach(b=>b.y-=b.s*d);bubbles=bubbles.filter(b=>b.y>-50);if(time<=0){live=false;time=0;status.textContent=`Time! You popped ${score} bubbles.`}timeEl.textContent=Math.ceil(time);draw();if(live)requestAnimationFrame(loop)}
function draw(){x.fillStyle="#155e75";x.fillRect(0,0,640,420);bubbles.forEach(b=>{x.fillStyle=`hsl(${b.h} 85% 72% / .8)`;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(b.x-b.r/3,b.y-b.r/3,b.r/5,0,7);x.fill()})}
c.addEventListener("pointerdown",e=>{if(!live)return;let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*640/r.width,py=(e.clientY-r.top)*420/r.height,hit=bubbles.findIndex(b=>Math.hypot(px-b.x,py-b.y)<=b.r);if(hit>=0){bubbles.splice(hit,1);score++;scoreEl.textContent=score}});document.querySelector("#restart").onclick=start;start();
</script></body></html>

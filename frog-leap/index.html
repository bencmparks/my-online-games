<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frog Leap | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial;background:#14532d;color:#f0fdf4}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 12% 12%,#fef08a 0 4rem,transparent 4.2rem),linear-gradient(145deg,#14532d,#0f766e)}main{width:min(100%,38rem);padding:1.5rem;border:2px solid #86efac;border-radius:1.25rem;background:rgb(20 83 45 / 90%);text-align:center}a{color:#bbf7d0}h1{margin:.5rem;color:#fef08a}canvas{display:block;width:100%;height:auto;margin:1rem auto;border:3px solid #86efac;border-radius:.65rem;background:#0e7490;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;max-width:14rem;margin:.75rem auto}.controls span{display:block}button{min-height:2.7rem;border:0;border-radius:.5rem;background:#fef08a;color:#14532d;font:inherit;font-weight:bold;cursor:pointer}#status{min-height:1.5rem;color:#fef08a;font-weight:bold}</style></head>
<body><main><a href="../">← All games</a><h1>🐸 Frog Leap</h1><p>Hop across the lily pads, collect fireflies, and reach the moonlit shore. Keys: W A S D or arrows to hop, and Q E Z C to hop diagonally.</p><p>Fireflies: <strong id="score">0</strong> · Level: <strong id="level">1</strong></p><canvas id="game" width="480" height="600" aria-label="Frog Leap game"></canvas><div class="controls" aria-label="Controls"><button data-dx="-1" data-dy="-1">Q ↖</button><button data-dx="0" data-dy="-1">W ↑</button><button data-dx="1" data-dy="-1">E ↗</button><button data-dx="-1" data-dy="0">A ←</button><span></span><button data-dx="1" data-dy="0">D →</button><button data-dx="-1" data-dy="1">Z ↙</button><button data-dx="0" data-dy="1">S ↓</button><button data-dx="1" data-dy="1">C ↘</button></div><button id="restart">New pond</button><p id="status" aria-live="polite">Follow the lily pads to the shore.</p></main><script>
const c=document.querySelector("#game"),x=c.getContext("2d"),scoreEl=document.querySelector("#score"),levelEl=document.querySelector("#level"),status=document.querySelector("#status"),cols=8,rows=10,cell=60;let pads,frog,flies,score,level,live;
function start(reset=true){if(reset){score=0;level=1}buildLevel();scoreEl.textContent=score;levelEl.textContent=level;status.textContent="Follow the lily pads to the shore.";draw()}
function buildLevel(){pads=Array.from({length:rows},(_,row)=>{if(row===rows-1)return[3,4];let choices=[];while(choices.length<3){let col=Math.floor(Math.random()*cols);if(!choices.includes(col))choices.push(col)}return choices});for(let row=1;row<rows;row++)if(!pads[row].some(col=>Math.abs(col-4)<=1))pads[row][0]=4;pads[0]=[3,4,5];flies=Array.from({length:rows-2},(_,i)=>({x:pads[i+1][Math.floor(Math.random()*pads[i+1].length)],y:i+1,got:false}));frog={x:4,y:9};live=true}
function hop(dx,dy){if(!live)return;let nx=frog.x+dx,ny=frog.y+dy;if(nx<0||nx>=cols||ny<0||ny>=rows)return;if(ny===rows-1||pads[ny].includes(nx)){frog={x:nx,y:ny};let fly=flies.find(item=>!item.got&&item.x===nx&&item.y===ny);if(fly){fly.got=true;score++;scoreEl.textContent=score}if(ny===0){level++;levelEl.textContent=level;score+=3;scoreEl.textContent=score;status.textContent="You reached the shore! A new pond appears.";buildLevel()}}else{live=false;status.textContent="Splash! Try a new pond."}draw()}
function draw(){x.fillStyle="#0e7490";x.fillRect(0,0,480,600);for(let i=0;i<35;i++){x.fillStyle="rgb(103 232 249 / 30%)";x.fillRect((i*71)%480,(i*109)%600,18,2)}pads.forEach((row,y)=>row.forEach(col=>{x.fillStyle="#4d7c0f";x.beginPath();x.ellipse(col*cell+30,y*cell+30,24,17,0,0,7);x.fill();x.fillStyle="#84cc16";x.fillRect(col*cell+29,y*cell+13,3,16)}));flies.filter(item=>!item.got).forEach(item=>{x.fillStyle="#fef08a";x.beginPath();x.arc(item.x*cell+30,item.y*cell+27,6,0,7);x.fill()});let fx=frog.x*cell+30,fy=frog.y*cell+31;x.fillStyle="#86efac";x.beginPath();x.ellipse(fx,fy,19,15,0,0,7);x.fill();x.fillStyle="#052e16";x.beginPath();x.arc(fx-8,fy-9,5,0,7);x.arc(fx+8,fy-9,5,0,7);x.fill();x.fillStyle="#fff";x.fillRect(fx-10,fy-11,4,4);x.fillRect(fx+6,fy-11,4,4)}
document.addEventListener("keydown",e=>{let move={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],q:[-1,-1],e:[1,-1],z:[-1,1],c:[1,1]}[e.key.toLowerCase()];if(move){e.preventDefault();hop(...move)}});document.querySelectorAll("[data-dx]").forEach(button=>button.onclick=()=>hop(+button.dataset.dx,+button.dataset.dy));document.querySelector("#restart").onclick=()=>start();start();
</script></body></html>

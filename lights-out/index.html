<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lights Out | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 50% 0,#713f12,#0b1020)}
main{width:min(100%,36rem);padding:1.5rem;border:.2rem solid #facc15;border-radius:1.25rem;background:rgb(8 12 30 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.6rem 0;color:#facc15;letter-spacing:.05em;font-size:1.6rem}
canvas{display:block;width:100%;max-width:26rem;height:auto;margin:1rem auto;border:.2rem solid #475569;border-radius:.4rem;background:#111827;touch-action:none}
.bar{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;margin:.5rem 0}
button{border:0;border-radius:.5rem;background:#facc15;color:#1e293b;cursor:pointer;font:inherit;font-weight:bold;padding:.6rem 1rem}
#info{font-weight:bold;color:#fde68a;min-height:1.4rem}
</style></head>
<body><main><a href="../">← All games</a><h1>💡 Lights Out</h1>
<p>Turn every light off! Pressing a tile flips it and the four tiles next to it. Every puzzle can be solved.</p>
<p><strong>Click / tap</strong> a tile · <strong>R</strong> restart puzzle · <strong>N</strong> new puzzle</p>
<div class="bar"><button id="dn" type="button">− Easier</button><span id="lv" style="align-self:center;font-weight:bold"></span><button id="up" type="button">Harder +</button></div>
<canvas id="g" width="400" height="400" aria-label="Lights Out board"></canvas>
<div id="info"></div>
<div class="bar"><button id="re" type="button">Restart (R)</button><button id="nw" type="button">New puzzle (N)</button></div>
</main>
<script>
const C=document.querySelector("#g"),x=C.getContext("2d"),N=5,S=80,LV=["Easy","Medium","Hard","Expert"],SCR=[3,6,10,15];
let lvl=1,grid,start,moves=0,won=false,best={},flash=null;
try{best=JSON.parse(localStorage.getItem("lightsOutBest")||"{}");lvl=Math.min(3,+localStorage.getItem("lightsOutLvl")||1)}catch(e){}
function flip(g,r,c){for(const[a,b]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const y=r+a,z=c+b;if(y>=0&&y<N&&z>=0&&z<N)g[y][z]^=1}}
function fresh(){
 let g;do{g=Array.from({length:N},()=>Array(N).fill(0));const used=new Set();while(used.size<SCR[lvl]){const k=Math.floor(Math.random()*N*N);if(!used.has(k)){used.add(k);flip(g,Math.floor(k/N),k%N)}}}while(g.every(r=>r.every(v=>!v)));
 start=g.map(r=>r.slice());reset()
}
function reset(){grid=start.map(r=>r.slice());moves=0;won=false;info()}
function info(){
 document.querySelector("#lv").textContent=LV[lvl];
 document.querySelector("#info").textContent=won?`Solved in ${moves} moves!${best[lvl]===moves?" New best!":""}`:`Moves: ${moves}${best[lvl]?"  ·  Best: "+best[lvl]:""}`
}
function press(r,c){
 if(won)return;flip(grid,r,c);moves+=1;flash={r,c,t:8};
 if(grid.every(row=>row.every(v=>!v))){won=true;if(!best[lvl]||moves<best[lvl]){best[lvl]=moves;try{localStorage.setItem("lightsOutBest",JSON.stringify(best))}catch(e){}}}
 info()
}
function setLvl(d){lvl=Math.max(0,Math.min(3,lvl+d));try{localStorage.setItem("lightsOutLvl",lvl)}catch(e){}fresh()}
C.addEventListener("pointerdown",e=>{e.preventDefault();const b=C.getBoundingClientRect(),c=Math.floor((e.clientX-b.left)/b.width*5),r=Math.floor((e.clientY-b.top)/b.height*5);if(r>=0&&r<N&&c>=0&&c<N)press(r,c)});
document.querySelector("#re").onclick=reset;document.querySelector("#nw").onclick=fresh;
document.querySelector("#dn").onclick=()=>setLvl(-1);document.querySelector("#up").onclick=()=>setLvl(1);
addEventListener("keydown",e=>{if(e.code==="KeyR")reset();if(e.code==="KeyN")fresh()});
function draw(){
 x.fillStyle="#111827";x.fillRect(0,0,400,400);
 for(let r=0;r<N;r+=1)for(let c=0;c<N;c+=1){
  const on=grid[r][c],px=c*S+5,py=r*S+5;
  x.fillStyle=on?"#facc15":"#1f2937";x.beginPath();x.roundRect(px,py,S-10,S-10,12);x.fill();
  if(on){x.fillStyle="rgb(255 255 255 / 45%)";x.beginPath();x.roundRect(px+8,py+8,S-26,16,8);x.fill()}
  if(flash&&flash.r===r&&flash.c===c&&flash.t>0){x.strokeStyle="#fff";x.lineWidth=4;x.beginPath();x.roundRect(px,py,S-10,S-10,12);x.stroke()}
 }
 if(flash){flash.t-=1;if(flash.t<=0)flash=null}
 if(won){x.fillStyle="rgb(2 6 23 / 60%)";x.fillRect(0,130,400,140);x.textAlign="center";x.fillStyle="#86efac";x.font="bold 44px Arial";x.fillText("ALL DARK!",200,200);x.font="bold 20px Arial";x.fillStyle="#fff";x.fillText("Press N for a new puzzle",200,240)}
}
function frame(){draw();requestAnimationFrame(frame)}
fresh();frame();
</script></body></html>

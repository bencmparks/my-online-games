<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meteor Dodge | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial;background:#090b1d;color:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle,#312e81,#090b1d)}main{width:min(100%,44rem);text-align:center;padding:1.5rem;border:1px solid #818cf8;border-radius:1rem;background:#111827}a{color:#c4b5fd}h1{color:#fbbf24}canvas{display:block;width:100%;height:auto;margin:1rem auto;border:3px solid #818cf8;border-radius:.6rem;touch-action:none}button{padding:.65rem 1rem;border:0;border-radius:.5rem;background:#fbbf24;color:#1e1b4b;font-weight:bold;cursor:pointer}#status{min-height:1.4rem;color:#fde68a;font-weight:bold}</style></head>
<body><main><a href="../">← All games</a><h1>☄️ Meteor Dodge</h1><p>Steer your ship with A/D or ←/→ and survive the meteor shower.</p><p>Score: <strong id="score">0</strong> · Best: <strong id="best">0</strong></p><canvas id="game" width="640" height="420" aria-label="Meteor Dodge game"></canvas><button id="restart">New flight</button><p id="status" aria-live="polite">Stay sharp, pilot.</p></main><script>
const c=document.querySelector("#game"),x=c.getContext("2d"),scoreEl=document.querySelector("#score"),bestEl=document.querySelector("#best"),status=document.querySelector("#status");let ship,rocks,score,best=+localStorage.meteorDodgeBest||0,keys=new Set(),last,live;bestEl.textContent=best;
function start(){ship={x:320,y:372};rocks=[];score=0;live=true;last=performance.now();status.textContent="Stay sharp, pilot.";requestAnimationFrame(loop)}
function loop(t){if(!live)return;let d=Math.min((t-last)/1000,.04);last=t;ship.x=Math.max(18,Math.min(622,ship.x+((keys.has("left")?-1:0)+(keys.has("right")?1:0))*300*d));if(Math.random()<d*1.7)rocks.push({x:20+Math.random()*600,y:-20,r:10+Math.random()*16,s:120+score*.8});rocks.forEach(r=>r.y+=r.s*d);score+=d*10;rocks=rocks.filter(r=>r.y<450);if(rocks.some(r=>Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+15)){live=false;if(score>best){best=Math.floor(score);localStorage.meteorDodgeBest=best;bestEl.textContent=best}status.textContent=`Impact! Score: ${Math.floor(score)}.`}scoreEl.textContent=Math.floor(score);draw();if(live)requestAnimationFrame(loop)}
function draw(){x.fillStyle="#090b1d";x.fillRect(0,0,640,420);x.fillStyle="#fff";for(let i=0;i<55;i++)x.fillRect((i*97)%640,(i*53)%420,2,2);rocks.forEach(r=>{x.fillStyle="#fb923c";x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill()});x.fillStyle="#67e8f9";x.beginPath();x.moveTo(ship.x,ship.y-18);x.lineTo(ship.x-15,ship.y+16);x.lineTo(ship.x+15,ship.y+16);x.fill()}
document.addEventListener("keydown",e=>{if(["ArrowLeft","a","A"].includes(e.key)){keys.add("left");e.preventDefault()}if(["ArrowRight","d","D"].includes(e.key)){keys.add("right");e.preventDefault()}});document.addEventListener("keyup",e=>{if(["ArrowLeft","a","A"].includes(e.key))keys.delete("left");if(["ArrowRight","d","D"].includes(e.key))keys.delete("right")});c.addEventListener("pointermove",e=>{let r=c.getBoundingClientRect();if(live)ship.x=(e.clientX-r.left)*640/r.width});document.querySelector("#restart").onclick=start;start();
</script></body></html>

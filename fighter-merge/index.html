<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fighter Merge | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#1a0b0b;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 50% 0,#991b1b,#1a0b0b)}
main{width:min(100%,30rem);padding:1.5rem;border:.2rem solid #f87171;border-radius:1.25rem;background:rgb(26 11 11 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.6rem 0;color:#fecaca;font-size:1.6rem}
.bar{display:flex;justify-content:space-between;gap:.5rem;font-weight:bold;color:#fde68a;margin:.5rem 0}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:1rem 0}
.slot{aspect-ratio:1;border:.15rem solid #7f1d1d;border-radius:.6rem;background:#2b1313;font-size:2rem;color:#fff;cursor:pointer;display:grid;place-items:center;position:relative;touch-action:manipulation;padding:0}
.slot small{position:absolute;right:.3rem;bottom:.15rem;font-size:.7rem;color:#fde68a}
.slot.sel{border-color:#fde047;box-shadow:0 0 .8rem #fde047}.slot.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.2)}}
.arena{display:flex;align-items:center;gap:.6rem;margin:.6rem 0;font-weight:bold}
.hp{flex:1;height:1rem;border-radius:.5rem;background:#450a0a;overflow:hidden}.hp i{display:block;height:100%;width:100%;transition:width .12s}
button.b{border:0;border-radius:.5rem;color:#1a0b0b;cursor:pointer;font:inherit;font-weight:bold;padding:.7rem 1rem;margin:.2rem;touch-action:manipulation}
button.b:disabled{opacity:.5;cursor:default}
#m{min-height:1.5rem;font-weight:bold}
#field{position:relative;height:11rem;margin:.5rem 0;border-radius:.6rem;background:linear-gradient(#3b1d1d,#1f0d0d);overflow:hidden}
.u{position:absolute;font-size:1.7rem;line-height:1;transition:transform .15s,opacity .4s,filter .4s,left .9s ease-in-out,top .9s ease-in-out;will-change:transform}
.u.enemy{transform:scaleX(-1)}
.proj{position:absolute;font-size:1.2rem;transition:left .35s linear,top .35s ease-out;pointer-events:none;z-index:2}
button.b+button.b{margin-left:.2rem}
.u.l1{transform:translateX(1.6rem)}.u.enemy.l1{transform:scaleX(-1) translateX(1.6rem)}
.u.dead{opacity:0;filter:grayscale(1);transform:rotate(80deg) translateY(.8rem)}
.fx{position:absolute;font-size:1.4rem;pointer-events:none;animation:fx .5s forwards}
@keyframes fx{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.6) translateY(-1rem)}}
#field .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:bold;color:#7f1d1d;font-size:2rem}
</style></head>
<body><main><a href="../">← All games</a><h1>🥊 Fighter Merge</h1>
<p>Recruit fighters and <strong>throwers</strong> (they stay back and hurl stuff), <strong>tap two of the same kind and level</strong> to merge them into a stronger one, then send your team to fight the waves. Tap a fighter then an empty slot to move it.</p>
<div class="bar"><span id="co">🪙 0</span><span id="wv">Wave 1</span><span id="bs">Best wave 1</span></div>
<div class="arena"><span>You</span><div class="hp"><i id="h1" style="background:#4ade80"></i></div><div class="hp"><i id="h2" style="background:#f87171"></i></div><span id="en">👹</span></div>
<div id="field" hidden></div><div id="m">Recruit and merge!</div>
<div id="grid"></div>
<button class="b" id="buy" type="button" style="background:#fbbf24"></button><button class="b" id="buyT" type="button" style="background:#fb923c"></button><button class="b" id="fight" type="button" style="background:#f87171">⚔️ Fight!</button>
</main>
<script>
const FACE=["👶","🧒","🧑","🥷","🤺","🧙","🦸","🥋","🐉","👑","🔥","⭐"],THR=["🤾","🧑‍🍳","🧑‍🌾","🧑‍🚀","🧑‍🎤","🧑‍🏫","🧑‍🔬","🧑‍🎨","🦹","🧝","🧞","🧑‍✈️"],AMMO=["🍅","🪨","🥫","🔪","🪃","🏐","🎯","🧨","☄️","💎","🔥","⭐"],face=v=>(v<0?THR:FACE)[Math.min(Math.abs(v),12)-1],N=12,G=document.querySelector("#grid"),$=s=>document.querySelector(s);
let st={coins:30,wave:1,best:1,bought:0,g:Array(N).fill(0)},sel=-1,busy=false,popI=-1;
try{const s=JSON.parse(localStorage.getItem("fighterMerge"));if(s&&s.g&&s.g.length===N)st=s}catch(e){}
const save=()=>{try{localStorage.setItem("fighterMerge",JSON.stringify(st))}catch(e){}},
 cost=()=>10+st.bought*4,costT=()=>cost()+6,pw=l=>Math.pow(3,Math.abs(l)-1),team=()=>st.g.reduce((a,l)=>a+(l?pw(l):0),0),foe=w=>Math.round(2.5*Math.pow(1.5,w-1));
function render(){
 G.innerHTML="";st.g.forEach((l,i)=>{const b=document.createElement("button");b.className="slot"+(i===sel?" sel":"")+(i===popI?" pop":"");b.setAttribute("aria-label",l?(l<0?"Thrower":"Fighter")+" level "+Math.abs(l):"Empty slot");b.innerHTML=l?face(l)+"<small>"+(l<0?AMMO[-l-1]:"")+"Lv"+Math.abs(l)+"</small>":"";b.onclick=()=>tapSlot(i);G.append(b)});
 $("#co").textContent="🪙 "+st.coins;$("#wv").textContent="Wave "+st.wave;$("#bs").textContent="Best wave "+st.best;
 $("#buy").textContent="Recruit 🪙"+cost();$("#buyT").textContent="Thrower 🪙"+costT();$("#buy").disabled=$("#buyT").disabled=busy;$("#fight").disabled=busy||!team();
 $("#h1").style.width=$("#h2").style.width="100%";$("#en").textContent=st.wave%5===0?"🐲":"👹";
 if(!busy)$("#m").textContent=`Team power ${team()} vs enemy ${foe(st.wave)}`}
function tapSlot(i){
 if(busy)return;popI=-1;
 if(sel<0){if(st.g[i])sel=i}
 else if(sel===i)sel=-1;
 else{const a=st.g[sel],b=st.g[i];
  if(a&&a===b&&Math.abs(a)<12){st.g[i]=a+Math.sign(a);st.g[sel]=0;popI=i}
  else{st.g[i]=a;st.g[sel]=b}
  sel=-1;save()}
 render()}
const recruit=th=>{const e=st.g.indexOf(0),c=th?costT():cost();if(e<0){$("#m").textContent="No room! Merge fighters first.";return}if(st.coins<c){$("#m").textContent="Not enough coins.";return}
 st.coins-=c;st.bought++;st.g[e]=th?-1:1;popI=e;sel=-1;save();render()};
$("#buy").onclick=()=>recruit(false);$("#buyT").onclick=()=>recruit(true);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$("#fight").onclick=async()=>{
 busy=true;sel=-1;render();const t=team(),f=foe(st.wave),w=t>=f,F=$("#field");$("#m").textContent="Fighting…";
 const mine=st.g.filter(l=>l>0).sort((a,b)=>b-a),thr=st.g.filter(l=>l<0).sort((a,b)=>a-b),ne=Math.min(10,2+st.wave),boss=st.wave%5===0;
 F.hidden=false;F.innerHTML='<div class="vs">VS</div>';
 const mk=(face,side,i,n,base=26)=>{const e=document.createElement("span"),cols=Math.ceil(n/5),c=Math.floor(i/5),r=i%5,rows=Math.min(5,n-c*5);
  e.className="u"+(side?" enemy":"");e.textContent=face;
  e._l=side?80-c*14:base+c*14;e._t=50+(r-(rows-1)/2)*18;e.style.left=e._l+"%";e.style.top=e._t+"%";e.style.marginTop="-.85rem";F.append(e);return e};
 const A=mine.map((l,i)=>mk(face(l),0,i,mine.length)),T=thr.map((l,i)=>mk(face(l),0,i,thr.length,4)),E=Array.from({length:ne},(_,i)=>mk(boss&&i===0?"🐲":"👹",1,i,ne));
 const fx=(el,ch)=>{const d=document.createElement("span");d.className="fx";d.textContent=ch;d.style.left=el.offsetLeft+"px";d.style.top=el.offsetTop+"px";F.append(d);setTimeout(()=>d.remove(),500)};
 const throwAt=(from,to,ch)=>{const p=document.createElement("span");p.className="proj";p.textContent=ch;p.style.left=from.offsetLeft+"px";p.style.top=from.offsetTop+"px";F.append(p);requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.left=to.offsetLeft+"px";p.style.top=to.offsetTop+"px"}));setTimeout(()=>p.remove(),400)},
  go=(u,tg,dir,j)=>{u.style.left=Math.max(2,Math.min(88,tg._l+dir*(8+Math.floor(j/3)*5)))+"%";u.style.top=Math.max(8,Math.min(86,tg._t+((j%3)-1)*10))+"%"},
  home=u=>{u.style.left=u._l+"%";u.style.top=u._t+"%"};
 await sleep(600);
 let fighting=true;const alive=l=>l.filter(u=>!u.classList.contains("dead")),pick=l=>l[Math.floor(Math.random()*l.length)];
 (async()=>{let tick=0;while(fighting){const le=alive(E);T.forEach((u,j)=>{if(u.classList.contains("dead")||!le.length)return;throwAt(u,pick(le),AMMO[-thr[j]-1])});
  if(tick++%4===0){const mine=alive([...A,...T]);if(mine.length)le.forEach((e,j)=>{if(j%2)throwAt(e,pick(mine),"🔥")})}
  await sleep(76)}})();
 const win=w,loser=w?[...E].sort((x,y)=>x._l-y._l):[...A].sort((x,y)=>y._l-x._l).concat([...T].sort((x,y)=>y._l-x._l)),n=loser.length,
  R=Math.min(14,Math.max(6,n+3)),rate=Math.min(60,(w?f/t:t/f)*60);let dead=0;
 for(let r=1;r<=R;r++){
  const la=alive(A),lt=alive(T),le=alive(E),mineT=la.length?la:lt,pairs=[];
  la.forEach((u,j)=>{const e=le[j%le.length];if(e)pairs.push([u,e])});
  le.forEach((e,j)=>{const u=mineT[j%mineT.length];if(u)pairs.push([e,u])});
  la.forEach((u,j)=>{const e=le[j%le.length];if(!e)return;u.style.left=Math.max(2,e._l-8-Math.floor(j/3)*4)+"%";u.style.top=Math.max(8,Math.min(86,e._t+((j%3)-1)*8))+"%"});
  await sleep(950);
  [...la,...le].forEach(u=>u.classList.add("l1"));
  pairs.forEach(([u,v])=>{if(Math.random()<.7)fx(v,u.classList.contains("enemy")?"💢":"💥")});
  await sleep(160);[...la,...le].forEach(u=>u.classList.remove("l1"));
  const want=Math.ceil(n*r/R);while(dead<want){loser[dead++].classList.add("dead")}
  const done=r/R;$(w?"#h2":"#h1").style.width=100*(1-done)+"%";$(w?"#h1":"#h2").style.width=(100-done*rate)+"%";
  await sleep(180)} fighting=false;[...A,...E].forEach(home);await sleep(500); if(w){const win=8+st.wave*5;st.coins+=win;$("#m").textContent=`Victory! +🪙${win}`;st.wave++;st.best=Math.max(st.best,st.wave)}
 else{const c=Math.ceil(costT()/4);st.coins+=c;$("#m").textContent=`Defeated! +🪙${c}. Merge up and try again.`}
 save();busy=false;$("#buy").disabled=$("#buyT").disabled=false;$("#fight").disabled=false;$("#co").textContent="🪙 "+st.coins;$("#wv").textContent="Wave "+st.wave;$("#bs").textContent="Best wave "+st.best;
 await sleep(1800);if(!busy)F.hidden=true};
render();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledge Throw | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:#0b1020}
main{width:min(100%,60rem);padding:1rem;border:.2rem solid #f59e0b;border-radius:1.25rem;background:rgb(8 12 30 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.4rem 0;color:#fcd34d;font-size:1.6rem}
canvas{display:block;width:100%;height:auto;margin:.6rem auto;border:.2rem solid #475569;border-radius:.4rem;touch-action:none;cursor:crosshair}
main:fullscreen{width:100vw;max-width:none;height:100vh;display:flex;flex-direction:column;justify-content:center;border-radius:0;overflow:auto}main:fullscreen canvas{width:auto;max-width:100%;max-height:calc(100vh - 11rem);margin:.4rem auto}main:fullscreen p{display:none}.row{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:.4rem 0}.row button{padding:.6rem .9rem;border:0;border-radius:.6rem;background:#b45309;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;user-select:none}.row button:disabled{opacity:.45;cursor:default}
</style></head>
<body><main><a href="../">← All games</a><h1>🪓 Ledge Throw</h1>
<p><strong>Click or tap</strong> to throw a ledge at the wall – it sticks where it hits. Climb your ledges to the 🚪 exit at the top! Move with <strong>A/D</strong> or <strong>◀ ▶</strong>, jump with <strong>W / Space</strong>. You only get a few ledges per level, so place them well. <strong>R</strong> restarts the level.</p>
<canvas id="c" width="900" height="640" aria-label="Ledge Throw game"></canvas>
<div class="row"><button id="l">◀</button><button id="j">⤒ Jump</button><button id="r">▶</button><button id="rs">↺ Restart</button><button id="fs">⛶ Fullscreen</button></div>
<div class="row" id="shop"></div>
</main>
<script>
const C=document.querySelector("#c"),x=C.getContext("2d"),W=900,H=640,WALLX=560,GY=0,KEY="ledgeThrowClimbSave",PW=18,PH=34;
let save={coins:0,level:1,up:{count:0,jump:0,len:0}};try{const s=JSON.parse(localStorage.getItem(KEY));if(s)save=Object.assign(save,s)}catch(e){}
const UP={count:{n:"Ledges",d:l=>`+${l} per level`},jump:{n:"Jump",d:l=>`${Math.round(620+l*35)}`},len:{n:"Ledge size",d:l=>`${90+l*12}px`}};
const cost=l=>Math.round(60*Math.pow(l+1,1.6));
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
let level,TOP,left,ledges,fly,p,state,cy,keys={},mouse={x:300,y:300},fx,frames=0,msg="";
const ledgeLen=()=>90+save.up.len*12;
function init(lv){level=lv===undefined?save.level:lv;TOP=-(420+level*60);left=Math.ceil(-TOP/115)+3+save.up.count;ledges=[];fly=[];fx=[];p={x:120,y:GY,vx:0,vy:0,g:true,f:1};state="play";cy=-540;msg="";shopUI()}
function throwAt(mx,my){if(state!=="play"||left<=0)return;const dx=mx-p.x,dy=my-(p.y-PH/2),d=Math.hypot(dx,dy)||1,v=Math.min(1100,d*2.6+250);fly.push({x:p.x,y:p.y-PH/2,vx:dx/d*v,vy:dy/d*v,r:0});left--}
function path(mx,my){const dx=mx-p.x,dy=my-(p.y-PH/2),d=Math.hypot(dx,dy)||1,v=Math.min(1100,d*2.6+250);let a=p.x,b=p.y-PH/2,vx=dx/d*v,vy=dy/d*v;const pts=[];for(let i=0;i<60;i++){vy+=900*.03;a+=vx*.03;b+=vy*.03;if(a>=WALLX||b>=GY)break;pts.push([a,b])}return pts}
function win(){state="won";const earn=20+level*6;save.coins+=earn;save.level=level+1;persist();msg=`+${earn} coins`;shopUI()}
function update(dt){
 for(const f of fx){f.t-=dt;f.y-=30*dt}fx=fx.filter(f=>f.t>0);
 for(const t of fly){t.vy+=900*dt;t.x+=t.vx*dt;t.y+=t.vy*dt;t.r+=dt*12;
  if(t.x>=WALLX){t.dead=1;if(t.y<GY-6&&t.y>TOP+4)ledges.push({y:t.y,x0:WALLX-ledgeLen()});else fx.push({x:WALLX-40,y:t.y,t:1,s:"missed"})}
  else if(t.y>=GY||t.x<-50){t.dead=1;fx.push({x:t.x,y:GY-20,t:1,s:"missed"})}}
 fly=fly.filter(t=>!t.dead);
 if(state==="play"){
  const mv=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);if(mv)p.f=mv;
  p.vx+=(mv*230-p.vx)*Math.min(1,dt*12);
  if((keys.KeyW||keys.ArrowUp||keys.Space)&&p.g){p.vy=-(620+save.up.jump*35);p.g=false}
  const py=p.y;p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.g=false;
  if(p.x<PW/2)p.x=PW/2;
  
  if(p.y>TOP+6&&p.x>WALLX-PW/2)p.x=WALLX-PW/2;
  if(p.x>WALLX+190)p.x=WALLX+190;
  if(p.y>=GY){p.y=GY;p.vy=0;p.g=true}
  if(p.vy>=0){
   for(const l of ledges)if(p.x+PW/2>l.x0&&p.x-PW/2<WALLX&&py<=l.y+2&&p.y>=l.y){p.y=l.y;p.vy=0;p.g=true}
   if(p.x+PW/2>WALLX&&py<=TOP+2&&p.y>=TOP){p.y=TOP;p.vy=0;p.g=true}}
  if(p.y<=TOP&&p.x>WALLX+60&&p.x<WALLX+150&&p.g)win();
 }
 const ty=p.y-380;cy+=(Math.max(TOP-300,Math.min(-540,ty))-cy)*Math.min(1,dt*5);
}
function text(s,a,b,size,col,al="center"){x.font=`bold ${size}px Arial`;x.textAlign=al;x.fillStyle=col;x.lineWidth=4;x.strokeStyle="#0f172a";x.lineJoin="round";x.strokeText(s,a,b);x.fillText(s,a,b)}
function plank(x0,y,len){x.fillStyle="#92400e";x.fillRect(x0,y,len,10);x.fillStyle="#d97706";x.fillRect(x0,y,len,4);x.fillStyle="#451a03";for(let k=x0+14;k<x0+len-6;k+=22)x.fillRect(k,y+5,3,3)}
function man(px,py,f){x.save();x.translate(px,py);x.scale(f,1);x.strokeStyle="#fde047";x.fillStyle="#fde047";x.lineWidth=3;x.lineCap="round";const w=p.g&&Math.abs(p.vx)>20?Math.sin(frames/3)*5:0;x.beginPath();x.moveTo(0,-14);x.lineTo(0,-34+22);x.moveTo(0,-12);x.lineTo(7,-8+(p.g?0:-6));x.moveTo(0,-12);x.lineTo(-6,-7);x.moveTo(0,-14+0);x.lineTo(0,-12);x.moveTo(0,-14);x.lineTo(-5+w,0);x.moveTo(0,-14);x.lineTo(5-w,0);x.stroke();x.beginPath();x.arc(0,-29,6,0,6.3);x.fill();x.restore()}
function draw(){
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1e3a8a");g.addColorStop(1,"#7dd3fc");x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();x.translate(0,-cy);
 const vt=cy,vb=cy+H;
 x.fillStyle="#57534e";x.fillRect(WALLX,Math.max(TOP,vt-10),W-WALLX,Math.min(GY,vb+10)-Math.max(TOP,vt-10));
 x.fillStyle="#4f4b47";for(let k=Math.floor(vt/70)-1;k<vb/70+1;k++){const yy=k*70;if(yy<TOP||yy>GY)continue;x.fillRect(WALLX+20+((k*37)%5)*40,yy,22,4);x.fillRect(WALLX+((k*53)%4)*50+60,yy+30,18,4)}
 x.fillStyle="#a8a29e";x.fillRect(WALLX-6,Math.max(TOP,vt-10),6,Math.min(GY,vb+10)-Math.max(TOP,vt-10));
 x.fillStyle="#57534e";x.fillRect(WALLX,TOP,200,14);x.fillStyle="#65a30d";x.fillRect(WALLX,TOP,200,5);
 x.fillStyle="#365314";x.fillRect(0,GY,W,2000);x.fillStyle="#65a30d";x.fillRect(0,GY,W,10);
 x.fillStyle="#78350f";x.fillRect(WALLX+70,TOP-46,46,46);x.fillStyle="#fbbf24";x.fillRect(WALLX+75,TOP-41,36,41);text("EXIT",WALLX+93,TOP-54,16,"#fff");
 for(const l of ledges)plank(l.x0,l.y,ledgeLen());
 for(const t of fly){x.save();x.translate(t.x,t.y);x.rotate(t.r);x.fillStyle="#d97706";x.fillRect(-ledgeLen()/2,-4,ledgeLen(),8);x.restore()}
 if(state==="play"&&left>0&&!fly.length){x.strokeStyle="#fff9";x.lineWidth=3;x.setLineDash([6,8]);x.beginPath();let first=true;x.moveTo(p.x,p.y-PH/2);for(const q of path(mouse.x,mouse.y))x.lineTo(q[0],q[1]);x.stroke();x.setLineDash([])}
 man(p.x,p.y,p.f);
 for(const f of fx){x.globalAlpha=Math.min(1,f.t*2);text(f.s,f.x,f.y,18,"#fca5a5");x.globalAlpha=1}
 x.restore();
 text(`Level ${level}`,14,32,26,"#fff","left");text(`Ledges: ${left}`,14,62,22,left?"#fcd34d":"#f87171","left");text(`🪙 ${save.coins}`,W-14,32,24,"#fde047","right");text(`Height ${Math.max(0,Math.round(-p.y/10))}/${Math.round(-TOP/10)}m`,W-14,60,18,"#bae6fd","right");
 if(state==="play"&&left===0&&!fly.length&&!ledges.some(l=>l.y<p.y-1)){text("Out of ledges! Press R to retry",W/2,100,26,"#f87171")}
 if(state==="won"){x.fillStyle="#000a";x.fillRect(0,0,W,H);text("Level complete!",W/2,H/2-50,46,"#fcd34d");text(msg,W/2,H/2,28,"#fde047");text("Press Space or click for the next level",W/2,H/2+50,20,"#cbd5e1")}
}
function shopUI(){const s=document.querySelector("#shop");s.innerHTML="";for(const k in UP){const l=save.up[k],c=cost(l),bt=document.createElement("button");bt.textContent=`${UP[k].n} Lv${l} (${UP[k].d(l)}) – 🪙${c}`;bt.disabled=save.coins<c;bt.onclick=()=>{if(save.coins>=c){save.coins-=c;save.up[k]++;persist();const lv=level;init(lv)}};s.appendChild(bt)}}
function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height+cy}}
C.addEventListener("pointermove",e=>{mouse=pos(e)});
C.addEventListener("pointerdown",e=>{mouse=pos(e);if(state==="won")init(save.level);else throwAt(mouse.x,mouse.y)});
addEventListener("keydown",e=>{keys[e.code]=1;if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();if(e.code==="KeyR")init(level);if(e.code==="KeyF")fsToggle();if(e.code==="Space"&&state==="won")init(save.level)});
addEventListener("keyup",e=>keys[e.code]=0);
for(const[id,c]of[["l","ArrowLeft"],["r","ArrowRight"],["j","Space"]]){const e=document.querySelector("#"+id);e.addEventListener("pointerdown",()=>keys[c]=1);e.addEventListener("pointerup",()=>keys[c]=0);e.addEventListener("pointerleave",()=>keys[c]=0)}
document.querySelector("#rs").onclick=()=>init(level);
const fsToggle=()=>{const m=document.querySelector("main");if(document.fullscreenElement)document.exitFullscreen();else if(m.requestFullscreen)m.requestFullscreen().catch(()=>{})};
document.querySelector("#fs").onclick=fsToggle;
let last=performance.now();function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;frames++;update(dt);draw();requestAnimationFrame(loop)}
init();requestAnimationFrame(loop);
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombie Apocalypse 3D | My Online Games</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f8fafc}
*{box-sizing:border-box}
body{margin:0;padding:1rem;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101827 20%,#1b3427 100%)}
main{width:min(100%,60rem);text-align:center}
a{color:#cbd5e1}
h1{margin:.3rem 0;color:#86efac}
p{margin:.4rem 0;color:#cbd5e1}
canvas{display:block;width:100%;height:auto;border:.3rem solid #36543b;border-radius:.75rem;background:#000;cursor:crosshair;touch-action:none}
button{margin:.5rem .25rem 0;padding:.6rem 1.1rem;border:1px solid #4b6382;border-radius:.5rem;background:#86efac;color:#102019;font:inherit;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<main>
<a href="../">← All games</a> · <a href="./">2D version</a>
<h1>Zombie Apocalypse 3D</h1>
<p>Click the screen to aim with the mouse. WASD to move, click or Space to shoot, Shift to sprint, P to pause. Coins and upgrades are shared with the 2D game. Use the Shop button to buy upgrades and pets.</p>
<canvas id="c" width="960" height="540"></canvas>
<button id="start">Start new run</button>
<div id="tbtns"><button id="tfire">🔥 FIRE</button><button id="tpause">⏸</button></div>
<style>#tbtns{display:none;justify-content:center;gap:.5rem}#tbtns button{min-width:6rem;min-height:3.5rem;font-size:1.2rem;touch-action:none;user-select:none;-webkit-user-select:none}@media(pointer:coarse){#tbtns{display:flex}}</style>
<button id="shopbtn">Shop (pauses)</button>
<section id="shop" hidden style="margin-top:1rem;padding:1rem;border:1px solid #4b6382;border-radius:.75rem;background:#17243a">
<h2>Upgrades</h2>
<p>🪙 Coins: <strong id="coins">0</strong></p>
<div id="items" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.5rem"></div>
</section>
</main>
<script src="../shared/profile.js"></script>
<script>
const cv=document.getElementById("c"),g=cv.getContext("2d"),W=cv.width,H=cv.height;
const KEY="zombie-apocalypse";
const prog=GameProfiles.getGame(KEY,{coins:0,vestLevel:0,blasterLevel:0,bootsLevel:0,catLevel:0,dogLevel:0,protectorDogLevel:0});
prog.catLevel=Math.min(prog.catLevel??0,3);
prog.dogLevel=Math.min(prog.dogLevel??prog.petLevel??0,3);
prog.protectorDogLevel=Math.min(prog.protectorDogLevel??0,1);
const UPS=[
  ["vest","🛡️ Vest +20 health",0],["blaster","🔫 Blaster +1 damage",0],["boots","👟 Boots +15 speed",0],
  ["cat","🐈 Collector cat, max 3",3],["dog","🐕 Fighter dog, max 3",3],["protectorDog","🦮 Protector dog, max 1",1]];
const upCost=u=>u==="cat"||u==="dog"?3000:u==="protectorDog"?10000:10+prog[u+"Level"]*15;
function buildShop(){
  const box=document.getElementById("items");box.innerHTML="";
  document.getElementById("coins").textContent=prog.coins;
  for(const [u,label,max] of UPS){
    const b=document.createElement("button"),c=upCost(u),lv=prog[u+"Level"];
    b.textContent=`${label} (${c} coins)${max?` [${lv}/${max}]`:` [Lv ${lv}]`}`;
    b.disabled=prog.coins<c||(max&&lv>=max);
    b.onclick=()=>{
      prog.coins-=c;prog[u+"Level"]++;GameProfiles.saveGame(KEY,prog);
      if(P){
        if(u==="vest"){P.max+=20;P.hp=Math.min(P.max,P.hp+20)}
        if(u==="boots")P.speed+=15;
        if(u==="cat")pets.push({k:"cat",x:P.x,z:P.z,cd:0});
        if(u==="dog")pets.push({k:"dog",x:P.x,z:P.z,cd:0});
        if(u==="protectorDog")pets.push({k:"pdog",x:P.x,z:P.z,cd:0});
      }
      buildShop();
    };
    box.append(b);
  }
}
const shopEl=document.getElementById("shop");
document.getElementById("shopbtn").onclick=()=>{
  if(document.pointerLockElement)document.exitPointerLock();
  if(running)paused=true;
  shopEl.hidden=!shopEl.hidden;buildShop();
};
function makePets(){
  const a=[];
  for(let i=0;i<prog.catLevel;i++)a.push({k:"cat",x:P.x,z:P.z,cd:0});
  for(let i=0;i<prog.dogLevel;i++)a.push({k:"dog",x:P.x,z:P.z,cd:0});
  if(prog.protectorDogLevel)a.push({k:"pdog",x:P.x,z:P.z,cd:0});
  return a;
}
function updatePets(dt){
  pets.forEach((p,i)=>{
    p.cd=Math.max(0,p.cd-dt);
    let tx,tz,sp=190;
    const a=yaw+Math.PI/2+i*1.1;
    tx=P.x+Math.sin(a)*70;tz=P.z+Math.cos(a)*70;
    if(p.k==="cat"){
      let bd=1e9;for(const d of drops){if(d.k!=="coin")continue;const m=Math.hypot(d.x-p.x,d.z-p.z);if(m<bd){bd=m;tx=d.x;tz=d.z}}
      sp=210;
    }else if(p.k==="dog"){
      let bd=1e9,t=null;for(const z of zs){const m=Math.hypot(z.x-p.x,z.z-p.z);if(m<bd){bd=m;t=z}}
      if(t){tx=t.x;tz=t.z}sp=220;
    }
    const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
    if(d>8){p.x+=dx/d*Math.min(sp*dt,d);p.z+=dz/d*Math.min(sp*dt,d)}
    if(p.k==="cat"||p.k==="pdog"){
      const r=p.k==="cat"?30:40;
      for(let j=drops.length-1;j>=0;j--){const o=drops[j];
        if(o.k==="coin"&&Math.hypot(o.x-p.x,o.z-p.z)<r){runCoins+=o.v;prog.coins+=o.v;drops.splice(j,1)}}
    }
    if(p.k==="dog"||p.k==="pdog"){
      const reach=p.k==="dog"?45:220;
      let bd=1e9,t=null;for(const z of zs){const m=Math.hypot(z.x-p.x,z.z-p.z);if(m<bd){bd=m;t=z}}
      if(t&&bd<reach+t.sz*.4&&p.cd===0){
        t.hp-=p.k==="dog"?1:4;t.hit=.1;p.cd=p.k==="dog"?.6:.35;
        if(t.hp<=0)kill(t);
      }
    }
  });
}
const SIZE=1500,FOV=Math.PI/2.4,F=(W/2)/Math.tan(FOV/2),NEAR=8;
const keys=new Set();
let P,zs,drops,flashes,pets=[],score,wave,running,paused,last,spawn,fireT,hurt,rapid,runCoins,shake,msg,msgT;
let yaw=0,pitch=0;

function start(){
  P={x:0,z:0,hp:100+prog.vestLevel*20,max:100+prog.vestLevel*20,speed:230+prog.bootsLevel*15};
  zs=[];drops=[];flashes=[];pets=makePets();score=0;wave=1;running=true;paused=false;spawn=1;fireT=0;hurt=0;rapid=0;runCoins=0;shake=0;
  yaw=0;pitch=0;last=performance.now();note("Wave 1");
  requestAnimationFrame(loop);
}
function note(t){msg=t;msgT=2}

addEventListener("keydown",e=>{
  if(e.code==="KeyP"&&running)paused=!paused;
  if(e.code==="Space")e.preventDefault();
  keys.add(e.code);
});
addEventListener("keyup",e=>keys.delete(e.code));
cv.addEventListener("click",()=>{if(document.pointerLockElement!==cv)cv.requestPointerLock?.()});
document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement===cv){yaw+=e.movementX*0.0025;pitch=Math.max(-.4,Math.min(.4,pitch-e.movementY*0.0025))}
});
let mouseDown=false,touchFire=false;
const tv={f:0,s:0};
// touch: left third of the screen is a move stick, the rest drags to look
const tp={};
cv.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse")return;
  const r=cv.getBoundingClientRect(),left=(e.clientX-r.left)<r.width*.4;
  tp[e.pointerId]={left,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove",e=>{
  const t=tp[e.pointerId];if(!t)return;
  if(t.left){const dx=(e.clientX-t.sx)/50,dy=(e.clientY-t.sy)/50;tv.s=Math.max(-1,Math.min(1,dx));tv.f=Math.max(-1,Math.min(1,-dy))}
  else{yaw+=(e.clientX-t.lx)*.006;pitch=Math.max(-.4,Math.min(.4,pitch-(e.clientY-t.ly)*.004));t.lx=e.clientX;t.ly=e.clientY}
});
["pointerup","pointercancel"].forEach(n=>cv.addEventListener(n,e=>{const t=tp[e.pointerId];if(t&&t.left){tv.f=0;tv.s=0}delete tp[e.pointerId]}));
function bindHold(id,on,off){const b=document.getElementById(id);b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);on()});["pointerup","pointercancel"].forEach(n=>b.addEventListener(n,off))}
cv.addEventListener("mousedown",()=>mouseDown=true);
addEventListener("mouseup",()=>mouseDown=false);
document.getElementById("start").onclick=()=>{running=false;setTimeout(start,30)};

function zombieKind(){
  const r=Math.random();
  if(wave>=3&&r<.2)return{t:"runner",hp:2+prog.blasterLevel*0+Math.floor(wave/4),sp:200,sz:44,col:"#7dd3a8",dmg:8,val:2};
  if(wave>=4&&r<.35)return{t:"brute",hp:8+wave,sp:75,sz:70,col:"#4d7c4f",dmg:20,val:5};
  return{t:"walker",hp:3+Math.floor(wave/3),sp:90+wave*3,sz:52,col:"#86b86e",dmg:12,val:1};
}
function spawnZ(){
  const k=zombieKind(),a=Math.random()*Math.PI*2,d=SIZE-60;
  let x=P.x+Math.cos(a)*d*.9,z=P.z+Math.sin(a)*d*.9;
  x=Math.max(-SIZE+40,Math.min(SIZE-40,x));z=Math.max(-SIZE+40,Math.min(SIZE-40,z));
  zs.push({...k,maxhp:k.hp,x,z,ph:Math.random()*6});
}
function shoot(){
  const dmg=1+prog.blasterLevel;
  const fx=Math.sin(yaw),fz=Math.cos(yaw);
  let best=null,bd=1e9;
  for(const z of zs){
    const dx=z.x-P.x,dz=z.z-P.z,fw=dx*fx+dz*fz,lat=dx*fz-dz*fx;
    if(fw>0&&Math.abs(lat)<z.sz*.45&&fw<bd){bd=fw;best=z}
  }
  flashes.push({t:.08});shake=.05;
  if(best){
    best.hp-=dmg;best.x+=fx*10;best.z+=fz*10;best.hit=.1;
    if(best.hp<=0)kill(best);
  }
}
function kill(z){
  zs.splice(zs.indexOf(z),1);score++;
  drops.push({x:z.x,z:z.z,k:"coin",v:z.val,life:20});
  if(Math.random()<.12)drops.push({x:z.x+20,z:z.z,k:Math.random()<.5?"heal":"rapid",life:15});
  const w=1+Math.floor(score/10);
  if(w>wave){wave=w;note("Wave "+wave)}
}

function update(dt){
  const sprint=keys.has("ShiftLeft")||keys.has("ShiftRight");
  let f=0,s=0;
  if(keys.has("KeyW")||keys.has("ArrowUp"))f++;
  if(keys.has("KeyS")||keys.has("ArrowDown"))f--;
  if(keys.has("KeyD"))s++;
  if(keys.has("KeyA"))s--;
  f+=tv.f;s+=tv.s;
  f=Math.max(-1,Math.min(1,f));s=Math.max(-1,Math.min(1,s));
  if(keys.has("ArrowLeft"))yaw-=2*dt;
  if(keys.has("ArrowRight"))yaw+=2*dt;
  const sp=P.speed*(sprint?1.4:1),len=Math.hypot(f,s)||1;
  P.x+=(Math.sin(yaw)*f+Math.cos(yaw)*s)/len*sp*dt*(f||s?1:0);
  P.z+=(Math.cos(yaw)*f-Math.sin(yaw)*s)/len*sp*dt*(f||s?1:0);
  P.x=Math.max(-SIZE+20,Math.min(SIZE-20,P.x));P.z=Math.max(-SIZE+20,Math.min(SIZE-20,P.z));
  rapid=Math.max(0,rapid-dt);hurt=Math.max(0,hurt-dt);shake=Math.max(0,shake-dt);msgT-=dt;
  fireT-=dt;
  if((mouseDown||touchFire||keys.has("Space"))&&fireT<=0){shoot();fireT=rapid>0?.1:.28}
  spawn-=dt;
  if(spawn<=0&&zs.length<10+wave*3){spawnZ();spawn=Math.max(.35,1.4-wave*.08)}
  for(const z of zs){
    const dx=P.x-z.x,dz=P.z-z.z,d=Math.hypot(dx,dz)||1;
    z.ph+=dt*6;z.hit=Math.max(0,(z.hit||0)-dt);
    if(d>z.sz*.7){z.x+=dx/d*z.sp*dt;z.z+=dz/d*z.sp*dt}
    else{z.cd=(z.cd||0)-dt;if(z.cd<=0){P.hp-=z.dmg;z.cd=.8;hurt=.3;shake=.15}}
  }
  for(let i=0;i<zs.length;i++)for(let j=i+1;j<zs.length;j++){
    const a=zs[i],b=zs[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz),m=(a.sz+b.sz)*.3;
    if(d>0&&d<m){const p=(m-d)/2;a.x-=dx/d*p;a.z-=dz/d*p;b.x+=dx/d*p;b.z+=dz/d*p}
  }
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.life-=dt;
    if(Math.hypot(d.x-P.x,d.z-P.z)<45){
      if(d.k==="coin"){runCoins+=d.v;prog.coins+=d.v}
      else if(d.k==="heal")P.hp=Math.min(P.max,P.hp+30);
      else rapid=8;
      drops.splice(i,1);
    }else if(d.life<=0)drops.splice(i,1);
  }
  for(const f of flashes)f.t-=dt;
  updatePets(dt);
  flashes=flashes.filter(f=>f.t>0);
  if(P.hp<=0){
    P.hp=0;running=false;GameProfiles.saveGame(KEY,prog);
  }
}

function cam(x,z){
  const dx=x-P.x,dz=z-P.z;
  return{r:dx*Math.cos(yaw)-dz*Math.sin(yaw),f:dx*Math.sin(yaw)+dz*Math.cos(yaw)};
}
const horizon=()=>H/2+pitch*H;
function scr(r,f,y){return[W/2+F*r/f,horizon()+F*(70-y)/f]}
// line in world, near clipped; y is height above ground
function line(x1,z1,y1,x2,z2,y2){
  let a=cam(x1,z1),b=cam(x2,z2);
  if(a.f<NEAR&&b.f<NEAR)return;
  if(a.f<NEAR){const t=(NEAR-a.f)/(b.f-a.f);a={r:a.r+(b.r-a.r)*t,f:NEAR}}
  if(b.f<NEAR){const t=(NEAR-b.f)/(a.f-b.f);b={r:b.r+(a.r-b.r)*t,f:NEAR}}
  const p=scr(a.r,a.f,y1),q=scr(b.r,b.f,y2);
  g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();
}
function wall(x1,z1,x2,z2,col){
  const pts=[[x1,z1],[x2,z2]].map(p=>cam(p[0],p[1]));
  let [a,b]=pts;
  if(a.f<NEAR&&b.f<NEAR)return;
  if(a.f<NEAR){const t=(NEAR-a.f)/(b.f-a.f);a={r:a.r+(b.r-a.r)*t,f:NEAR}}
  if(b.f<NEAR){const t=(NEAR-b.f)/(a.f-b.f);b={r:b.r+(a.r-b.r)*t,f:NEAR}}
  const t1=scr(a.r,a.f,260),b1=scr(a.r,a.f,0),t2=scr(b.r,b.f,260),b2=scr(b.r,b.f,0);
  const shade=Math.max(.25,1-Math.min(a.f,b.f)/2600);
  g.fillStyle=col;g.globalAlpha=shade;
  g.beginPath();g.moveTo(...t1);g.lineTo(...t2);g.lineTo(...b2);g.lineTo(...b1);g.closePath();g.fill();
  g.globalAlpha=1;
}
function drawZombie(z,c){
  const s=F/c.f,x=W/2+F*c.r/c.f,gy=horizon()+F*70/c.f;
  const h=z.sz*1.9*s,w=z.sz*s,bob=Math.sin(z.ph)*w*.05;
  const fog=Math.max(.3,1-c.f/2200);
  g.globalAlpha=fog;
  g.fillStyle="rgba(0,0,0,.35)";g.beginPath();g.ellipse(x,gy,w*.6,w*.15,0,0,7);g.fill();
  const col=z.hit>0?"#fff":z.col;
  // legs
  g.fillStyle="#2b3a55";
  g.fillRect(x-w*.3,gy-h*.4,w*.25,h*.4+bob);g.fillRect(x+w*.05,gy-h*.4,w*.25,h*.4-bob);
  // torso
  g.fillStyle=z.t==="brute"?"#5b2a2a":"#6b4a3a";
  g.fillRect(x-w*.4,gy-h*.75,w*.8,h*.4);
  // arms
  g.fillStyle=col;
  g.fillRect(x-w*.7,gy-h*.72+bob,w*.3,h*.1);g.fillRect(x+w*.4,gy-h*.72-bob,w*.3,h*.1);
  g.fillRect(x-w*.7,gy-h*.72+bob,w*.12,h*.3);g.fillRect(x+w*.58,gy-h*.72-bob,w*.12,h*.3);
  // head
  g.fillRect(x-w*.25,gy-h*.98,w*.5,h*.24);
  g.fillStyle="#e11d48";
  g.fillRect(x-w*.17,gy-h*.9,w*.1,h*.04);g.fillRect(x+w*.07,gy-h*.9,w*.1,h*.04);
  g.fillStyle="#000";g.fillRect(x-w*.12,gy-h*.8,w*.24,h*.03);
  if(z.hp<z.maxhp){
    g.fillStyle="#450a0a";g.fillRect(x-w*.4,gy-h*1.08,w*.8,h*.04);
    g.fillStyle="#ef4444";g.fillRect(x-w*.4,gy-h*1.08,w*.8*z.hp/z.maxhp,h*.04);
  }
  g.globalAlpha=1;
}
function drawPet(p,c){
  const s=F/c.f,x=W/2+F*c.r/c.f,y=horizon()+F*(70-14)/c.f;
  g.font=`${Math.max(10,34*s)}px Arial`;g.textAlign="center";g.fillStyle="#fff";
  g.fillText(p.k==="cat"?"🐈":p.k==="dog"?"🐕":"🦮",x,y);
}
function drawDrop(d,c,t){
  const s=F/c.f,x=W/2+F*c.r/c.f,y=horizon()+F*(70-18-Math.sin(t*4)*6)/c.f,r=12*s;
  g.fillStyle=d.k==="coin"?"#facc15":d.k==="heal"?"#22c55e":"#38bdf8";
  g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.fillStyle="#000";g.font=`bold ${Math.max(8,r*1.2)}px Arial`;g.textAlign="center";
  g.fillText(d.k==="coin"?"$":d.k==="heal"?"+":"»",x,y+r*.4);
}

function draw(t){
  const sx=shake?(Math.random()-.5)*shake*40:0,sy=shake?(Math.random()-.5)*shake*40:0;
  g.save();g.translate(sx,sy);
  const hz=horizon();
  let sky=g.createLinearGradient(0,0,0,hz);sky.addColorStop(0,"#0b1020");sky.addColorStop(1,"#3b2a4a");
  g.fillStyle=sky;g.fillRect(-20,-20,W+40,Math.max(0,hz)+20);
  let gr=g.createLinearGradient(0,hz,0,H);gr.addColorStop(0,"#1c2b1f");gr.addColorStop(1,"#0d1710");
  g.fillStyle=gr;g.fillRect(-20,hz,W+40,H-hz+20);
  // moon
  const mx=((W/2+((-yaw*400)%1600)+1600)%1600)-300;
  g.fillStyle="#e5e7eb";g.beginPath();g.arc(mx,hz-180,28,0,7);g.fill();
  // walls
  wall(-SIZE,SIZE,SIZE,SIZE,"#3b4a3f");wall(-SIZE,-SIZE,SIZE,-SIZE,"#3b4a3f");
  wall(-SIZE,-SIZE,-SIZE,SIZE,"#46564a");wall(SIZE,-SIZE,SIZE,SIZE,"#46564a");
  // grid floor
  g.strokeStyle="rgba(134,239,172,.16)";g.lineWidth=1;
  const gs=150,x0=Math.max(-SIZE,Math.floor((P.x-1200)/gs)*gs),x1=Math.min(SIZE,P.x+1200);
  const z0=Math.max(-SIZE,Math.floor((P.z-1200)/gs)*gs),z1=Math.min(SIZE,P.z+1200);
  for(let x=Math.ceil(x0/gs)*gs;x<=x1;x+=gs)line(x,Math.max(-SIZE,z0),0,x,Math.min(SIZE,z1),0);
  for(let z=Math.ceil(z0/gs)*gs;z<=z1;z+=gs)line(Math.max(-SIZE,x0),z,0,Math.min(SIZE,x1),z,0);
  // sprites
  const items=[];
  for(const z of zs){const c=cam(z.x,z.z);if(c.f>NEAR)items.push({c,z})}
  for(const d of drops){const c=cam(d.x,d.z);if(c.f>NEAR)items.push({c,d})}
  for(const p of pets){const c=cam(p.x,p.z);if(c.f>NEAR)items.push({c,p})}
  items.sort((a,b)=>b.c.f-a.c.f);
  for(const it of items){if(it.z)drawZombie(it.z,it.c);else if(it.p)drawPet(it.p,it.c);else drawDrop(it.d,it.c,t/1000)}
  // gun + muzzle flash
  g.fillStyle="#334155";g.fillRect(W/2+60,H-120,50,120);g.fillStyle="#1e293b";g.fillRect(W/2+70,H-150,30,40);
  if(flashes.length){g.fillStyle="#fde047";g.beginPath();g.arc(W/2+85,H-155,22,0,7);g.fill()}
  // crosshair
  g.strokeStyle="#fff";g.lineWidth=2;g.beginPath();
  g.moveTo(W/2-10,H/2);g.lineTo(W/2-3,H/2);g.moveTo(W/2+3,H/2);g.lineTo(W/2+10,H/2);
  g.moveTo(W/2,H/2-10);g.lineTo(W/2,H/2-3);g.moveTo(W/2,H/2+3);g.lineTo(W/2,H/2+10);g.stroke();
  g.restore();
  if(hurt>0){g.fillStyle=`rgba(220,38,38,${hurt})`;g.fillRect(0,0,W,H)}
  // HUD
  g.textAlign="left";g.font="bold 18px Arial";g.fillStyle="#fff";
  g.fillText(`Wave ${wave}   Kills ${score}   Coins ${prog.coins} (+${runCoins})`,16,28);
  g.fillStyle="#450a0a";g.fillRect(16,40,220,16);
  g.fillStyle="#22c55e";g.fillRect(16,40,220*Math.max(0,P.hp)/P.max,16);
  if(rapid>0){g.fillStyle="#38bdf8";g.fillText(`Rapid fire ${rapid.toFixed(0)}s`,16,78)}
  // minimap
  g.fillStyle="rgba(0,0,0,.5)";g.fillRect(W-130,10,120,120);
  const mp=(x,z)=>[W-70+x/SIZE*55,70+z/SIZE*55];
  g.fillStyle="#ef4444";
  for(const z of zs){const p=mp(z.x-P.x*0,z.z-P.z*0);g.fillRect(p[0]-1.5,p[1]-1.5,3,3)}
  const pp=mp(P.x,P.z);g.fillStyle="#86efac";g.fillRect(pp[0]-2,pp[1]-2,4,4);
  g.strokeStyle="#86efac";g.beginPath();g.moveTo(pp[0],pp[1]);g.lineTo(pp[0]+Math.sin(yaw)*8,pp[1]+Math.cos(yaw)*8);g.stroke();
  g.textAlign="center";
  if(msgT>0){g.font="bold 42px Arial";g.fillStyle=`rgba(255,255,255,${Math.min(1,msgT)})`;g.fillText(msg,W/2,110)}
  if(paused){g.fillStyle="rgba(0,0,0,.6)";g.fillRect(0,0,W,H);g.fillStyle="#fff";g.font="bold 48px Arial";g.fillText("Paused",W/2,H/2)}
  if(!running&&P.hp<=0){
    g.fillStyle="rgba(0,0,0,.7)";g.fillRect(0,0,W,H);g.fillStyle="#fca5a5";g.font="bold 54px Arial";
    g.fillText("The horde got you",W/2,H/2-20);
    g.fillStyle="#fff";g.font="22px Arial";g.fillText(`Wave ${wave} · ${score} kills · +${runCoins} coins`,W/2,H/2+30);
  }
}
function loop(t){
  if(!running){draw(t);return}
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(!paused)update(dt);
  draw(t);
  if(running)requestAnimationFrame(loop);else draw(t);
}
bindHold("tfire",()=>touchFire=true,()=>touchFire=false);
document.getElementById("tpause").addEventListener("click",()=>{if(running)paused=!paused});
start();
addEventListener("beforeunload",()=>GameProfiles.saveGame(KEY,prog));setInterval(()=>{if(running)GameProfiles.saveGame(KEY,prog)},5000);
</script>
</body>

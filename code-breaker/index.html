<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Breaker | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:#0b1020}
main{width:min(100%,32rem);padding:1rem;border:.2rem solid #a78bfa;border-radius:1.25rem;background:rgb(8 12 30 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.4rem 0;color:#c4b5fd;font-size:1.6rem}
.row{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:.3rem 0}.peg{width:2.2rem;height:2.2rem;border-radius:50%;background:#1e293b;border:2px solid #475569;padding:0;cursor:pointer}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:2.2rem}.fb i{width:.9rem;height:.9rem;border-radius:50%;background:#1e293b;display:block}.fb i.b{background:#f8fafc}.fb i.w{background:#ef4444}
.idx{width:1.4rem;color:#64748b;font-size:.8rem}.cur .peg{border-color:#fde047}.pal .peg{width:2.6rem;height:2.6rem}
button.act{margin:.2rem;padding:.5rem .9rem;border:0;border-radius:.6rem;background:#6d28d9;color:#fff;font-weight:bold;cursor:pointer;font-size:1rem}button.act:disabled{opacity:.4}#msg{min-height:1.6rem;font-weight:bold;color:#fde047}
</style></head><body><main>
<a href="../">← All games</a>
<h1>🔐 Code Breaker</h1>
<p>Crack the secret code of 4 colors (colors can repeat) in 10 tries. After each guess: <b>white dot</b> = right color in the right place, <b>red dot</b> = right color in the wrong place.</p>
<div id="board"></div><div class="row pal" id="pal"></div><div class="row"><button class="act" id="del">⌫ Undo</button><button class="act" id="go" disabled>Check ✔</button><button class="act" id="new">New code</button></div><div id="msg"></div>
</main><script>
const COLS=["#ef4444","#3b82f6","#22c55e","#eab308","#a855f7","#f97316"],L=4,TRIES=10;
const board=document.querySelector("#board"),pal=document.querySelector("#pal"),go=document.querySelector("#go"),msg=document.querySelector("#msg");
let secret,guesses,cur,over;
function newGame(){secret=Array.from({length:L},()=>Math.random()*COLS.length|0);guesses=[];cur=[];over=false;msg.textContent="";render()}
function score(g){let b=0,w=0;const sc=[...secret],gc=[...g];for(let i=0;i<L;i++)if(gc[i]===sc[i]){b++;sc[i]=gc[i]=-1}
 for(let i=0;i<L;i++)if(gc[i]>=0){const j=sc.indexOf(gc[i]);if(j>=0){w++;sc[j]=-2}}return[b,w]}
function peg(c,click){const p=document.createElement("button");p.className="peg";if(c!==undefined)p.style.background=COLS[c];if(click)p.onclick=click;else p.disabled=true;return p}
function render(){board.innerHTML="";
 for(let r=0;r<TRIES;r++){const row=document.createElement("div");row.className="row"+(r===guesses.length&&!over?" cur":"");const n=document.createElement("span");n.className="idx";n.textContent=r+1;row.append(n);
  const g=guesses[r]||(r===guesses.length&&!over?cur:[]);for(let i=0;i<L;i++)row.append(peg(g[i]));
  const fb=document.createElement("div");fb.className="fb";if(guesses[r]){const[b,w]=guesses[r].s;for(let i=0;i<L;i++){const d=document.createElement("i");if(i<b)d.className="b";else if(i<b+w)d.className="w";fb.append(d)}}else for(let i=0;i<L;i++)fb.append(document.createElement("i"));row.append(fb);board.append(row)}
 if(over){const row=document.createElement("div");row.className="row";const n=document.createElement("span");n.textContent="Code:";row.append(n);secret.forEach(c=>row.append(peg(c)));board.append(row)}
 go.disabled=over||cur.length<L}
COLS.forEach((c,i)=>{const p=peg(i,()=>{if(!over&&cur.length<L){cur.push(i);render()}});p.disabled=false;pal.append(p)});
document.querySelector("#del").onclick=()=>{if(!over){cur.pop();render()}};
go.onclick=()=>{const s=score(cur);guesses.push(Object.assign([...cur],{s}));cur=[];
 if(s[0]===L){over=true;msg.textContent=`🎉 Cracked it in ${guesses.length} ${guesses.length===1?"try":"tries"}!`}else if(guesses.length>=TRIES){over=true;msg.textContent="💥 Out of tries! The code is shown below."}render()};
document.querySelector("#new").onclick=newGame;
newGame();
</script><script src="../ads.js"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Memory Match | My Online Games</title><style>
:root{font-family:Arial,sans-serif;background:#101827;color:#f8fafc}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1.5rem;background:linear-gradient(135deg,#101827,#312e81)}main{width:min(100%,40rem);padding:1.5rem;border:1px solid #6366f1;border-radius:1rem;background:#17243a;text-align:center}a{color:#c7d2fe}h1{color:#c4b5fd}.stats{color:#e0e7ff}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem;margin:1rem 0}.card{aspect-ratio:1;border:0;border-radius:.65rem;background:#4338ca;color:transparent;cursor:pointer;font-size:clamp(1.5rem,6vw,2.5rem)}.card.open,.card.matched{background:#e0e7ff;color:#1e1b4b}.card.matched{background:#a7f3d0}button{padding:.65rem 1rem;border:0;border-radius:.5rem;background:#c4b5fd;color:#312e81;cursor:pointer;font:inherit;font-weight:bold}#status{min-height:1.5rem;color:#fef3c7;font-weight:bold}</style></head>
<body><main><a href="../">← All games</a> · <a href="../profile/">Profile</a><h1>Memory Match</h1><p class="stats" id="profile"></p><p class="stats">Moves: <span id="moves">0</span> · Time: <span id="time">0</span>s · Best: <span id="best">—</span></p><div class="board" id="board" aria-label="Memory cards"></div><button id="new-game" type="button">New game</button><p id="status" aria-live="polite"></p></main><script src="../shared/profile.js"></script><script>
const icons=["🌸","🦩","🌴","☀️","🦐","🌊","💖","✨"];const board=document.querySelector("#board"),movesEl=document.querySelector("#moves"),timeEl=document.querySelector("#time"),bestEl=document.querySelector("#best"),statusEl=document.querySelector("#status");document.querySelector("#profile").textContent=GameProfiles.getActiveProfileName()?`Saving to ${GameProfiles.getActiveProfileName()}`:"Play without a profile; create one to save results.";
let state,first,lock,timer;
function start(){clearInterval(timer);state={cards:[...icons,...icons].sort(()=>Math.random()-.5).map((icon,index)=>({icon,index,matched:false,open:false})),moves:0,seconds:0,best:GameProfiles.getGame("memory-match",{bestMoves:null,bestSeconds:null,wins:0})};first=null;lock=false;timer=setInterval(()=>{state.seconds++;drawStats()},1000);statusEl.textContent="Find all matching pairs.";render()}
function render(){board.replaceChildren();state.cards.forEach(card=>{const b=document.createElement("button");b.className=`card${card.open?" open":""}${card.matched?" matched":""}`;b.textContent=card.icon;b.disabled=card.matched;b.addEventListener("click",()=>flip(card.index));board.append(b)});drawStats()}
function drawStats(){movesEl.textContent=state.moves;timeEl.textContent=state.seconds;bestEl.textContent=state.best.bestMoves===null?"—":`${state.best.bestMoves} moves / ${state.best.bestSeconds}s`}
function flip(index){if(lock)return;const card=state.cards[index];if(card.open||card.matched)return;card.open=true;if(first===null){first=index;render();return}state.moves++;const prior=state.cards[first];if(prior.icon===card.icon){prior.matched=card.matched=true;first=null;if(state.cards.every(item=>item.matched)){clearInterval(timer);state.best.wins++;if(state.best.bestMoves===null||state.moves<state.best.bestMoves||(state.moves===state.best.bestMoves&&state.seconds<state.best.bestSeconds)){state.best.bestMoves=state.moves;state.best.bestSeconds=state.seconds}GameProfiles.saveGame("memory-match",state.best);statusEl.textContent="You matched every pair! Your result was saved."}render();return}lock=true;render();setTimeout(()=>{prior.open=card.open=false;first=null;lock=false;render()},700)}
document.querySelector("#new-game").addEventListener("click",start);start();
</script></body></html>

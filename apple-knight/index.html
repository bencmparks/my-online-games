<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Apple Knight</title>
<style>
body{margin:0;background:#1d2b1f;color:#fff;font-family:system-ui,sans-serif;text-align:center;user-select:none;touch-action:none}
a{color:#9fe870}canvas{background:#8fd3ff;max-width:100%;border:3px solid #3b2a1a;image-rendering:pixelated}
p{margin:6px 10px;font-size:14px}
#tc{display:none;justify-content:space-between;padding:6px 14px}
#tc div{display:flex;gap:8px}
#tc button{width:62px;height:62px;font-size:22px;border-radius:50%;border:2px solid #fff6;background:#0007;color:#fff}
@media(pointer:coarse){#tc{display:flex}}
</style></head><body>
<p><a href="../">&larr; Games</a></p>
<canvas id="c" width="900" height="480"></canvas>
<p>Arrows/A D move &bull; Up/W/Space jump (twice in the air) &bull; Z/J sword &bull; X/K throw an apple (costs 1) &bull; collect apples to heal and to throw</p>
<div id="tc"><div><button id="bl">◀</button><button id="br">▶</button></div><div><button id="bs">⚔</button><button id="bt">🍎</button><button id="bj">⤒</button></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const T=40,GR=10,W=900,H=480,MAXL=8;
let state='title',lvl=0,lvlsDone=+(localStorage.getItem('apple-knight-level')||0),best=+(localStorage.getItem('apple-knight-best')||0);
let solids,enemies,apples,shots,parts,goal,p,cam=0,score=0,len,msg='',msgT=0;
const keys={};let jumpBuf=0,jumpHeld=false,atkPress=false,thrPress=false;
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function gen(n){
  const r=rng(n*7919+13);len=50+n*10;
  solids=[];enemies=[];apples=[];shots=[];parts=[];
  let x=0;
  const seg=[];
  while(x<len){
    let w=x<6?8:4+Math.floor(r()*7);
    if(x+w>len-6)w=len-x;
    seg.push([x,w]);
    solids.push({x:x*T,y:GR*T,w:w*T,h:2*T,g:1});
    x+=w;
    if(x<len-8){
      const gap=2+Math.floor(r()*Math.min(2,1+n/3));
      // platform over the gap
      if(r()<.6){solids.push({x:(x+gap/2-.5)*T,y:(GR-2)*T,w:T*1.5,h:16})}
      x+=gap;
    }
  }
  // floating platforms and steps
  for(let i=0;i<len/5;i++){
    const px=(8+r()*(len-14))*T,py=(GR-2-Math.floor(r()*3))*T;
    solids.push({x:px,y:py,w:T*(2+Math.floor(r()*2)),h:16});
    if(r()<.7)apples.push({x:px+T*1,y:py-30});
  }
  // enemies on ground segments
  seg.forEach(([sx,sw],i)=>{
    if(i==0||i==seg.length-1)return;
    if(sw>=4&&r()<.5+n*.05){
      const type=r()<.25+n*.04?'knightE':'slime';
      enemies.push({type,x:(sx+1+r()*(sw-2))*T,y:(GR)*T-30,w:30,h:30,vx:(r()<.5?-1:1)*(type=='slime'?50:70),l:sx*T+10,rr:(sx+sw)*T-40,hp:type=='slime'?1:3,hit:0,ground:true});
    }
    if(r()<.2+n*.04)enemies.push({type:'bat',x:(sx+sw/2)*T,y:(GR-4)*T,w:30,h:22,by:(GR-4)*T,t:r()*6,vx:0,hp:1,hit:0});
    // ground apples
    if(r()<.6)for(let k=0;k<2;k++)apples.push({x:(sx+1+k)*T+8,y:GR*T-30});
  });
  goal={x:(len-3)*T,y:(GR-2)*T,w:T,h:2*T};
  p={x:60,y:(GR)*T-44,w:26,h:40,vx:0,vy:0,dir:1,on:false,jumps:0,hp:3,inv:0,atk:0,atkCd:0,thrCd:0,ammo:3,wall:0,fall:0};
  cam=0;
}
function start(n){lvl=n;gen(n);state='play';score=state=='play'?score:0}
function hitRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function moveBody(o,dx,dy){
  o.x+=dx;
  for(const s of solids){if(s.h<30&&dy!==undefined&&false)continue;
    if(s.g||s.h>=T){if(hitRect(o,s)){if(dx>0)o.x=s.x-o.w;else if(dx<0)o.x=s.x+s.w}}}
  o.y+=dy;o.on=false;
  for(const s of solids){
    if(!hitRect(o,s))continue;
    if(s.g){if(dy>0){o.y=s.y-o.h;o.vy=0;o.on=true}else if(dy<0){o.y=s.y+s.h;o.vy=0}}
    else{ // one-way platform
      if(dy>0&&o.y+o.h-dy<=s.y+4){o.y=s.y-o.h;o.vy=0;o.on=true}
    }
  }
}
function puff(x,y,c,n=6){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*200,vy:-Math.random()*200,t:.5,c})}
function hurt(){
  if(p.inv>0)return;
  p.hp--;p.inv=1.2;p.vy=-350;p.vx=-p.dir*200;puff(p.x+13,p.y+20,'#e33',10);
  if(p.hp<=0){state='dead'}
}
function update(dt){
  if(state!=='play')return;
  const L=keys.ArrowLeft||keys.a||keys.A,R=keys.ArrowRight||keys.d||keys.D;
  const acc=(R?1:0)-(L?1:0);
  if(acc)p.dir=acc;
  p.vx=p.vx*.0+acc*210+(p.kb||0);if(p.kb)p.kb*=.85;
  // wall: solid walls are only ground sides
  p.vy+=1700*dt;if(p.vy>800)p.vy=800;
  if(jumpBuf>0)jumpBuf-=dt;
  if(jumpBuf>0){
    if(p.on||p.coy>0){p.vy=-620;p.jumps=1;jumpBuf=0;p.on=false;p.coy=0}
    else if(p.jumps<2){p.vy=-560;p.jumps=2;jumpBuf=0;puff(p.x+13,p.y+40,'#fff',6)}
  }
  if(!jumpHeld&&p.vy<-220)p.vy=-220;
  moveBody(p,p.vx*dt,0);
  const wasOn=p.on;
  moveBody(p,0,p.vy*dt);
  if(p.on){p.jumps=0;p.coy=.1}else if(p.coy>0)p.coy-=dt;
  if(p.x<0)p.x=0;
  if(p.y>H+80){p.hp=0;state='dead'}
  if(p.inv>0)p.inv-=dt;
  if(p.atkCd>0)p.atkCd-=dt;if(p.thrCd>0)p.thrCd-=dt;
  if(p.atk>0)p.atk-=dt;
  if(atkPress&&p.atkCd<=0){p.atk=.2;p.atkCd=.35}
  if(thrPress&&p.thrCd<=0&&p.ammo>0){p.ammo--;p.thrCd=.3;shots.push({x:p.x+13,y:p.y+12,vx:p.dir*420,vy:-180,t:2})}
  atkPress=thrPress=false;
  const sw={x:p.dir>0?p.x+p.w:p.x-40,y:p.y+4,w:40,h:30};
  // enemies
  for(const e of enemies){
    if(e.hp<=0)continue;
    if(e.hit>0)e.hit-=dt;
    if(e.type=='bat'){e.t+=dt*2;e.x+=Math.cos(e.t)*80*dt;e.y=e.by+Math.sin(e.t*1.5)*40;
      if(Math.abs(e.x-p.x)<200&&Math.abs(e.y-p.y)<200){e.x+=Math.sign(p.x-e.x)*60*dt}}
    else{
      e.x+=e.vx*dt;if(e.x<e.l){e.x=e.l;e.vx=Math.abs(e.vx)}if(e.x>e.rr){e.x=e.rr;e.vx=-Math.abs(e.vx)}
    }
    if(p.atk>0&&hitRect(sw,e)&&e.hit<=0){e.hp--;e.hit=.3;e.x+=p.dir*20;puff(e.x+15,e.y+10,'#fff',5);if(e.hp<=0)kill(e)}
    else if(hitRect(p,e)){
      if(p.vy>150&&p.y+p.h-e.y<18&&e.type!=='knightE'){e.hp=0;kill(e);p.vy=-420;p.jumps=1}
      else hurt();
    }
  }
  for(const s of shots){
    s.t-=dt;s.vy+=900*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    for(const e of enemies)if(e.hp>0&&s.t>0&&hitRect({x:s.x-6,y:s.y-6,w:12,h:12},e)){e.hp-=2;e.hit=.3;s.t=0;puff(s.x,s.y,'#e33',6);if(e.hp<=0)kill(e)}
    for(const o of solids)if(o.g&&s.t>0&&hitRect({x:s.x-5,y:s.y-5,w:10,h:10},o)){s.t=0;puff(s.x,s.y,'#c22',4);
      }
  }
  shots=shots.filter(s=>s.t>0);
  for(const a of apples){
    if(!a.got&&hitRect(p,{x:a.x-4,y:a.y-4,w:28,h:28})){a.got=true;p.ammo=Math.min(9,p.ammo+1);score+=10;
      if(p.ammo>=9&&p.hp<5){}}
  }
  // eating: every 5 apples picked heals
  const got=apples.filter(a=>a.got).length;
  if(got>0&&got%5==0&&p.lastHeal!==got){p.lastHeal=got;if(p.hp<5){p.hp++;msg='Apple snack! +1 heart';msgT=1.5}}
  parts.forEach(q=>{q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt});
  parts=parts.filter(q=>q.t>0);
  if(msgT>0)msgT-=dt;
  if(hitRect(p,goal)){
    score+=100+p.hp*20;
    if(lvl+1>lvlsDone){lvlsDone=lvl+1;localStorage.setItem('apple-knight-level',lvlsDone)}
    if(score>best){best=score;localStorage.setItem('apple-knight-best',best)}
    state=lvl+1>=MAXL?'end':'win';
  }
  cam=Math.max(0,Math.min(len*T-W,p.x-W/2+60));
}
function kill(e){score+=e.type=='knightE'?40:20;puff(e.x+15,e.y+10,'#fc4',10);
  if(Math.random()<.5)apples.push({x:e.x,y:e.y,drop:true})}
function px(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x-cam),Math.round(y),w,h)}
function draw(){
  g.clearRect(0,0,W,H);
  const th=lvl%4;
  const sky=['#8fd3ff','#ffc58a','#6d6aa8','#9ad1a0'][th];
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  // hills
  g.fillStyle=['#7bc47f','#d9885a','#4e4b88','#6fb27a'][th];
  for(let i=0;i<8;i++){const hx=((i*260-cam*.3)%(W+300)+W+300)%(W+300)-150;g.beginPath();g.arc(hx,GR*T+30,110+i%3*30,Math.PI,0);g.fill()}
  if(state==='title'){return}
  const gc=['#5a3a1e','#7a4a2a','#2c2a50','#4a3a22'][th],top=['#4caf50','#c08a40','#6a66c0','#7cb342'][th];
  for(const s of solids){
    if(s.x-cam>W||s.x+s.w-cam<0)continue;
    if(s.g){px(s.x,s.y,s.w,s.h,gc);px(s.x,s.y,s.w,10,top)}
    else{px(s.x,s.y,s.w,10,'#8d6e63');px(s.x,s.y+10,s.w,4,'#5d4037')}
  }
  // goal flag
  px(goal.x+16,goal.y,5,goal.h,'#ddd');px(goal.x+21,goal.y+2,24,16,'#e53935');
  for(const a of apples){if(a.got)continue;px(a.x,a.y,20,20,'#e53935');px(a.x+4,a.y+3,5,5,'#ff8a80');px(a.x+9,a.y-6,3,7,'#5d4037');px(a.x+12,a.y-6,8,5,'#43a047')}
  for(const e of enemies){
    if(e.hp<=0)continue;
    const f=e.hit>0?'#fff':null;
    if(e.type=='slime'){px(e.x,e.y+8,e.w,22,f||'#66bb6a');px(e.x+4,e.y,e.w-8,10,f||'#66bb6a');px(e.x+7,e.y+10,5,5,'#000');px(e.x+19,e.y+10,5,5,'#000')}
    else if(e.type=='bat'){px(e.x+8,e.y+4,14,14,f||'#4a148c');px(e.x-6,e.y+(Math.sin(e.t*8)>0?0:8),14,8,f||'#6a1b9a');px(e.x+22,e.y+(Math.sin(e.t*8)>0?0:8),14,8,f||'#6a1b9a');px(e.x+11,e.y+8,3,3,'#ff0');px(e.x+17,e.y+8,3,3,'#ff0')}
    else{px(e.x,e.y,e.w,e.h,f||'#8e0000');px(e.x+3,e.y-4,e.w-6,12,f||'#b0b0b0');px(e.x+6,e.y+4,18,3,'#000');px(e.x+(e.vx>0?e.w:-10),e.y+10,10,4,'#ccc')}
  }
  for(const s of shots){px(s.x-6,s.y-6,12,12,'#e53935');px(s.x-1,s.y-9,2,4,'#5d4037')}
  // player
  if(!(p.inv>0&&Math.floor(p.inv*14)%2)){
    const d=p.dir;
    px(p.x+3,p.y+14,20,18,'#b0bec5');px(p.x+4,p.y,18,16,'#cfd8dc');px(p.x+6,p.y+6,14,4,'#263238');
    px(p.x+11,p.y-6,4,8,'#e53935');px(p.x+4,p.y+32,8,8,'#546e7a');px(p.x+14,p.y+32,8,8,'#546e7a');
    px(p.x+(d>0?18:-2),p.y+16,8,10,'#e53935');
    if(p.atk>0){px(p.x+(d>0?p.w:-40),p.y+14,40,6,'#eceff1');px(p.x+(d>0?p.w:-40),p.y+12,40,2,'#fff')}
    else px(p.x+(d>0?22:0),p.y+10,4,20,'#eceff1');
  }
  for(const q of parts)px(q.x,q.y,4,4,q.c);
  // HUD
  g.fillStyle='#0006';g.fillRect(0,0,W,34);
  g.font='bold 18px system-ui';g.fillStyle='#fff';g.textAlign='left';
  for(let i=0;i<Math.max(3,p.hp);i++){g.fillStyle=i<p.hp?'#e53935':'#555';g.fillText('♥',10+i*22,24)}
  g.fillStyle='#fff';g.fillText('🍎 '+p.ammo,140,24);g.fillText('Level '+(lvl+1)+'/'+MAXL,230,24);g.fillText('Score '+score,360,24);
  g.textAlign='right';g.fillText('Best '+best,W-10,24);
  if(msgT>0){g.textAlign='center';g.fillStyle='#fff';g.fillText(msg,W/2,70)}
}
function overlay(t,s,b){
  g.fillStyle='#000a';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#fff';
  g.font='bold 48px system-ui';g.fillText(t,W/2,190);g.font='20px system-ui';
  s.split('\n').forEach((l,i)=>g.fillText(l,W/2,235+i*28));
  g.fillStyle='#9fe870';g.fillText(b,W/2,400);
}
function drawTitle(){
  g.fillStyle='#8fd3ff';g.fillRect(0,0,W,H);
  g.fillStyle='#4caf50';g.fillRect(0,400,W,80);
  // big apple knight
  g.fillStyle='#e53935';g.beginPath();g.arc(W/2,260,90,0,7);g.fill();
  g.fillStyle='#43a047';g.fillRect(W/2+5,150,40,20);g.fillStyle='#5d4037';g.fillRect(W/2-3,150,6,30);
  g.fillStyle='#b0bec5';g.fillRect(W/2-70,225,140,50);g.fillStyle='#263238';g.fillRect(W/2-50,240,100,12);
  g.fillStyle='#fff';g.fillRect(W/2-8,244,16,4);
  g.fillStyle='#000';g.textAlign='center';g.font='bold 56px system-ui';g.fillText('Apple Knight',W/2,90);
  g.font='20px system-ui';g.fillText(lvlsDone?`Reached level ${Math.min(MAXL,lvlsDone+1)} &bull; Best ${best}`.replace('&bull;','•'):'Collect apples. Slay slimes, bats and dark knights.',W/2,440);
  g.fillStyle='#fff';g.fillText('Press Enter / tap to start'+(lvlsDone&&lvlsDone<MAXL?' (continue at level '+(lvlsDone+1)+')':''),W/2,380);
}
let last=performance.now();
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  update(dt);
  if(state==='title')drawTitle();
  else{draw();
    if(state==='win')overlay('Level clear!','Score '+score+'\nNext: level '+(lvl+2),'Press Enter / tap');
    if(state==='dead')overlay('Knight down','Score '+score,'Press Enter / tap to retry');
    if(state==='end')overlay('The kingdom is saved!','All 8 levels cleared\nFinal score '+score,'Press Enter / tap to play again');
  }
  requestAnimationFrame(loop);
}
function action(){
  if(state==='title'){score=0;start(lvlsDone>=MAXL?0:lvlsDone)}
  else if(state==='win'){start(lvl+1)}
  else if(state==='dead'){const s=score;start(lvl);score=Math.max(0,s-30)}
  else if(state==='end'){score=0;start(0)}
}
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.key=='Enter')action();
  if(state=='play'){
    if(['ArrowUp','w','W',' '].includes(e.key)&&!e.repeat){jumpBuf=.12;jumpHeld=true}
    if(['z','Z','j','J'].includes(e.key))atkPress=true;
    if(['x','X','k','K'].includes(e.key))thrPress=true;
  }
});
addEventListener('keyup',e=>{keys[e.key]=false;if(['ArrowUp','w','W',' '].includes(e.key))jumpHeld=false});
cv.addEventListener('pointerdown',()=>{if(state!=='play')action()});
function hold(id,fn,up){const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play'){action();return}fn()});
  if(up)b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up||(()=>{}))}
hold('bl',()=>keys.ArrowLeft=true,()=>keys.ArrowLeft=false);
hold('br',()=>keys.ArrowRight=true,()=>keys.ArrowRight=false);
hold('bj',()=>{jumpBuf=.12;jumpHeld=true},()=>jumpHeld=false);
hold('bs',()=>atkPress=true);hold('bt',()=>thrPress=true);
gen(0);requestAnimationFrame(loop);
</script></body></html>

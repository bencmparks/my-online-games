<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Element Playground | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:#0b1020}
main{width:min(100%,46rem);padding:1rem;border:.2rem solid #f97316;border-radius:1.25rem;background:#111827;text-align:center}a{color:#fdba74}h1{margin:.3rem 0;color:#fdba74;font-size:1.6rem}
canvas{width:100%;image-rendering:pixelated;background:#000;border-radius:.5rem;touch-action:none;cursor:crosshair}
#pal{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin:.5rem 0}#pal button,.ctl button{padding:.4rem .6rem;border:.15rem solid transparent;border-radius:.5rem;background:#1f2937;color:#fff;font-weight:700;cursor:pointer}#pal button.on{border-color:#fff}
.ctl{display:flex;gap:.5rem;justify-content:center;align-items:center;flex-wrap:wrap}
</style></head>
<body><main><a href="../">← All games</a><h1>🔥 Element Playground</h1>
<p>Pick an element and paint. Try fire on wood, water on lava, acid on stone, or lighting gunpowder!</p>
<canvas id="c" width="640" height="400"></canvas>
<div id="pal"></div>
<div class="ctl"><label>Brush <input id="br" type="range" min="1" max="8" value="3"></label><button id="pause">Pause</button><button id="clr">Clear</button></div>
</main>
<script src="../ads.js"></script>
<script>
const W=160,H=100,S=4,cv=document.getElementById("c"),cx=cv.getContext("2d"),img=cx.createImageData(W,H);
const E=[["Eraser",0,"#000"],["Sand",1,"#e3c16f"],["Water",2,"#3b82f6"],["Stone",3,"#6b7280"],["Wood",4,"#92400e"],["Fire",5,"#f97316"],["Oil",6,"#4a3b1f"],["Plant",7,"#22c55e"],["Ice",8,"#bae6fd"],["Lava",9,"#dc2626"],["Steam",10,"#cbd5e1"],["Acid",11,"#a3e635"],["Smoke",12,"#374151"],["Gunpowder",13,"#a1a1aa"]];
const COL=E.map(e=>{const h=e[2];return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]});
const SAND=1,WATER=2,STONE=3,WOOD=4,FIRE=5,OIL=6,PLANT=7,ICE=8,LAVA=9,STEAM=10,ACID=11,SMOKE=12,GUN=13;
let g=new Uint8Array(W*H),life=new Uint8Array(W*H),cur=1,paused=false,down=false,mx=0,my=0;
const at=(x,y)=>x<0||y<0||x>=W||y>=H?255:g[y*W+x];
const set=(x,y,v,l)=>{if(x<0||y<0||x>=W||y>=H)return;g[y*W+x]=v;life[y*W+x]=l||0};
const R=n=>Math.random()*n|0;
const liquid=v=>v===WATER||v===OIL||v===ACID||v===LAVA;
const flam=v=>v===WOOD||v===OIL||v===PLANT||v===GUN;
function swap(a,b,c,d){const i=b*W+a,j=d*W+c,t=g[i];g[i]=g[j];g[j]=t;const l=life[i];life[i]=life[j];life[j]=l}
function dens(v){return v===0?0:v===STEAM||v===SMOKE?-1:v===OIL?2:v===WATER?3:v===ACID?4:v===LAVA?6:9}
function step(){
 const dir=Math.random()<.5;
 for(let y=H-1;y>=0;y--)for(let k=0;k<W;k++){const x=dir?k:W-1-k,v=g[y*W+x];if(!v||v===STONE||v===255)continue;
  const dx=Math.random()<.5?-1:1;
  if(v===SAND||v===GUN){const b=at(x,y+1);
   if(b===0||liquid(b)&&dens(b)<9&&b!==LAVA){swap(x,y,x,y+1)}
   else if(at(x+dx,y+1)===0||liquid(at(x+dx,y+1))&&at(x+dx,y+1)!==LAVA)swap(x,y,x+dx,y+1);
   if(v===SAND&&at(x,y+1)===ACID&&false){}
  }else if(v===WATER||v===OIL||v===ACID||v===LAVA){
   const b=at(x,y+1);
   if(b===0||dens(b)<dens(v)&&dens(b)>=0&&b!==STONE&&b<14&&!(b===WOOD||b===SAND)&&false)swap(x,y,x,y+1);
   else if(b===0||(b===STEAM||b===SMOKE))swap(x,y,x,y+1);
   else if(dens(b)>=0&&dens(b)<dens(v)&&liquid(b))swap(x,y,x,y+1);
   else if(at(x+dx,y)===0)swap(x,y,x+dx,y);
   else if(at(x+dx,y+1)===0)swap(x,y,x+dx,y+1);
   if(v===WATER){for(const[ax,ay]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=at(x+ax,y+ay);
     if(n===FIRE){set(x+ax,y+ay,STEAM,60);if(Math.random()<.3)set(x,y,STEAM,60)}
     else if(n===LAVA){set(x+ax,y+ay,STONE);set(x,y,STEAM,60)}}}
   if(v===LAVA){for(const[ax,ay]of[[1,0],[-1,0],[0,-1]]){const n=at(x+ax,y+ay);
     if(flam(n)&&Math.random()<.3)set(x+ax,y+ay,FIRE,30+R(30));else if(n===ICE)set(x+ax,y+ay,WATER);else if(n===0&&Math.random()<.02)set(x+ax,y+ay,FIRE,20)}}
   if(v===ACID){for(const[ax,ay]of[[1,0],[-1,0],[0,1]]){const n=at(x+ax,y+ay);
     if(n&&n!==ACID&&n!==255&&n!==WATER&&n!==LAVA&&Math.random()<.15){set(x+ax,y+ay,0);set(x,y,Math.random()<.4?SMOKE:0,40);break}}}
  }else if(v===FIRE){
   if(--life[y*W+x]<=0||life[y*W+x]>200){set(x,y,Math.random()<.4?SMOKE:0,50);continue}
   for(const[ax,ay]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=at(x+ax,y+ay);
    if(n===GUN){boom(x+ax,y+ay)}
    else if(flam(n)&&Math.random()<(n===OIL?.5:.15))set(x+ax,y+ay,FIRE,25+R(30));
    else if(n===ICE)set(x+ax,y+ay,WATER)}
   if(Math.random()<.5&&at(x+R(3)-1,y-1)===0)swap(x,y,x+R(3)-1,y-1)
  }else if(v===STEAM||v===SMOKE){
   if(--life[y*W+x]<=0||life[y*W+x]>200){set(x,y,v===STEAM&&Math.random()<.5?WATER:0);continue}
   const nx=x+R(3)-1;if(at(nx,y-1)===0)swap(x,y,nx,y-1);else if(at(nx,y)===0)swap(x,y,nx,y);
  }else if(v===PLANT){if(Math.random()<.05){const a=[[1,0],[-1,0],[0,-1]][R(3)];if(at(x+a[0],y+a[1])===0&&Math.random()<.4&&[[0,1],[1,0],[-1,0],[0,-1]].some(d=>at(x+d[0]+a[0],y+d[1]+a[1])===WATER)){const wx=x+a[0],wy=y+a[1];set(wx,wy,PLANT)}}
   for(const[ax,ay]of[[1,0],[-1,0],[0,1],[0,-1]])if(at(x+ax,y+ay)===WATER&&Math.random()<.02){set(x+ax,y+ay,PLANT);break}
  }else if(v===ICE){for(const[ax,ay]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=at(x+ax,y+ay);if(n===WATER&&Math.random()<.01)set(x+ax,y+ay,ICE);if(n===FIRE||n===LAVA||n===STEAM&&false){set(x,y,WATER);break}}}
 }}
function boom(x,y){for(let j=-4;j<=4;j++)for(let i=-4;i<=4;i++)if(i*i+j*j<=16){const n=at(x+i,y+j);if(n!==STONE&&n!==255)set(x+i,y+j,Math.random()<.6?FIRE:SMOKE,20+R(20))}}
function draw(){const d=img.data;for(let i=0;i<W*H;i++){const v=g[i],c=COL[v],n=v?(i*7%5)*4:0;let r=c[0],gg=c[1],b=c[2];if(v===FIRE){gg=60+R(120);r=255;b=0}else if(v===LAVA){gg=40+(i*3+tick)%60}
 d[i*4]=Math.min(255,r+n);d[i*4+1]=Math.min(255,gg+n);d[i*4+2]=Math.min(255,b+n);d[i*4+3]=255}
 cx.putImageData(img,0,0);cx.imageSmoothingEnabled=false;cx.drawImage(cv,0,0,W,H,0,0,W*S,H*S)}
let tick=0;
function paint(){if(!down)return;const r=+br.value;for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(i*i+j*j<=r*r&&(cur===0||Math.random()<.5)){const x=mx+i,y=my+j;if(x<0||y<0||x>=W||y>=H)continue;if(cur===0||g[y*W+x]===0)set(x,y,cur,cur===FIRE?30+R(30):cur===STEAM||cur===SMOKE?60+R(60):0)}}
const off=document.createElement("canvas");off.width=W;off.height=H;const ox=off.getContext("2d");
function render(){const d=img.data;for(let i=0;i<W*H;i++){const v=g[i],c=COL[v],n=v?(i*7%5)*4:0;let r=c[0],gg=c[1],b=c[2];if(v===FIRE){r=255;gg=60+R(120);b=0}else if(v===LAVA)gg=40+(i*3+tick)%60;d[i*4]=Math.min(255,r+n);d[i*4+1]=Math.min(255,gg+n);d[i*4+2]=Math.min(255,b+n);d[i*4+3]=255}
 ox.putImageData(img,0,0);cx.imageSmoothingEnabled=false;cx.clearRect(0,0,640,400);cx.drawImage(off,0,0,W*S,H*S)}
function loop(){tick++;paint();if(!paused){step();step()}render();requestAnimationFrame(loop)}
const br=document.getElementById("br");
function pos(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*W|0;my=(e.clientY-r.top)/r.height*H|0}
cv.addEventListener("pointerdown",e=>{down=true;pos(e);cv.setPointerCapture(e.pointerId)});cv.addEventListener("pointermove",pos);addEventListener("pointerup",()=>down=false);
const pal=document.getElementById("pal");
E.forEach((e,i)=>{const b=document.createElement("button");b.textContent=e[0];b.style.background=i&&i!==8?e[2]+"":"#1f2937";if(i===8||i===10||i===1||i===11||i===12&&false)b.style.color="#000";if(i===cur)b.className="on";b.onclick=()=>{cur=i;[...pal.children].forEach(c=>c.classList.remove("on"));b.classList.add("on")};pal.append(b)});
document.getElementById("pause").onclick=function(){paused=!paused;this.textContent=paused?"Resume":"Pause"};
document.getElementById("clr").onclick=()=>{g.fill(0);life.fill(0)};
// ad reward: a burst of random elements falls from the sky
function burst(){for(let n=0;n<600;n++){const v=[1,2,5,6,9,11,13][R(7)];set(R(W),R(8),v,v===FIRE?40:0)}}
GameAds.init({reward:"element rain 🌧️",onReward:burst});
loop();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funcraft 2D | My Online Games</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; color: #fff; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    #hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; pointer-events: none; text-shadow: 0 1px 3px #000; }
    #hud a { pointer-events: auto; color: #fef3c7; }
    #status { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); padding: 4px 14px; border-radius: 8px; background: rgba(0,0,0,.55); font-weight: bold; pointer-events: none; }
    #status:empty { display: none; }
    #help { position: fixed; bottom: 70px; left: 8px; font-size: 12px; color: #e2e8f0; text-shadow: 0 1px 3px #000; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><div id="info"></div><a href="hub.html">← Funcraft gateways</a></div>
  <div id="status"></div>
  <div id="help">A/D move · W/Space jump · hold left click mine/attack · right click place · 1-9, 0 or wheel pick block · C craft planks from wood</div>
  <script src="../shared/profile.js"></script>
  <script>
    const modes = {
      survival: { name: "Survival", survival: true, disasters: false },
      "survival-disaster": { name: "Survival Disaster", survival: true, disasters: true },
      peaceful: { name: "Peaceful", survival: false, disasters: false },
      disaster: { name: "Disaster", survival: false, disasters: true }
    };
    const modeKey = modes[new URLSearchParams(location.search).get("mode")] ? new URLSearchParams(location.search).get("mode") : "survival";
    const mode = modes[modeKey];
    const canvas = document.querySelector("#c"), ctx = canvas.getContext("2d");
    const infoEl = document.querySelector("#info"), statusEl = document.querySelector("#status");

    const W = 240, H = 90, TS = 28, SEA = 31, MAX_LIVES = 5, REACH = 6;
    const T = { air: 0, grass: 1, dirt: 2, stone: 3, sand: 4, wood: 5, leaves: 6, coal: 7, iron: 8, gold: 9, diamond: 10, water: 11, lava: 12, planks: 13, bedrock: 14 };
    const info = [
      null,
      { name: "Grass", color: "#4ade80", hard: .4, drop: T.dirt }, { name: "Dirt", color: "#92602f", hard: .4 },
      { name: "Stone", color: "#8b95a1", hard: 1.2 }, { name: "Sand", color: "#f2dc8c", hard: .3 },
      { name: "Wood", color: "#7a4b1e", hard: .8 }, { name: "Leaves", color: "#2f8f3f", hard: .15 },
      { name: "Coal", color: "#3b3f46", hard: 1.5 }, { name: "Iron", color: "#d4a98a", hard: 2 },
      { name: "Gold", color: "#fbbf24", hard: 2.2 }, { name: "Diamond", color: "#5eead4", hard: 3 },
      { name: "Water", color: "#3b82f6" }, { name: "Lava", color: "#f97316" },
      { name: "Planks", color: "#c68a4a", hard: .6 }, { name: "Bedrock", color: "#1f2937" }
    ];
    const hotbar = [T.dirt, T.stone, T.sand, T.wood, T.planks, T.leaves, T.coal, T.iron, T.gold, T.diamond];
    const isSolid = (t) => t !== T.air && t !== T.water && t !== T.lava;

    let seed = 12345;
    const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

    const world = new Uint8Array(W * H);
    const get = (x, y) => (x < 0 || x >= W ? T.bedrock : y < 0 ? T.air : y >= H ? T.bedrock : world[y * W + x]);
    const set = (x, y, t) => { if (x >= 0 && x < W && y >= 0 && y < H) world[y * W + x] = t; };
    const surface = (x) => { for (let y = 0; y < H; y++) if (isSolid(get(x, y)) || get(x, y) === T.water) return y; return H; };

    function generate() {
      seed = 12345;
      const h = [];
      for (let x = 0; x < W; x++) h[x] = Math.round(34 + 6 * Math.sin(x * .05) + 4 * Math.sin(x * .13 + 2) + 2 * Math.sin(x * .31));
      for (let x = 0; x < W; x++) {
        for (let y = 0; y < H; y++) {
          let t = T.air;
          if (y >= h[x]) {
            const depth = y - h[x];
            const sandy = h[x] > SEA;
            t = depth === 0 ? (sandy ? T.sand : T.grass) : depth < 4 ? (sandy ? T.sand : T.dirt) : T.stone;
            if (t === T.stone) {
              const cave = Math.sin(x * .21) * Math.sin(y * .19) + Math.sin(x * .07 + y * .11) > 1.15;
              if (cave && depth > 5) t = y > 70 ? T.lava : T.air;
              else {
                const r = rand();
                if (y > 40 && r < .03) t = T.coal; else if (y > 52 && r < .05) t = T.iron;
                else if (y > 64 && r < .062) t = T.gold; else if (y > 74 && r < .07) t = T.diamond;
              }
            }
          } else if (y >= SEA) t = T.water;
          if (y === H - 1) t = T.bedrock;
          world[y * W + x] = t;
        }
      }
      for (let x = 3; x < W - 3; x += 2) {
        if (h[x] > SEA - 1 || rand() > .22) continue;
        const top = h[x];
        const tall = 4 + Math.floor(rand() * 2);
        for (let i = 1; i <= tall; i++) set(x, top - i, T.wood);
        for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 0; dy++) if (Math.abs(dx) + Math.abs(dy) < 4 && get(x + dx, top - tall + dy) === T.air) set(x + dx, top - tall + dy, T.leaves);
        x += 3;
      }
    }

    const saveDefaults = { modes: {} };
    const profile = GameProfiles.getGame("funcraft2d", saveDefaults);
    if (!profile.modes) profile.modes = {};
    const inv = Object.fromEntries(hotbar.map((t) => [t, 0]));
    const player = { x: W / 2, y: 0, vx: 0, vy: 0, w: .7, h: 1.8, onGround: false, face: 1, lives: MAX_LIVES, invuln: 0, hitCd: 0 };
    let dayTime = .1, selected = 0, msg = "", msgTime = 0;
    const mobs = [], particles = [];
    const keys = {}, mouse = { x: 0, y: 0, down: false, right: false };

    function spawnPoint() { return { x: W / 2, y: surface(Math.floor(W / 2)) - player.h - .1 }; }
    function respawn() { const s = spawnPoint(); player.x = s.x; player.y = s.y; player.vx = player.vy = 0; }
    function say(text, secs = 2.5) { msg = text; msgTime = secs; }

    function load() {
      const saved = profile.modes[modeKey];
      if (saved && typeof saved.world === "string" && saved.world.length === W * H) {
        for (let i = 0; i < W * H; i++) world[i] = saved.world.charCodeAt(i) - 48;
        Object.assign(player, { x: saved.x, y: saved.y, lives: saved.lives || MAX_LIVES });
        for (const k of Object.keys(inv)) inv[k] = saved.inv?.[k] || 0;
        dayTime = saved.dayTime || 0;
        return;
      }
      generate(); respawn();
    }
    function persist() {
      let s = ""; for (let i = 0; i < W * H; i++) s += String.fromCharCode(48 + world[i]);
      profile.modes[modeKey] = { world: s, x: player.x, y: player.y, lives: player.lives, inv, dayTime };
      try { GameProfiles.saveGame("funcraft2d", profile); } catch { say("Could not save: browser storage is full."); }
    }

    function collides(x, y, w, h) {
      for (let tx = Math.floor(x - w / 2); tx <= Math.floor(x + w / 2 - .001); tx++)
        for (let ty = Math.floor(y); ty <= Math.floor(y + h - .001); ty++) if (isSolid(get(tx, ty))) return true;
      return false;
    }
    function move(e, dt) {
      let nx = e.x + e.vx * dt;
      if (collides(nx, e.y, e.w, e.h)) {
        if (e.onGround && !collides(nx, e.y - 1.01, e.w, e.h)) { e.x = nx; e.y -= 1.01; } else e.vx = 0;
      } else e.x = nx;
      e.x = Math.max(e.w, Math.min(W - e.w, e.x));
      const ny = e.y + e.vy * dt; e.onGround = false;
      if (collides(e.x, ny, e.w, e.h)) { if (e.vy > 0) e.onGround = true; e.vy = 0; } else e.y = ny;
    }
    const tileAtBody = (e, off = .5) => get(Math.floor(e.x), Math.floor(e.y + e.h * off));

    function hurt(n) {
      if (!mode.survival || player.invuln > 0) return;
      player.lives -= n; player.invuln = 1.2;
      if (player.lives <= 0) { player.lives = MAX_LIVES; respawn(); say("You ran out of lives and woke up at spawn."); }
    }

    let mining = { x: -1, y: -1, t: 0 };
    function mineStep(dt) {
      const tx = Math.floor(mouse.wx), ty = Math.floor(mouse.wy);
      if (Math.hypot(tx + .5 - player.x, ty + .5 - (player.y + .9)) > REACH) { mining.t = 0; return; }
      const mob = mobs.find((m) => Math.abs(m.x - mouse.wx) < .7 && mouse.wy > m.y - .2 && mouse.wy < m.y + m.h + .2);
      if (mob) {
        if (player.hitCd <= 0) { mob.hp -= 1; mob.vx = (mob.x < player.x ? -1 : 1) * 8; mob.vy = -6; player.hitCd = .4; if (mob.hp <= 0) mobs.splice(mobs.indexOf(mob), 1); }
        return;
      }
      const t = get(tx, ty), d = info[t];
      if (!d || t === T.bedrock || t === T.water || t === T.lava || t === T.air) { mining.t = 0; return; }
      if (mining.x !== tx || mining.y !== ty) mining = { x: tx, y: ty, t: 0 };
      mining.t += dt;
      if (mining.t >= d.hard) {
        set(tx, ty, T.air); const drop = d.drop || t; if (drop in inv) inv[drop]++;
        for (let i = 0; i < 6; i++) particles.push({ x: tx + .5, y: ty + .5, vx: (Math.random() - .5) * 6, vy: -Math.random() * 5, life: .5, color: d.color });
        mining.t = 0;
      }
    }
    function place() {
      const tx = Math.floor(mouse.wx), ty = Math.floor(mouse.wy), item = hotbar[selected];
      if (Math.hypot(tx + .5 - player.x, ty + .5 - (player.y + .9)) > REACH || !inv[item]) return;
      const cur = get(tx, ty); if (cur !== T.air && cur !== T.water && cur !== T.lava) return;
      set(tx, ty, item);
      if (collides(player.x, player.y, player.w, player.h)) { set(tx, ty, cur); return; }
      inv[item]--;
    }
    function craft() { if (inv[T.wood] > 0) { inv[T.wood]--; inv[T.planks] += 4; say("Crafted 4 planks."); } else say("You need wood to craft planks."); }

    const event = { type: "", time: 0, next: 35, lightning: 0, flash: 0, tornado: null, floodLevel: 0, flooded: [], rain: [] };
    const eventNames = { storm: "⛈ Storm! Lightning is striking", tornado: "🌪 Tornado! Run away", flood: "🌊 Flood! Climb higher" };
    function startEvent() {
      const types = ["storm", "tornado", "flood"]; event.type = types[Math.floor(Math.random() * 3)]; event.time = 24; event.lightning = 1;
      if (event.type === "tornado") event.tornado = { x: Math.max(3, Math.min(W - 3, player.x + (Math.random() < .5 ? -35 : 35))), cd: 0, hurtCd: 0 };
      if (event.type === "flood") event.floodLevel = surface(Math.floor(player.x)) + 1;
      say(eventNames[event.type], 4);
    }
    function stopEvent() { event.type = ""; event.tornado = null; event.next = 40 + Math.random() * 40; }
    function erode(x) { const y = surface(x); const t = get(x, y); if (y < H && t !== T.bedrock && t !== T.water) set(x, y, T.air); }
    function updateEvent(dt) {
      if (!mode.disasters) return;
      if (!event.type) { event.next -= dt; if (event.next <= 0) startEvent(); return; }
      event.time -= dt; event.flash = Math.max(0, event.flash - dt * 2);
      if (event.type === "storm") {
        event.lightning -= dt;
        if (event.lightning <= 0) {
          event.lightning = 1.5 + Math.random() * 2; event.flash = 1;
          const x = Math.floor(player.x + (Math.random() - .5) * 40); erode(x);
          if (Math.abs(x + .5 - player.x) < 1.5) hurt(1);
        }
      } else if (event.type === "tornado" && event.tornado) {
        const t = event.tornado; t.x += Math.sign(player.x - t.x) * 2.5 * dt; t.cd -= dt; t.hurtCd -= dt;
        if (t.cd <= 0) { t.cd = .35; for (let dx = -1; dx <= 1; dx++) erode(Math.floor(t.x) + dx); }
        const dx = player.x - t.x;
        if (Math.abs(dx) < 3 && player.y > surface(Math.floor(t.x)) - 14) {
          player.vy = Math.max(player.vy - 50 * dt, -9); player.vx += Math.sign(dx || 1) * 14 * dt;
          if (Math.abs(dx) < 1.6) hurt(1);
        }
      } else if (event.type === "flood") {
        event.flood = (event.flood || 0) + dt;
        if (event.flood > 1.2 && event.floodLevel > surface(Math.floor(player.x)) - 4) {
          event.flood = 0; event.floodLevel--;
          for (let x = Math.max(0, Math.floor(player.x) - 45); x < Math.min(W, Math.floor(player.x) + 45); x++)
            if (get(x, event.floodLevel) === T.air && get(x, event.floodLevel + 1) !== T.air) { set(x, event.floodLevel, T.water); event.flooded.push([x, event.floodLevel]); }
        }
      }
      if (event.time <= 0) { if (event.flooded.length) event.draining = true; stopEvent(); }
    }
    function drain(dt) {
      if (!event.flooded.length) return;
      if (event.type === "flood") return;
      for (let i = 0; i < 40 && event.flooded.length; i++) { const [x, y] = event.flooded.pop(); if (get(x, y) === T.water) set(x, y, T.air); }
    }

    function brightness() { return Math.max(0, Math.min(1, .5 + .65 * Math.cos(dayTime * Math.PI * 2))); }
    function updateMobs(dt) {
      if (!mode.survival) { mobs.length = 0; return; }
      const night = brightness() < .3;
      if (night && mobs.length < 4 && Math.random() < dt * .6) {
        const x = Math.floor(player.x + (Math.random() < .5 ? -1 : 1) * (14 + Math.random() * 8));
        if (x > 2 && x < W - 2) { const y = surface(x); if (get(x, y) !== T.water) mobs.push({ x: x + .5, y: y - 1.8, vx: 0, vy: 0, w: .7, h: 1.8, hp: 3, onGround: false, hitCd: 0 }); }
      }
      for (let i = mobs.length - 1; i >= 0; i--) {
        const m = mobs[i]; m.hitCd -= dt;
        if (!night && Math.abs(m.x - player.x) > 18) { mobs.splice(i, 1); continue; }
        const dir = Math.sign(player.x - m.x);
        m.vx += (dir * 2.6 - m.vx) * Math.min(1, dt * 4);
        if (m.onGround && collides(m.x + dir * .6, m.y, m.w, m.h)) m.vy = -12;
        m.vy = Math.min(m.vy + 40 * dt, 30); move(m, dt);
        if (tileAtBody(m) === T.lava || m.y > H) mobs.splice(i, 1);
        else if (Math.abs(m.x - player.x) < .7 && Math.abs(m.y - player.y) < 1.7 && m.hitCd <= 0) { hurt(1); m.hitCd = 1.2; }
      }
    }

    function update(dt) {
      dayTime = (dayTime + dt / 240) % 1;
      player.invuln = Math.max(0, player.invuln - dt); player.hitCd = Math.max(0, player.hitCd - dt);
      const inWater = tileAtBody(player) === T.water;
      const dir = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
      if (dir) player.face = dir;
      const speed = inWater ? 3.5 : 6;
      player.vx += (dir * speed - player.vx) * Math.min(1, dt * 12);
      if (inWater) { player.vy = Math.min(player.vy + 14 * dt, 3); if (keys.w || keys[" "] || keys.arrowup) player.vy = -4.5; }
      else { player.vy = Math.min(player.vy + 40 * dt, 30); if ((keys.w || keys[" "] || keys.arrowup) && player.onGround) player.vy = -13.5; }
      move(player, dt);
      if (player.y > H) respawn();
      if (tileAtBody(player) === T.lava || tileAtBody(player, .9) === T.lava) hurt(2);
      if (mouse.down) mineStep(dt); else mining.t = 0;
      if (mouse.right) { mouse.right = false; place(); }
      updateEvent(dt); drain(dt); updateMobs(dt);
      for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.life -= dt; p.vy += 20 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) particles.splice(i, 1); }
      msgTime -= dt;
      statusEl.textContent = msgTime > 0 ? msg : event.type ? eventNames[event.type] : "";
      const hearts = mode.survival ? "❤".repeat(player.lives) + "🖤".repeat(MAX_LIVES - player.lives) + " · " : "";
      infoEl.textContent = `${hearts}${mode.name} · Selected: ${info[hotbar[selected]].name} ×${inv[hotbar[selected]]}`;
    }

    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener("resize", resize); resize();
    const cam = () => ({ x: player.x - canvas.width / 2 / TS, y: player.y + player.h / 2 - canvas.height / 2 / TS });

    function draw() {
      const b = brightness(), c = cam(), cw = canvas.width, ch = canvas.height;
      const sky = event.type === "storm" || event.type === "tornado" ? .45 : 1;
      const r = Math.round((90 * b + 8) * sky), g = Math.round((170 * b + 10) * sky), bl = Math.round((235 * b + 30) * sky);
      ctx.fillStyle = `rgb(${r},${g},${bl})`; ctx.fillRect(0, 0, cw, ch);
      const ang = dayTime * Math.PI * 2; ctx.fillStyle = "#fde047"; ctx.beginPath(); ctx.arc(cw / 2 + Math.sin(ang) * cw * .4, ch * .5 - Math.cos(ang) * ch * .4, 22, 0, 7); ctx.fill();
      ctx.fillStyle = "#e2e8f0"; ctx.beginPath(); ctx.arc(cw / 2 - Math.sin(ang) * cw * .4, ch * .5 + Math.cos(ang) * ch * .4, 16, 0, 7); ctx.fill();
      const x0 = Math.floor(c.x), y0 = Math.floor(c.y), x1 = x0 + Math.ceil(cw / TS) + 1, y1 = y0 + Math.ceil(ch / TS) + 1;
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const t = get(x, y); if (t === T.air) continue;
        const px = Math.round((x - c.x) * TS), py = Math.round((y - c.y) * TS);
        ctx.fillStyle = info[t].color; ctx.fillRect(px, py, TS + 1, TS + 1);
        if (t === T.coal || t === T.iron || t === T.gold || t === T.diamond) { ctx.fillStyle = "#8b95a1"; ctx.fillRect(px, py, TS, TS); ctx.fillStyle = info[t].color; ctx.fillRect(px + 5, py + 5, 7, 7); ctx.fillRect(px + 15, py + 14, 8, 8); }
        else if (t === T.stone || t === T.dirt) { ctx.fillStyle = "rgba(0,0,0,.08)"; ctx.fillRect(px + ((x * 7 + y * 3) % 3) * 6, py + ((x * 5 + y) % 3) * 7, 8, 5); }
        if (t === T.water) { ctx.fillStyle = "rgba(59,130,246,.65)"; ctx.fillRect(px, py, TS, TS); }
        const under = y - 40; if (under > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.min(.6, under / 60)})`; ctx.fillRect(px, py, TS + 1, TS + 1); }
      }
      if (mining.t > 0) { const d = info[get(mining.x, mining.y)]; if (d && d.hard) { ctx.fillStyle = `rgba(0,0,0,${.5 * mining.t / d.hard})`; ctx.fillRect((mining.x - c.x) * TS, (mining.y - c.y) * TS, TS, TS); } }
      if (event.type === "tornado" && event.tornado) {
        const tx = (event.tornado.x - c.x) * TS; ctx.fillStyle = "rgba(226,232,240,.7)";
        for (let i = 0; i < 14; i++) { const w = 20 + i * 5, ty = ch * .1 + i * (ch * .045) + Math.sin(performance.now() / 150 + i) * 6; ctx.fillRect(tx - w / 2, ty, w, 14); }
      }
      for (const m of mobs) drawPerson(m, c, "#4ade80", "#166534");
      if (player.invuln <= 0 || Math.floor(player.invuln * 10) % 2) drawPerson(player, c, "#f87171", "#1e3a8a");
      for (const p of particles) { ctx.fillStyle = p.color; ctx.fillRect((p.x - c.x) * TS, (p.y - c.y) * TS, 5, 5); }
      if (event.type === "storm" || event.type === "flood") {
        ctx.strokeStyle = "rgba(180,200,255,.6)"; ctx.beginPath();
        for (let i = 0; i < 90; i++) { const rx = (i * 97 + performance.now() * .6) % cw, ry = (i * 61 + performance.now() * 1.4) % ch; ctx.moveTo(rx, ry); ctx.lineTo(rx - 4, ry + 14); }
        ctx.stroke();
      }
      if (event.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${event.flash * .6})`; ctx.fillRect(0, 0, cw, ch); }
      if (b < .5) { ctx.fillStyle = `rgba(5,10,40,${(.5 - b) * .7})`; ctx.fillRect(0, 0, cw, ch); }
      drawHotbar();
      const tx = Math.floor(mouse.wx), ty = Math.floor(mouse.wy);
      ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.strokeRect((tx - c.x) * TS, (ty - c.y) * TS, TS, TS);
    }
    function drawPerson(e, c, body, legs) {
      const px = (e.x - c.x) * TS, py = (e.y - c.y) * TS, w = e.w * TS, h = e.h * TS;
      ctx.fillStyle = legs; ctx.fillRect(px - w / 2, py + h * .6, w, h * .4);
      ctx.fillStyle = body; ctx.fillRect(px - w / 2, py + h * .25, w, h * .4);
      ctx.fillStyle = "#fcd9b6"; ctx.fillRect(px - w / 2 + 1, py, w - 2, h * .26);
      ctx.fillStyle = "#111"; ctx.fillRect(px + (e.vx < -.5 || e.face === -1 ? -w / 4 : w / 8), py + h * .09, 4, 4);
    }
    function drawHotbar() {
      const sz = 44, total = hotbar.length * (sz + 4), x0 = (canvas.width - total) / 2, y0 = canvas.height - sz - 10;
      hotbar.forEach((t, i) => {
        const x = x0 + i * (sz + 4);
        ctx.fillStyle = i === selected ? "rgba(255,255,255,.35)" : "rgba(0,0,0,.5)"; ctx.fillRect(x, y0, sz, sz);
        ctx.strokeStyle = i === selected ? "#fff" : "#475569"; ctx.strokeRect(x, y0, sz, sz);
        ctx.fillStyle = info[t].color; ctx.fillRect(x + 10, y0 + 6, sz - 20, sz - 20);
        ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial"; ctx.fillText(inv[t], x + 4, y0 + sz - 4); ctx.fillText((i + 1) % 10, x + sz - 12, y0 + 12);
      });
    }

    addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase(); keys[k] = true;
      if (k >= "0" && k <= "9") selected = (Number(k) + 9) % 10;
      if (k === "c") craft();
      if ([" ", "arrowup", "arrowdown"].includes(k)) e.preventDefault();
    });
    addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
    canvas.addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    canvas.addEventListener("mousedown", (e) => { if (e.button === 0) mouse.down = true; else if (e.button === 2) mouse.right = true; });
    addEventListener("mouseup", (e) => { if (e.button === 0) mouse.down = false; });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("wheel", (e) => { selected = (selected + (e.deltaY > 0 ? 1 : 9)) % 10; e.preventDefault(); }, { passive: false });
    addEventListener("beforeunload", persist);
    setInterval(persist, 10000);

    mouse.wx = 0; mouse.wy = 0;
    load();
    let last = performance.now(), animationFrame;
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      const c = cam(); mouse.wx = mouse.x / TS + c.x; mouse.wy = mouse.y / TS + c.y;
      update(dt); draw(); animationFrame = requestAnimationFrame(frame);
    }
    animationFrame = requestAnimationFrame(frame);
  </script>
</body>
</html>

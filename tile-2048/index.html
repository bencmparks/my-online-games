<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 Slide | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#1c1917;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 50% 0,#92400e,#1c1917)}
main{width:min(100%,32rem);padding:1.5rem;border:.2rem solid #fb923c;border-radius:1.25rem;background:rgb(28 25 23 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.6rem 0;color:#fdba74;font-size:1.6rem}
canvas{display:block;width:100%;max-width:26rem;height:auto;margin:1rem auto;border:.2rem solid #78716c;border-radius:.6rem;background:#292524;touch-action:none}
.bar{display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap;align-items:center;margin:.5rem 0;font-weight:bold;color:#fde68a}
button{border:0;border-radius:.5rem;background:#fb923c;color:#292524;cursor:pointer;font:inherit;font-weight:bold;padding:.6rem 1rem;touch-action:manipulation}
</style></head>
<body><main><a href="../">← All games</a><h1>🔢 2048 Slide</h1>
<p>Slide the tiles. Matching numbers merge into one bigger tile. Reach 2048, then keep going for a high score!</p>
<p><strong>Arrow keys / WASD</strong> or <strong>swipe</strong> to slide · <strong>R</strong> new game</p>
<div class="bar"><span id="sc">Score 0</span><span id="bs">Best 0</span><button id="re" type="button">New game (R)</button></div>
<canvas id="g" width="400" height="400" aria-label="2048 board"></canvas>
</main>
<script>
const C=document.querySelector("#g"),x=C.getContext("2d"),N=4,S=400/N,COL={0:["#3f3a36","#fff"],2:["#eee4da","#776e65"],4:["#ede0c8","#776e65"],8:["#f2b179","#fff"],16:["#f59563","#fff"],32:["#f67c5f","#fff"],64:["#f65e3b","#fff"],128:["#edcf72","#fff"],256:["#edcc61","#fff"],512:["#edc850","#fff"],1024:["#edc53f","#fff"],2048:["#edc22e","#fff"]};
let g,score=0,best=0,over=false,won=false,keepGoing=false,pop=[];
try{best=+localStorage.getItem("slide2048Best")||0}catch(e){}
function empty(){return Array.from({length:N},()=>Array(N).fill(0))}
function spawn(){const e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])e.push([r,c]);if(!e.length)return;const[r,c]=e[Math.floor(Math.random()*e.length)];g[r][c]=Math.random()<.9?2:4;pop.push([r,c,10])}
function reset(){g=empty();score=0;over=false;won=false;keepGoing=false;pop=[];spawn();spawn();hud()}
function slideRow(row){const a=row.filter(v=>v),out=[];let gain=0;for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);gain+=a[i]*2;i++}else out.push(a[i])}while(out.length<N)out.push(0);return[out,gain]}
function cell(d,i,j){return d===0?[i,j]:d===1?[i,N-1-j]:d===2?[j,i]:[N-1-j,i]}
function move(d){
 if(over||won)return;let moved=false,gain=0;const ng=empty();
 for(let i=0;i<N;i++){
  const line=[];for(let j=0;j<N;j++){const[r,c]=cell(d,i,j);line.push(g[r][c])}
  const[o,gn]=slideRow(line);gain+=gn;
  for(let j=0;j<N;j++){const[r,c]=cell(d,i,j);ng[r][c]=o[j];if(o[j]!==g[r][c])moved=true}}
 if(!moved)return;g=ng;score+=gain;spawn();
 if(score>best){best=score;try{localStorage.setItem("slide2048Best",best)}catch(e){}}
 if(!keepGoing&&g.some(r=>r.includes(2048)))won=true;
 if(!canMove())over=true;hud()}
function canMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!g[r][c])return true;if(c<N-1&&g[r][c]===g[r][c+1])return true;if(r<N-1&&g[r][c]===g[r+1][c])return true}return false}
function hud(){document.querySelector("#sc").textContent="Score "+score;document.querySelector("#bs").textContent="Best "+best}
function draw(){
 x.clearRect(0,0,400,400);x.textAlign="center";x.textBaseline="middle";
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const v=g[r][c],p=pop.find(q=>q[0]===r&&q[1]===c),k=p?1-p[2]/14:1,[bg,fg]=COL[v]||["#3c3a32","#fff"],cx=c*S+S/2,cy=r*S+S/2,w=(S-10)*k;
  x.fillStyle=bg;x.beginPath();x.roundRect(cx-w/2,cy-w/2,w,w,10);x.fill();
  if(v){x.fillStyle=fg;x.font=`bold ${v>=1024?32:v>=128?38:46}px Arial`;x.fillText(v,cx,cy+2)}}
 pop=pop.map(q=>[q[0],q[1],q[2]-1]).filter(q=>q[2]>0);
 if(over||won){x.fillStyle="rgb(0 0 0 / 60%)";x.fillRect(0,0,400,400);x.fillStyle="#fff";x.font="bold 38px Arial";x.fillText(over?"Game over":"You made 2048!",200,175);x.font="bold 18px Arial";x.fillText(over?"Press R or tap to try again":"Tap or press Enter to keep going",200,225)}
 requestAnimationFrame(draw)}
addEventListener("keydown",e=>{const m={ArrowLeft:0,KeyA:0,ArrowRight:1,KeyD:1,ArrowUp:2,KeyW:2,ArrowDown:3,KeyS:3}[e.code];
 if(m!==undefined){e.preventDefault();move(m);return}if(e.code==="KeyR")reset();if(e.code==="Enter"&&won){won=false;keepGoing=true}});
let sx=0,sy=0;
C.addEventListener("pointerdown",e=>{e.preventDefault();sx=e.clientX;sy=e.clientY;if(over)reset();else if(won){won=false;keepGoing=true}});
C.addEventListener("pointerup",e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx<0?0:1):(dy<0?2:3))});
document.querySelector("#re").onclick=reset;
reset();draw();
</script></body></html>

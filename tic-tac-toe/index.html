<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tic-Tac-Toe | My Online Games</title><style>
  :root { color-scheme:dark; font-family:Arial,sans-serif; background:#020617; color:#ecfeff; } * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; padding:1rem; background:radial-gradient(circle at 25% 15%,rgb(34 211 238 / 25%),transparent 20rem),radial-gradient(circle at 80% 80%,rgb(244 63 94 / 20%),transparent 22rem),#020617; } main { width:min(100%,32rem); padding:1.5rem; border:.15rem solid #22d3ee; border-radius:1.25rem; background:rgb(15 23 42 / 92%); box-shadow:0 0 2rem rgb(34 211 238 / 25%),inset 0 0 1.5rem rgb(34 211 238 / 8%); text-align:center; } a { color:#67e8f9; } h1 { margin:.6rem 0; color:#f0abfc; text-shadow:0 0 .8rem #ec4899; } #board { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; width:min(100%,19rem); margin:1rem auto; } .cell { aspect-ratio:1; border:.15rem solid #22d3ee; border-radius:.6rem; background:#0f172a; box-shadow:inset 0 0 1rem rgb(34 211 238 / 12%),0 0 .6rem rgb(34 211 238 / 22%); color:#f0abfc; cursor:pointer; font-size:clamp(2rem,13vw,4.5rem); font-weight:bold; text-shadow:0 0 .8rem #ec4899; } .cell:hover:not(:disabled),.cell:focus-visible { border-color:#f0abfc; box-shadow:0 0 1rem rgb(236 72 153 / 75%); outline:none; } button { padding:.65rem 1rem; border:.1rem solid #f0abfc; border-radius:.5rem; background:#111827; box-shadow:0 0 .7rem rgb(236 72 153 / 35%); color:#f0abfc; cursor:pointer; font:inherit; font-weight:bold; } button:hover,button:focus-visible { background:#ec4899; color:#020617; outline:.1rem solid #f0abfc; } #status { min-height:1.5rem; color:#67e8f9; font-weight:bold; text-shadow:0 0 .6rem #22d3ee; }
</style></head><body><main><a href="../">← All games</a><h1>❌ Tic-Tac-Toe</h1><p>You are X. Beat the computer!</p><div id="board" aria-label="Tic-Tac-Toe board"></div><button id="restart" type="button">New game</button><p id="status" aria-live="polite">Your turn.</p></main><script>
const boardElement=document.querySelector("#board"),status=document.querySelector("#status");let board,finished;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winner(){return wins.find(([a,b,c])=>board[a]&&board[a]===board[b]&&board[a]===board[c]);}function render(){boardElement.replaceChildren();board.forEach((mark,index)=>{const button=document.createElement("button");button.className="cell";button.type="button";button.textContent=mark;button.disabled=finished||Boolean(mark);button.setAttribute("aria-label",`Cell ${index+1}${mark?`, ${mark}`:""}`);button.addEventListener("click",()=>play(index));boardElement.append(button);});}
function finish(){const line=winner();if(line){finished=true;status.textContent=`${board[line[0]]} wins!`;return true;}if(board.every(Boolean)){finished=true;status.textContent="It's a draw!";return true;}return false;}function play(index){if(finished||board[index])return;board[index]="X";if(finish()){render();return;}status.textContent="Computer is thinking...";render();setTimeout(computer,280);}function computer(){const empty=board.map((value,index)=>value?null:index).filter(Number.isInteger);const move=empty.find(index=>{board[index]="O";const result=winner();board[index]=null;return result;})??empty.find(index=>{board[index]="X";const result=winner();board[index]=null;return result;})??empty[Math.floor(Math.random()*empty.length)];board[move]="O";if(!finish())status.textContent="Your turn.";render();}function start(){board=Array(9).fill(null);finished=false;status.textContent="Your turn.";render();}document.querySelector("#restart").addEventListener("click",start);start();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A harmless confetti-bomb color matching puzzle minigame.">
  <title>Confetti Bomb Dash</title>
  <style>
    :root { --night: #171735; --cream: #fff9e9; --pink: #ff6f9c; --cyan: #64e6ed; --gold: #ffdc62; --purple: #795ad1; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: var(--cream); background: radial-gradient(circle at 16% 15%, rgba(100, 230, 237, 0.3), transparent 26rem), repeating-linear-gradient(125deg, rgba(255, 111, 156, 0.16) 0 7px, transparent 7px 28px), var(--night); font-family: Arial, sans-serif; }
    main { width: min(100% - 28px, 860px); padding: 28px; }
    header, .bottom-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header { margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.06em; }
    a { color: var(--cream); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-decoration: none; text-transform: uppercase; }
    a:hover { color: var(--gold); }
    .scoreboard { display: flex; justify-content: center; gap: 14px; margin-bottom: 14px; font-size: 0.82rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
    .score { display: inline-block; min-width: 52px; padding: 8px 10px; color: var(--night); background: var(--cream); font-size: 1.1rem; text-align: center; }
    canvas { display: block; width: 100%; border: 5px solid var(--cream); background: #2d2660; box-shadow: 10px 10px 0 var(--purple), 0 0 28px rgba(100, 230, 237, 0.45); cursor: pointer; touch-action: none; }
    .bottom-bar { margin-top: 20px; }
    p { max-width: 590px; margin: 0; color: rgba(255, 249, 233, 0.9); font-size: 0.9rem; line-height: 1.5; }
    button { min-height: 42px; padding: 0 16px; border: 1px solid var(--cream); color: var(--night); background: var(--gold); cursor: pointer; font-weight: 800; }
    button:hover { background: var(--cyan); }
    @media (max-width: 620px) { main { padding: 19px 0 28px; } header, .bottom-bar { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Confetti Bomb Dash</h1>
      <a href="../">← Back home</a>
    </header>
    <div class="scoreboard" aria-label="Confetti Bomb Dash status">
      <span>Time <span class="score" id="time">20</span></span>
      <span>Defused <span class="score" id="defused">0/8</span></span>
      <span>Streak <span class="score" id="streak">0</span></span>
    </div>
    <canvas id="game" width="800" height="500" aria-label="Confetti Bomb Dash. Click the wire that matches the color shown on the party popper."></canvas>
    <div class="bottom-bar">
      <p>Each party popper shows a color. Click the matching wire before the timer ends. Correct picks defuse it; wrong picks cost two seconds. Defuse all eight for a confetti celebration.</p>
      <button id="restart" type="button">New dash</button>
    </div>
  </main>
  <script>
    const canvas = document.querySelector("#game");
    const context = canvas.getContext("2d");
    const timeElement = document.querySelector("#time");
    const defusedElement = document.querySelector("#defused");
    const streakElement = document.querySelector("#streak");
    const restartButton = document.querySelector("#restart");
    const colors = [
      { name: "PINK", value: "#ff6f9c" },
      { name: "CYAN", value: "#64e6ed" },
      { name: "GOLD", value: "#ffdc62" },
      { name: "LIME", value: "#b8e75f" }
    ];
    let currentColor = colors[0];
    let timeRemaining = 20;
    let defused = 0;
    let streak = 0;
    let gameOver = false;
    let win = false;
    let previousTime = 0;
    let message = "Match the popper color!";
    let messageUntil = 0;
    let explosionAt = 0;

    function updateStatus() {
      timeElement.textContent = Math.max(0, Math.ceil(timeRemaining));
      defusedElement.textContent = `${defused}/8`;
      streakElement.textContent = streak;
    }

    function nextPopper() {
      currentColor = colors[Math.floor(Math.random() * colors.length)];
      message = `Click the ${currentColor.name} wire!`;
      messageUntil = performance.now() + 950;
    }

    function restartGame() {
      timeRemaining = 20;
      defused = 0;
      streak = 0;
      gameOver = false;
      win = false;
      explosionAt = 0;
      previousTime = 0;
      nextPopper();
      updateStatus();
    }

    function chooseWire(event) {
      if (gameOver) return;
      const bounds = canvas.getBoundingClientRect();
      const x = (event.clientX - bounds.left) * canvas.width / bounds.width;
      const y = (event.clientY - bounds.top) * canvas.height / bounds.height;
      if (y < 360 || y > 454) return;
      const wire = Math.floor(x / 200);
      if (!colors[wire]) return;
      if (colors[wire] === currentColor) {
        defused += 1;
        streak += 1;
        message = `Defused! ${streak > 1 ? `${streak} in a row!` : ""}`;
        if (defused >= 8) {
          gameOver = true;
          win = true;
          message = "CONFETTI TIME!";
        } else {
          window.setTimeout(nextPopper, 340);
        }
      } else {
        timeRemaining = Math.max(0, timeRemaining - 2);
        streak = 0;
        message = "Wrong wire! -2 seconds";
      }
      updateStatus();
    }

    function drawWire(color, index) {
      const x = index * 200 + 100;
      context.strokeStyle = color.value;
      context.lineWidth = 18;
      context.lineCap = "round";
      context.beginPath();
      context.moveTo(x, 455);
      context.quadraticCurveTo(x + (index % 2 ? 34 : -34), 335, 400 + (index - 1.5) * 24, 288);
      context.stroke();
      context.fillStyle = color.value;
      context.fillRect(x - 70, 415, 140, 45);
      context.fillStyle = "#171735";
      context.font = "800 17px Arial";
      context.textAlign = "center";
      context.fillText(color.name, x, 445);
    }

    function drawConfettiExplosion() {
      const elapsed = Math.min(1, (performance.now() - explosionAt) / 850);
      for (let piece = 0; piece < 72; piece += 1) {
        const angle = piece * 2.4;
        const distance = 40 + elapsed * (80 + (piece % 8) * 24);
        context.save();
        context.translate(400 + Math.cos(angle) * distance, 245 + Math.sin(angle) * distance + elapsed * elapsed * 120);
        context.rotate(angle + elapsed * 5);
        context.fillStyle = colors[piece % colors.length].value;
        context.fillRect(-5, -8, 10, 16);
        context.restore();
      }
    }

    function draw() {
      const background = context.createLinearGradient(0, 0, canvas.width, canvas.height);
      background.addColorStop(0, "#553c92");
      background.addColorStop(1, "#241e4d");
      context.fillStyle = background;
      context.fillRect(0, 0, canvas.width, canvas.height);
      for (let confetti = 0; confetti < 34; confetti += 1) {
        context.fillStyle = colors[confetti % colors.length].value;
        context.fillRect((confetti * 79) % canvas.width, 18 + (confetti * 43) % 280, 7, 12);
      }
      context.fillStyle = "#ff8bb0";
      context.beginPath();
      context.arc(400, 255, 82, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = "#fff9e9";
      context.beginPath();
      context.arc(400, 255, 57, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = currentColor.value;
      context.beginPath();
      context.arc(400, 255, 33, 0, Math.PI * 2);
      context.fill();
      context.strokeStyle = "#ffdc62";
      context.lineWidth = 7;
      context.beginPath();
      context.moveTo(430, 184);
      context.quadraticCurveTo(450, 145, 427, 121);
      context.stroke();
      colors.forEach(drawWire);
      context.fillStyle = "#fff9e9";
      context.font = "800 26px Arial";
      context.textAlign = "center";
      context.fillText(message, canvas.width / 2, 65);
      if (gameOver) {
        context.fillStyle = "rgba(23, 23, 53, 0.78)";
        context.fillRect(0, 0, canvas.width, canvas.height);
        if (!win) drawConfettiExplosion();
        context.fillStyle = win ? "#ffdc62" : "#ff6f9c";
        context.font = "800 48px Arial";
        context.fillText(win ? "CONFETTI SAVED!" : "TOO LATE!", canvas.width / 2, 230);
        context.fillStyle = "#fff9e9";
        context.font = "700 19px Arial";
        context.fillText("Press New dash to play again", canvas.width / 2, 270);
      }
    }

    function loop(timestamp) {
      if (!previousTime) previousTime = timestamp;
      const delta = Math.min((timestamp - previousTime) / 1000, 0.05);
      previousTime = timestamp;
      if (!gameOver) {
        timeRemaining = Math.max(0, timeRemaining - delta);
        if (timeRemaining === 0) {
          gameOver = true;
          explosionAt = performance.now();
          message = "Time is up!";
        }
        updateStatus();
      }
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("pointerdown", chooseWire);
    restartButton.addEventListener("click", restartGame);
    restartGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

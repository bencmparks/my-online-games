 ].map(p=>({...p,x:p.x*T,y:p.y*T,joined:!!p.start,fx:0,fy:0,vx:0}));

function wrap(s,cx,cy){const w=s.split(" ");let l="",lines=[];for(const t of w){if((l+t).length>50){lines.push(l);l=""}l+=t+" "}lines.push(l);lines.forEach((ln,i)=>x.fillText(ln.trim(),cx,cy+(i-(lines.length-1)/2*0)*10+(i?0:0)-(lines.length>1?5:0)+(i*10)))}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
addEventListener("keydown",e=>{keys[e.code]=1;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
 if(!e.repeat){if(e.code==="KeyE"||e.code==="Enter"||e.code==="Space")interact();if(e.code==="KeyQ")decoy();if(e.code==="KeyR")init()}});
addEventListener("keyup",e=>keys[e.code]=0);
for(const[id,k]of[["bl","ArrowLeft"],["br","ArrowRight"],["bu","ArrowUp"],["bd","ArrowDown"]]){const b=document.querySelector("#"+id);b.addEventListener("pointerdown",()=>keys[k]=1);for(const ev of["pointerup","pointerleave","pointercancel"])b.addEventListener(ev,()=>keys[k]=0)}
document.querySelector("#be").addEventListener("pointerdown",interact);document.querySelector("#bq").addEventListener("pointerdown",decoy);
document.querySelector("#bf").onclick=()=>{const m=document.querySelector("main");document.fullscreenElement?document.exitFullscreen():m.requestFullscreen&&m.requestFullscreen()};
init();requestAnimationFrame(loop);
</script></body></html>

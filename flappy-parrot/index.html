<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Parrot | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0c4a6e;color:#f0f9ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(145deg,#0c4a6e,#075985)}
main{width:min(100%,28rem);text-align:center;padding:1.2rem;border:1px solid #7dd3fc;border-radius:1rem;background:#0369a1}a{color:#bae6fd}h1{margin:.3rem 0;color:#fef08a}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;border:.25rem solid #bae6fd;border-radius:.6rem;background:#7dd3fc;touch-action:none;cursor:pointer}#status{min-height:1.5rem;color:#fef08a;font-weight:bold}
.opts{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:.6rem 0}.opts label{display:flex;gap:.3rem;align-items:center}select{font:inherit;padding:.2rem .4rem;border-radius:.3rem}
</style></head>
<body><main><a href="../">← All games</a><h1>🦜 Flappy Parrot</h1><p id="help"></p>
<div class="opts"><label>Players <select id="players"><option value="1">1 player</option><option value="2">2 players</option></select></label><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label></div>
<canvas id="game" width="360" height="480" aria-label="Flappy Parrot game"></canvas><p id="status" aria-live="polite"></p></main>
<script>
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),statusEl=document.querySelector("#status"),helpEl=document.querySelector("#help"),playersEl=document.querySelector("#players"),diffEl=document.querySelector("#difficulty"),W=canvas.width,H=canvas.height,GROUND=H-50;
// Easy is roomy and slow; hard is narrow, fast and heavy.
const LEVELS={easy:{gap:175,minGap:150,shrink:.5,speed:1.8,space:120,grav:.32,flap:-5.8},medium:{gap:140,minGap:105,shrink:2,speed:2.2,space:95,grav:.38,flap:-6.4},hard:{gap:105,minGap:80,shrink:2,speed:3,space:78,grav:.46,flap:-7}};
const SKINS=[{body:"#ef4444",wing:"#3b82f6",name:"P1"},{body:"#22c55e",wing:"#facc15",name:"P2"}];
let level,count,birds,pipes,state="ready",last=0,spawn=0,wing=0,overAt=0;
const bestKey=()=>`flappyParrotBest-${diffEl.value}`,best=()=>Number(localStorage.getItem(bestKey()))||0;
function reset(){level=LEVELS[diffEl.value];count=Number(playersEl.value);
birds=Array.from({length:count},(_,i)=>({x:count===2?70+i*50:90,y:H/2-20,v:0,alive:true,score:0,skin:SKINS[i]}));
pipes=[];spawn=0;state="ready";helpEl.textContent=count===2?"P1: Space or W (or tap left side). P2: Up arrow or Enter (or tap right side). Highest score wins!":"Press Space, click or tap to flap. Fly through the gaps between the pipes!";show()}
function show(){statusEl.textContent=count===2?`P1: ${birds[0].score} · P2: ${birds[1].score} · Best: ${best()}`:`Score: ${birds[0].score} · Best: ${best()}`}
function flap(i){if(state==="over"){if(performance.now()-overAt>500)reset();return}if(state==="ready"){state="play";last=performance.now()}const b=birds[i];if(b&&b.alive)b.v=level.flap}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();const r=canvas.getBoundingClientRect();flap(count===2&&e.clientX-r.left>r.width/2?1:0)});
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;const p1=e.code==="Space"||e.code==="KeyW",p2=e.code==="ArrowUp"||e.code==="Enter";if(!p1&&!p2)return;e.preventDefault();if(!e.repeat)flap(p2&&count===2?1:0)});
[playersEl,diffEl].forEach(el=>el.addEventListener("change",()=>{el.blur();reset()}));
function finish(){state="over";overAt=performance.now();const top=Math.max(...birds.map(b=>b.score));if(top>best())localStorage.setItem(bestKey(),top);
if(count===2){const [a,b]=birds;statusEl.textContent=a.score===b.score?`Tie at ${a.score}! Flap to play again.`:`${a.score>b.score?"P1":"P2"} wins! P1: ${a.score} · P2: ${b.score}. Flap to play again.`}
else statusEl.textContent=`Crashed! Score: ${birds[0].score} · Best: ${best()}. Flap to try again.`}
function step(dt){spawn-=dt;
if(spawn<=0){const top0=Math.max(...birds.map(b=>b.score)),gap=Math.max(level.minGap,level.gap-top0*level.shrink),top=50+Math.random()*(GROUND-gap-100);pipes.push({x:W+10,top,gap,passed:birds.map(()=>false)});spawn=level.space}
birds.forEach((b,i)=>{if(!b.alive)return;b.v+=level.grav*dt;b.y+=b.v*dt;
pipes.forEach(p=>{if(!p.passed[i]&&p.x+50<b.x){p.passed[i]=true;b.score++;show()}
if(b.x+14>p.x&&b.x-14<p.x+50&&(b.y-12<p.top||b.y+12>p.top+p.gap))b.alive=false});
if(b.y+14>GROUND||b.y<-20)b.alive=false});
pipes.forEach(p=>{p.x-=level.speed*dt});pipes=pipes.filter(p=>p.x>-60);
if(!birds.some(b=>b.alive))finish()}
function drawBird(b){ctx.save();ctx.globalAlpha=b.alive?1:.35;ctx.translate(b.x,b.y);ctx.rotate(Math.max(-.5,Math.min(1,b.v*.08)));
ctx.fillStyle=b.skin.body;ctx.beginPath();ctx.ellipse(0,0,16,12,0,0,7);ctx.fill();ctx.fillStyle=b.skin.wing;ctx.beginPath();ctx.ellipse(-4,Math.sin(wing)*4+2,9,6,0,0,7);ctx.fill();
ctx.fillStyle="#fde047";ctx.beginPath();ctx.moveTo(12,-2);ctx.lineTo(24,2);ctx.lineTo(12,6);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(7,-5,4,0,7);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.arc(8,-5,1.8,0,7);ctx.fill();ctx.restore()}
function draw(){ctx.fillStyle="#7dd3fc";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";[[50,70],[200,40],[300,100]].forEach(([x,y])=>{ctx.beginPath();ctx.ellipse(x,y,30,13,0,0,7);ctx.fill()});
pipes.forEach(p=>{ctx.fillStyle="#16a34a";ctx.fillRect(p.x,0,50,p.top);ctx.fillRect(p.x,p.top+p.gap,50,GROUND-p.top-p.gap);ctx.fillStyle="#15803d";ctx.fillRect(p.x-4,p.top-16,58,16);ctx.fillRect(p.x-4,p.top+p.gap,58,16)});
ctx.fillStyle="#ca8a04";ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle="#65a30d";ctx.fillRect(0,GROUND,W,10);
birds.forEach(drawBird);
ctx.fillStyle="#fff";ctx.font="bold 36px Arial";ctx.textAlign="center";ctx.strokeStyle="#0c4a6e";ctx.lineWidth=4;
if(count===2){[W/4,W*3/4].forEach((x,i)=>{ctx.fillStyle=SKINS[i].body;ctx.font="bold 16px Arial";ctx.strokeText(SKINS[i].name,x,30);ctx.fillText(SKINS[i].name,x,30);ctx.fillStyle="#fff";ctx.font="bold 32px Arial";ctx.strokeText(birds[i].score,x,66);ctx.fillText(birds[i].score,x,66)})}
else{ctx.strokeText(birds[0].score,W/2,60);ctx.fillText(birds[0].score,W/2,60)}
if(state==="ready"){ctx.font="bold 20px Arial";const t=count===2?"P1: Space · P2: Enter":"Tap or press Space";ctx.strokeText(t,W/2,H/2+60);ctx.fillText(t,W/2,H/2+60)}}
function loop(now){const dt=Math.min(2,(now-last)/16.67||1);last=now;wing+=.3*dt;if(state==="play")step(dt);else if(state==="ready")birds.forEach((b,i)=>{b.y=H/2-20+Math.sin(now/250+i)*6});draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>

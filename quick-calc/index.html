<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Calc | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial;background:#3b0764;color:#faf5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(145deg,#3b0764,#701a75)}main{width:min(100%,34rem);text-align:center;padding:2rem;border:1px solid #f0abfc;border-radius:1rem;background:#581c87}a{color:#f5d0fe}h1{color:#fef08a}.question{font-size:clamp(2.5rem,10vw,5rem);margin:1rem}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}button{min-height:3.5rem;border:0;border-radius:.6rem;background:#f0abfc;color:#581c87;font:inherit;font-size:1.3rem;font-weight:bold;cursor:pointer}button:hover,button:focus-visible{outline:3px solid #fef08a}#status{min-height:1.5rem;color:#fef08a;font-weight:bold}</style></head>
<body><main><a href="../">← All games</a><h1>⚡ Quick Calc</h1><p>Choose the right answer before time runs out.</p><p>Score: <strong id="score">0</strong> · Time: <strong id="time">45</strong></p><div class="question" id="question">?</div><div class="answers" id="answers"></div><p id="status" aria-live="polite">Solve the first problem!</p></main><script>
const q=document.querySelector("#question"),answers=document.querySelector("#answers"),scoreEl=document.querySelector("#score"),timeEl=document.querySelector("#time"),status=document.querySelector("#status");let score=0,time=45,answer,live=true;
function next(){let a=1+Math.floor(Math.random()*12),b=1+Math.floor(Math.random()*12);answer=a+b;q.textContent=`${a} + ${b}`;let choices=new Set([answer]);while(choices.size<4)choices.add(answer+(Math.floor(Math.random()*9)-4));answers.replaceChildren();[...choices].sort(()=>Math.random()-.5).forEach(n=>{let button=document.createElement("button");button.textContent=n;button.onclick=()=>pick(n);answers.append(button)})}
function pick(n){if(!live)return;if(n===answer){score++;scoreEl.textContent=score;status.textContent="Correct!";next()}else{status.textContent="Try the next one!";next()}}
setInterval(()=>{if(!live)return;time--;timeEl.textContent=time;if(time<=0){live=false;status.textContent=`Time! Final score: ${score}.`;answers.replaceChildren()}},1000);next();
</script></body></html>

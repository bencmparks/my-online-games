 if(r.kind==="hike"){objs=[];hk={d:0,cool:0};P.x=W/2;P.y=340;const rn=(a,b)=>a+Math.random()*(b-a);

 if(r.kind==="route"){objs=[];P.x=60;P.y=360;for(let i=0;i<6;i++){let px,py,t=0;do{px=70+Math.random()*440;py=130+Math.random()*220;t++}while(t<60&&objs.some(o=>Math.hypot(o.x-px,o.y-py)<80));objs.push({k:"kid",x:px,y:py})}objs.push({k:"sch",x:585,y:110});[[200,1],[260,-1],[320,1]].forEach(([y,d],i)=>objs.push({k:"car",x:100+i*200,y:y,vx:d*(80+i*25),cool:0}))}

function cardPick(o){

}

}

function routeLogic(dt,r){

  else if(o.k==="sch"&&Math.hypot(o.x-P.x,o.y-P.y)<50){
   if(got>=r.need&&st==="play"&&!wait){score+=100+hearts*20;journal[li+"-"+ri]=r.fact;bk();msg="🏫 Everyone made it to school on a Patterson bus!";wait=2}
   else if(got<r.need)msg="🏫 Pick up all "+r.need+" kids first! ("+got+"/"+r.need+")"}

  if(o.k==="lan"){o.x+=o.vx*dt;if(o.x<30||o.x>W-30)o.vx*=-1;const sy=340-(o.wz-D.d);

  else if(o.k==="sign"&&o.m&&!o.seen&&D.d>=o.wz-60){o.seen=1;msg=o.m;score+=50}
 }
 if(shake>0)shake-=dt;
 if(D.d>=r.len&&!D.done&&st==="play"){D.done=1;score+=100+hearts*20;journal[li+"-"+ri]=r.fact;bk();msg="⭐ Charles made it to freedom!";wait=2}
}

function driveUpdate(dt){
 const D=drv,r=R(),brake=keys.s||keys.arrowdown||keys[" "]||pbrake;
 D.v+=((brake?0:170)-D.v)*Math.min(1,dt*(brake?7:2.5));
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 if(dx)tgt=null;else if(tgt)dx=Math.abs(tgt.x-P.x)>6?Math.sign(tgt.x-P.x):0;
 P.x=Math.max(150,Math.min(490,P.x+dx*240*dt));P.y=340;
 const mv=D.v*dt;D.d+=mv;D.off=(D.off+mv)%60;
 for(const o of objs)o.y+=mv;
 D.ot-=dt*D.v/170;D.lt-=mv;
 if(D.d<r.len-350){
  if(D.ot<=0){D.ot=.9+Math.random()*.6;if(!objs.some(o=>o.k==="lt"&&o.y<260))objs.push({k:"ob",l:["🪨","🚧","🐄","🛢️"][Math.random()*4|0],x:150+Math.random()*340,y:95})}
  if(D.lt<=0){D.lt=700;objs.push({k:"lt",y:95,t:0,red:true})}
 }
 for(const o of objs){
  if(o.k==="lt"){o.t+=dt;if(o.t>3.5)o.red=false;if(!o.passed&&o.y>=P.y){o.passed=true;if(o.red&&D.v>25)hurt("🚦 You ran a red light! Stop when it is red.")}}
  else if(Math.abs(o.x-P.x)<34&&Math.abs(o.y-P.y)<34){o.gone=true;hurt("💥 You hit an obstacle!")}
 }
 objs=objs.filter(o=>!o.gone&&o.y<H+40);
 if(shake>0)shake-=dt;
 if(D.d>=r.len&&!D.done&&st==="play"){D.done=1;score+=100+hearts*20;journal[li+"-"+ri]=r.fact;bk();msg="🏁 You drove the Patterson-Greenfield!";wait=2}
}
function near(){let b=null,bd=75;for(const o of objs){if(o.k==="f"||o.k==="ob"||o.k==="lt"||o.k==="kid"||o.k==="car"||o.k==="sch"||o.k==="tree"||o.k==="rock"||o.k==="lan"||o.k==="sign"||R().kind==="chase")continue;const d=Math.hypot(o.x-P.x,o.y-P.y);if(d<bd){bd=d;b=o}}return b}
addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=1;if(k===" "||k==="e"){const o=near();if(o)pick(o);e.preventDefault()}if(k.startsWith("arrow"))e.preventDefault()});
addEventListener("keyup",e=>delete keys[e.key.toLowerCase()]);
cv.addEventListener("pointerdown",e=>{
 const b=cv.getBoundingClientRect(),mx=(e.clientX-b.left)*W/b.width,my=(e.clientY-b.top)*H/b.height;
 let o=null,bd=45;for(const q of objs){const d=Math.hypot(q.x-mx,q.y-my);if(d<bd||(q.k==="door"&&Math.abs(q.x-mx)<q.w/2&&Math.abs(q.y-my)<40)){bd=d;o=q}}
 if((R().kind==="drive"||R().kind==="hike")&&Math.hypot(mx-575,my-345)<42){pbrake=true;return}
 tgt={x:mx,y:Math.max(70,Math.min(H-16,my)),o};
});
addEventListener("pointerup",()=>pbrake=false);
function update(dt){
 if(wait>0){wait-=dt;if(wait<=0)nextRound();return}
 if(st!=="play")return;if(R().kind==="drive")return driveUpdate(dt);if(R().kind==="hike")return hikeUpdate(dt);
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(dx||dy)tgt=null;
 else if(tgt){const ex=tgt.x-P.x,ey=tgt.y-P.y,d=Math.hypot(ex,ey);
  if(tgt.o&&Math.hypot(tgt.o.x-P.x,tgt.o.y-P.y)<55){pick(tgt.o);tgt=null}
  else if(d<6)tgt=null;else{dx=ex/d;dy=ey/d}}
 const m=Math.hypot(dx,dy)||1;
 if(dx||dy){P.x+=dx/m*180*dt;P.y+=dy/m*180*dt;P.t+=dt*10}
 P.x=Math.max(16,Math.min(W-16,P.x));P.y=Math.max(70,Math.min(H-16,P.y));
 for(const o of objs)if(o.k==="p"&&R().kind!=="hunt"){o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x<40||o.x>W-40)o.vx*=-1;if(o.y<140||o.y>340)o.vy*=-1;if(Math.random()<dt*.4){o.vx=(Math.random()-.5)*50*o.sp;o.vy=(Math.random()-.5)*50*o.sp}}
 const r=R();
 if(r.kind==="route")routeLogic(dt,r);
 if(r.kind==="chase")for(const o of objs)if(!o.done&&!o.bad&&Math.hypot(o.x-P.x,o.y-P.y)<36)pick(o);
 if(r.kind==="memory"&&lock>0){lock-=dt;if(lock<=0){open=[]}}
 if(r.kind==="fall"){
  spawn-=dt;
  if(spawn<=0){spawn=.75;const ok=Math.random()<.4,pool=r.opts.filter(d=>!!d.ok===ok),d=pool[Math.random()*pool.length|0];objs.push({k:"f",l:d.l,ok:d.ok,x:50+Math.random()*(W-100),y:70,vy:110+Math.random()*50})}
  for(const o of objs)if(o.k==="f"){o.y+=o.vy*dt;if(Math.abs(o.x-P.x)<42&&Math.abs(o.y-P.y)<30)pick(o)}
  objs=objs.filter(o=>!o.gone&&o.y<H+20);
 }
 if(shake>0)shake-=dt;
}
function wrap(t,mw,f){x.font=f;const w=t.split(" "),ls=[];let c="";for(const s of w){if(x.measureText(c+" "+s).width>mw&&c){ls.push(c);c=s}else c=c?c+" "+s:s}ls.push(c);return ls}
function bow(a,b,s){x.fillStyle="#2563eb";x.beginPath();x.moveTo(a,b);x.lineTo(a-9*s,b-5*s);x.lineTo(a-9*s,b+5*s);x.closePath();x.moveTo(a,b);x.lineTo(a+9*s,b-5*s);x.lineTo(a+9*s,b+5*s);x.closePath();x.fill();x.fillStyle="#1e3a8a";x.beginPath();x.arc(a,b,2.6*s,0,7);x.fill()}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function draw(){
 const l=L[li]||L[L.length-1];
 x.save();if(shake>0)x.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
 x.fillStyle=l.bg;x.fillRect(0,0,W,H);
 x.fillStyle="rgb(0 0 0 / 8%)";for(let i=0;i<W;i+=64)for(let j=60;j<H;j+=64)if((i+j)/64%2<1)x.fillRect(i,j,64,64);
 x.fillStyle="#2a1c10";x.fillRect(0,0,W,60);
 x.textAlign="center";x.textBaseline="middle";
 if(st==="play"||st==="fail"){
  const r=R();x.fillStyle="#fcd34d";const ls=wrap((r.ask+(r.need>1?"  ("+got+"/"+r.need+")":"")),600,"bold 17px Georgia");
  ls.forEach((s,i)=>x.fillText(s,W/2,24+i*20+(ls.length>1?-6:6)));
  x.textAlign="left";x.font="20px serif";x.fillStyle="#ef4444";x.fillText("♥".repeat(Math.max(0,hearts)),8,76);x.textAlign="right";x.font="bold 15px Georgia";x.fillStyle="#2a1c10";x.fillText("Score "+score+"   Lv "+(li+1)+"/"+L.length,W-8,76);x.textAlign="center";
 }
 if(st!=="intro"&&R().kind==="drive"){x.fillStyle="#5b6169";x.fillRect(120,90,400,H-90);x.fillStyle="#fff";for(const lx of[253,387])for(let y=-60+drv.off;y<H;y+=60)x.fillRect(lx-3,Math.max(90,y),6,y<90?Math.max(0,y+30-90):30);x.fillRect(120,90,5,H-90);x.fillRect(515,90,5,H-90);
  x.fillStyle="rgb(0 0 0 / 40%)";x.fillRect(200,64,240,10);x.fillStyle="#fcd34d";x.fillRect(200,64,240*Math.min(1,drv.d/R().len),10);x.font="14px serif";x.fillText("🏁",452,69);
  x.fillStyle=pbrake?"#991b1b":"#dc2626";x.beginPath();x.arc(575,345,36,0,7);x.fill();x.fillStyle="#fff";x.font="bold 13px Georgia";x.fillText("BRAKE",575,345)}
 if(st!=="intro"&&R().kind==="hike"){x.fillStyle="rgb(0 0 0 / 40%)";x.fillRect(200,64,240,10);x.fillStyle="#fde68a";x.fillRect(200,64,240*Math.min(1,hk.d/R().len),10);x.font="14px serif";x.fillText("⭐",452,69);
  x.fillStyle=hiding?"#1e3a8a":"#2563eb";x.beginPath();x.arc(575,345,36,0,7);x.fill();x.fillStyle="#fff";x.font="bold 13px Georgia";x.fillText("HIDE",575,345);
  if(hiding){x.fillStyle="rgb(0 0 0 / 45%)";x.fillRect(0,60,W,H-60)}}
 const nr=near();
 for(const o of objs){
  if(o.k==="tree"||o.k==="rock"||o.k==="lan"||o.k==="sign"){const sy=340-(o.wz-hk.d);if(sy>66&&sy<H+30){
   if(o.k==="tree"){x.font="36px serif";x.fillText("🌲",o.x,sy)}
   else if(o.k==="rock"){x.font="30px serif";x.fillText("🪨",o.x,sy)}
   else if(o.k==="lan"){x.fillStyle="rgb(253 224 71 / 30%)";x.beginPath();x.arc(o.x,sy,52,0,7);x.fill();x.font="30px serif";x.fillText("🏮",o.x,sy)}
   else{x.font="bold 15px Georgia";const w=x.measureText(o.t).width+22;x.fillStyle=o.m?"rgb(0 0 0 / 70%)":"#facc15";rr(W/2-w/2,sy-12,w,24,10);x.fill();x.fillStyle=o.m?"#fff":"#2a1c10";x.fillText(o.t,W/2,sy)}}continue}
  if(o.k==="kid"){if(!o.done){x.font="30px serif";x.fillText("🧒🏿",o.x,o.y)}continue}
  if(o.k==="sch"){x.font="46px serif";x.fillText("🏫",o.x,o.y);continue}
  if(o.k==="car"){x.font="34px serif";x.fillText("🚗",o.x,o.y);continue}
  if(o.k==="ob"){x.font="38px serif";x.fillText(o.l,o.x,o.y);continue}
  if(o.k==="lt"){x.fillStyle=o.red?"#dc2626":"#16a34a";x.fillRect(120,o.y-3,400,6);x.font="30px serif";x.fillText(o.red?"🔴":"🟢",96,o.y);x.fillText(o.red?"🔴":"🟢",544,o.y);x.font="bold 13px Georgia";x.fillStyle="#fff";x.fillText(o.red?"STOP":"GO",W/2,o.y-14);continue}
  if(o.k==="f"){x.font="bold 20px Georgia";const w=x.measureText(o.l).width+22;x.fillStyle="#7c2d12";rr(o.x-w/2,o.y-15,w,30,15);x.fill();x.strokeStyle="#fcd34d";x.lineWidth=2;x.stroke();x.fillStyle="#fff";x.fillText(o.l,o.x,o.y);continue}
  if(o.k==="card"){const up=o.done||open.includes(o);x.fillStyle=o.done?"#15803d":up?"#fff":"#7c2d12";rr(o.x-40,o.y-48,80,96,10);x.fill();x.lineWidth=o===nr?4:2;x.strokeStyle=o===nr?"#fff":"#fcd34d";x.stroke();x.fillStyle=o.done?"#fff":up?"#2a1c10":"#fcd34d";if(up){const w=o.l.split(" "),m=o.l.length>10&&w.length>1?Math.ceil(w.length/2):w.length,ln=m<w.length?[w.slice(0,m).join(" "),w.slice(m).join(" ")]:[o.l];x.font="bold "+(o.l.length>7?13:16)+"px Georgia";ln.forEach((s,i)=>x.fillText(s,o.x,o.y-4+(i-(ln.length-1)/2)*16));x.font="11px Georgia";x.fillText((R().tags||["name","role"])[o.t==="n"?0:1],o.x,o.y+34)}else{x.font="bold 34px Georgia";x.fillText("?",o.x,o.y)}continue}
  if(o.k==="door"){
   x.fillStyle=o.done?"#15803d":o.bad?"#555":"#7c2d12";rr(o.x-o.w/2,o.y-34,o.w,68,10);x.fill();
   x.lineWidth=o===nr?4:2;x.strokeStyle=o===nr?"#fff":"#fcd34d";x.stroke();
   x.fillStyle="#fff";x.font="bold "+(o.l.length>10?15:20)+"px Georgia";x.fillText(o.l,o.x,o.y);
   if(o.done)x.fillText("✔",o.x+o.w/2-14,o.y-24);if(o.bad)x.fillText("✘",o.x+o.w/2-14,o.y-24);
  }else{
   if(o===nr){x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.arc(o.x,o.y,30,0,7);x.stroke()}
   x.globalAlpha=o.bad?.4:1;x.font="38px serif";x.fillText(o.e,o.x,o.y);if(o.e==="👦🏿"||o.e==="👨🏿")bow(o.x,o.y+15,1);x.globalAlpha=1;
   x.font="bold 12px Georgia";const w=x.measureText(o.l).width+10;x.fillStyle=o.done?"#15803d":o.bad?"#7f1d1d":"rgb(0 0 0 / 70%)";rr(o.x-w/2,o.y+22,w,17,8);x.fill();x.fillStyle="#fff";x.fillText(o.l,o.x,o.y+31);
   if(o.done)x.fillText("✔",o.x+22,o.y-20);if(o.bad)x.fillText("✘",o.x+22,o.y-20);
  }
 }
 x.font="40px serif";x.fillStyle="#fff";x.fillText(R().kind==="drive"?"🚘":R().kind==="route"?"🚌":"🧑🏿",P.x,P.y-Math.abs(Math.sin(P.t))*5);
 if(R().kind!=="drive"&&R().kind!=="route"&&R().kind!=="hike")bow(P.x,P.y-Math.abs(Math.sin(P.t))*5+15,1.1);
 x.font="bold 11px Georgia";x.fillStyle="#fcd34d";x.fillText("You",P.x,P.y+24);
 if(msg){const ls=wrap(msg,560,"bold 15px Georgia");x.fillStyle="rgb(0 0 0 / 78%)";rr(20,H-14-ls.length*20-8,W-40,ls.length*20+10,8);x.fill();x.fillStyle="#fff";x.textAlign="center";ls.forEach((s,i)=>x.fillText(s,W/2,H-14-ls.length*20+8+i*20))}
 x.restore();
}

(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)})(last);

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#020617;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 50% 0,#1e3a8a,#020617)}
main{width:min(100%,34rem);padding:1.5rem;border:.2rem solid #38bdf8;border-radius:1.25rem;background:rgb(2 6 23 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.6rem 0;color:#bae6fd;font-size:1.6rem}
canvas{display:block;width:100%;height:auto;margin:1rem auto;border:.2rem solid #475569;border-radius:.4rem;background:#000;touch-action:none}
.bar{display:flex;justify-content:center;gap:.8rem;align-items:center;font-weight:bold;color:#fde68a}
select{font:inherit;padding:.3rem;border-radius:.4rem}
</style></head>
<body><main><a href="../">← All games</a><h1>🏓 Pong</h1>
<p>Beat the computer! First to 7 points wins.</p>
<p><strong>Mouse / drag</strong> or <strong>W S / ↑ ↓</strong> to move your paddle · <strong>Space</strong> or tap to serve</p>
<div class="bar"><label>Difficulty <select id="d"><option value="3.2">Easy</option><option value="4.6" selected>Medium</option><option value="6.2">Hard</option></select></label><span id="bs">Wins 0</span></div>
<canvas id="g" width="480" height="320" aria-label="Pong game"></canvas>
</main>
<script>
const C=document.querySelector("#g"),x=C.getContext("2d"),W=480,H=320,PH=64;
let py=H/2,cy=H/2,ps=0,cs=0,ball=null,mode="title",wins=0,keys={},msg="";
try{wins=+localStorage.getItem("pongWins")||0}catch(e){}
const hud=()=>document.querySelector("#bs").textContent="Wins "+wins;hud();
function serve(dir){const a=(Math.random()-.5)*.8;ball={x:W/2,y:H/2,vx:5*dir*Math.cos(a),vy:5*Math.sin(a)};mode="play"}
function begin(){if(mode==="play")return;if(mode==="over"||mode==="title"){ps=cs=0}serve(Math.random()<.5?1:-1)}
function bounce(p,right){const rel=(ball.y-p)/(PH/2),s=Math.min(11,Math.hypot(ball.vx,ball.vy)*1.06);ball.vy=rel*s*.7;ball.vx=Math.sqrt(Math.max(1,s*s-ball.vy*ball.vy))*(right?-1:1)}
function score(p){if(p)ps++;else cs++;ball=null;if(ps>=7||cs>=7){mode="over";msg=ps>=7?"You win!":"Computer wins";if(ps>=7){wins++;try{localStorage.setItem("pongWins",wins)}catch(e){}hud()}}else mode="wait"}
function frame(){
 if(keys.KeyW||keys.ArrowUp)py-=6;if(keys.KeyS||keys.ArrowDown)py+=6;py=Math.max(PH/2,Math.min(H-PH/2,py));
 if(ball){const sp=+document.querySelector("#d").value,t=ball.vx>0?ball.y:H/2;cy+=Math.max(-sp,Math.min(sp,t-cy));cy=Math.max(PH/2,Math.min(H-PH/2,cy));
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.y<6||ball.y>H-6){ball.vy*=-1;ball.y=Math.max(6,Math.min(H-6,ball.y))}
  if(ball.vx<0&&ball.x<30&&ball.x>14&&Math.abs(ball.y-py)<PH/2+6){ball.x=30;bounce(py,false)}
  if(ball.vx>0&&ball.x>W-30&&ball.x<W-14&&Math.abs(ball.y-cy)<PH/2+6){ball.x=W-30;bounce(cy,true)}
  if(ball.x<0)score(0);else if(ball.x>W)score(1)}
 x.fillStyle="#000";x.fillRect(0,0,W,H);x.fillStyle="#334155";for(let i=0;i<H;i+=20)x.fillRect(W/2-2,i,4,10);
 x.fillStyle="#38bdf8";x.fillRect(14,py-PH/2,10,PH);x.fillStyle="#f87171";x.fillRect(W-24,cy-PH/2,10,PH);
 if(ball){x.fillStyle="#fff";x.beginPath();x.arc(ball.x,ball.y,6,0,7);x.fill()}
 x.fillStyle="#e2e8f0";x.font="bold 40px Arial";x.textAlign="center";x.fillText(ps,W/2-60,50);x.fillText(cs,W/2+60,50);
 if(mode!=="play"){x.font="bold 22px Arial";x.fillText(mode==="over"?msg+" · tap to play again":mode==="wait"?"Tap or Space to serve":"Tap or press Space to start",W/2,H-30)}
 requestAnimationFrame(frame)}
function aim(e){const b=C.getBoundingClientRect();py=(e.clientY-b.top)/b.height*H}
C.addEventListener("pointermove",aim);C.addEventListener("pointerdown",e=>{e.preventDefault();aim(e);begin()});
addEventListener("keydown",e=>{keys[e.code]=true;if(["ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();if(e.code==="Space")begin()});
addEventListener("keyup",e=>keys[e.code]=false);
frame();
</script></body></html>

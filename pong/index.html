<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pong | My Online Games</title><style>
  :root { color-scheme: dark; font-family: Arial,sans-serif; background:#172554; color:#eff6ff; } * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; padding:1rem; background:linear-gradient(145deg,#172554,#1e3a8a); } main { width:min(100%,42rem); padding:1.5rem; border:.2rem solid #93c5fd; border-radius:1.25rem; background:rgb(15 23 42 / 90%); text-align:center; } a { color:#bfdbfe; } h1 { margin:.6rem 0; color:#fef08a; } canvas { display:block; width:100%; height:auto; margin:1rem 0; border:.2rem solid #60a5fa; border-radius:.6rem; background:#020617; touch-action:none; } button { padding:.65rem 1rem; border:0; border-radius:.5rem; background:#fef08a; color:#172554; cursor:pointer; font:inherit; font-weight:bold; } .controls { display:flex; justify-content:center; gap:.75rem; } #status { min-height:1.5rem; color:#fef08a; font-weight:bold; }
</style></head>
<body><main><a href="../">← All games</a><h1>🏓 Pong</h1><p>Move your paddle with W/S or the controls. First to five wins.</p><p>You: <strong id="player-score">0</strong> · Computer: <strong id="cpu-score">0</strong></p><canvas id="game" width="600" height="360" aria-label="Pong game"></canvas><div class="controls"><button data-move="-1" type="button">↑ Up</button><button id="start" type="button">Start match</button><button data-move="1" type="button">↓ Down</button></div><p id="status" aria-live="polite">Get ready to serve.</p></main><script>
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),playerScore=document.querySelector("#player-score"),cpuScore=document.querySelector("#cpu-score"),status=document.querySelector("#status"); let player,cpu,ball,keys={},running,frame;
function resetBall(direction=1){ball={x:300,y:180,vx:4*direction,vy:(Math.random()-.5)*5};} function start(){player={y:130};cpu={y:130};player.points=0;cpu.points=0;resetBall();running=true;playerScore.textContent=0;cpuScore.textContent=0;status.textContent="First to five wins!";cancelAnimationFrame(frame);loop();}
function loop(){if(!running)return;player.y=Math.max(0,Math.min(280,player.y+((keys.w?-6:0)+(keys.s?6:0))));cpu.y+=Math.sign(ball.y-(cpu.y+40))*3.2;cpu.y=Math.max(0,Math.min(280,cpu.y));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y<7||ball.y>353)ball.vy*=-1;for(const paddle of [{x:18,y:player.y,side:1},{x:570,y:cpu.y,side:-1}])if(ball.x>paddle.x-8&&ball.x<paddle.x+18&&ball.y>paddle.y&&ball.y<paddle.y+80){ball.vx=Math.abs(ball.vx)*paddle.side;ball.vy+=(ball.y-(paddle.y+40))/16;}if(ball.x<0)point(cpu,-1);if(ball.x>600)point(player,1);draw();frame=requestAnimationFrame(loop);}
function point(winner,direction){winner.points+=1;playerScore.textContent=player.points;cpuScore.textContent=cpu.points;if(winner.points===5){running=false;status.textContent=winner===player?"You win the match!":"Computer wins the match.";}else resetBall(direction);}
function draw(){ctx.fillStyle="#020617";ctx.fillRect(0,0,600,360);ctx.setLineDash([10,10]);ctx.strokeStyle="#64748b";ctx.beginPath();ctx.moveTo(300,0);ctx.lineTo(300,360);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#fef08a";ctx.fillRect(18,player.y,12,80);ctx.fillRect(570,cpu.y,12,80);ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,Math.PI*2);ctx.fill();}
document.addEventListener("keydown",event=>{if(event.key.toLowerCase()==="w")keys.w=true;if(event.key.toLowerCase()==="s")keys.s=true;});document.addEventListener("keyup",event=>{if(event.key.toLowerCase()==="w")keys.w=false;if(event.key.toLowerCase()==="s")keys.s=false;});document.querySelectorAll("[data-move]").forEach(button=>{const key=Number(button.dataset.move)<0?"w":"s";button.addEventListener("pointerdown",()=>keys[key]=true);button.addEventListener("pointerup",()=>keys[key]=false);button.addEventListener("pointerleave",()=>keys[key]=false);});document.querySelector("#start").addEventListener("click",start);start();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bomb Mergers | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 50% 0,#7f1d1d,#0b1020 70%)}
main{width:min(100%,60rem);padding:1.25rem;border:.2rem solid #fb923c;border-radius:1.25rem;background:rgb(8 12 30 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.5rem 0;color:#fed7aa;font-size:1.6rem}p{font-size:.9rem}
canvas{display:block;width:100%;height:auto;margin:.8rem auto;border:.2rem solid #475569;border-radius:.4rem;touch-action:none}
.row{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}.row button{padding:.65rem 1rem;border:0;border-radius:.6rem;background:#ea580c;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;user-select:none}.row button:disabled{opacity:.45;cursor:not-allowed}.row button.u{background:#7c3aed}
</style></head>
<body><main><a href="../">← All games</a><h1>💣 Bomb Mergers</h1>
<p>Buy bombs, <strong>drag matching bombs together</strong> to merge them into bigger blasts, then <strong>drag a bomb onto the castle</strong> to launch it! Bombs earn coins even while you're away. Wreck castle after castle and keep climbing. <strong>Space</strong> buys a bomb.</p>
<canvas id="c" width="900" height="520" aria-label="Bomb Mergers game"></canvas>
<div class="row"><button id="bb">💣 Buy bomb</button><button id="bp" class="u">⚡ Power</button><button id="bf" class="u">🏭 Factory</button></div>
</main>
<script>
const C=document.querySelector("#c"),x=C.getContext("2d"),W=900,H=520,N=5,CS=84,BXo=30,BYo=90,KEY="bombMergersSave";
const COLS=["#94a3b8","#38bdf8","#34d399","#fbbf24","#fb923c","#f87171","#e879f9","#a78bfa","#22d3ee","#a3e635","#f472b6","#fde047"];
const S0=()=>({coins:30,grid:Array(N*N).fill(0),bought:0,castle:0,hp:null,power:0,factory:0,time:Date.now(),best:1});
let S=S0();try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.grid&&s.grid.length===N*N)S=Object.assign(S0(),s)}catch(e){}
const chp=n=>Math.round(120*Math.pow(1.75,n)),dmg=l=>Math.round(6*Math.pow(2,l-1)*(1+S.power*.25)),inc=l=>.25*Math.pow(2,l-1),cost=()=>Math.floor(10*Math.pow(1.13,S.bought)),pcost=()=>Math.round(80*Math.pow(2.2,S.power)),fcost=()=>Math.round(150*Math.pow(2.4,S.factory)),fint=()=>Math.max(1,5-S.factory*.75);
if(S.hp==null)S.hp=chp(S.castle);
let drag=null,fx=[],shots=[],shake=0,toast="",toastT=0,fac=0,saveT=0,flash=[];
function say(s,t=2.2){toast=s;toastT=t}
{const away=Math.min(8*3600,(Date.now()-S.time)/1000);const per=S.grid.reduce((a,l)=>a+(l?inc(l):0),0);if(away>30&&per>0){const g=Math.floor(away*per);S.coins+=g;say(`Welcome back! Your bombs earned 🪙${g}`,4)}}
function save(){S.time=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function freeCell(){const f=[];S.grid.forEach((v,i)=>{if(!v)f.push(i)});return f.length?f[Math.floor(Math.random()*f.length)]:-1}
function buy(){const c=freeCell();if(c<0){say("Board full! Merge some bombs.");return}if(S.coins<cost())return;S.coins-=cost();S.bought++;S.grid[c]=1;flash.push({i:c,t:.3});save()}
function cellAt(px,py){const c=Math.floor((px-BXo)/CS),r=Math.floor((py-BYo)/CS);return c>=0&&c<N&&r>=0&&r<N?r*N+c:-1}
function pos(e){const r=C.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
const CX=690,CY=330;
C.addEventListener("pointerdown",e=>{const[px,py]=pos(e),i=cellAt(px,py);if(i>=0&&S.grid[i])drag={i,x:px,y:py}});
addEventListener("pointermove",e=>{if(drag){const[px,py]=pos(e);drag.x=px;drag.y=py}});
addEventListener("pointerup",e=>{if(!drag)return;const[px,py]=pos(e),j=cellAt(px,py),i=drag.i,l=S.grid[i];drag=null;
 if(j>=0&&j!==i){if(S.grid[j]===l){S.grid[i]=0;S.grid[j]=l+1;S.best=Math.max(S.best,l+1);flash.push({i:j,t:.35});burst(BXo+(j%N)*CS+CS/2,BYo+Math.floor(j/N)*CS+CS/2,COLS[l%COLS.length],12)}else{S.grid[i]=S.grid[j];S.grid[j]=l}save()}
 else if(px>520){S.grid[i]=0;shots.push({x:BXo+(i%N)*CS+CS/2,y:BYo+Math.floor(i/N)*CS+CS/2,l,t:0,sx:0,sy:0});save()}});
function burst(px,py,col,n=16){for(let k=0;k<n;k++){const a=Math.random()*6.3,s=60+Math.random()*240;fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,t:.7,c:col})}}
function hitCastle(l){const d=dmg(l);S.hp-=d;shake=.25;burst(CX,CY-20,COLS[(l-1)%COLS.length],26+l*2);fx.push({txt:"-"+d,x:CX+Math.random()*60-30,y:CY-90,vx:0,vy:-60,t:1});
 if(S.hp<=0){const r=Math.round(60*Math.pow(1.5,S.castle));S.coins+=r;say(`Castle ${S.castle+1} destroyed! +🪙${r}`,3);burst(CX,CY,"#fde047",60);S.castle++;S.hp=chp(S.castle)}save()}
function update(dt){
 const per=S.grid.reduce((a,l)=>a+(l?inc(l):0),0);S.coins+=per*dt;
 fac+=dt;if(fac>=fint()){fac=0;const c=freeCell();if(c>=0){S.grid[c]=1;flash.push({i:c,t:.3})}}
 for(const f of fx){f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(!f.txt)f.vy+=300*dt}fx=fx.filter(f=>f.t>0);
 for(const f of flash)f.t-=dt;flash=flash.filter(f=>f.t>0);
 for(const s of shots){s.t+=dt/.7;if(!s.sx){s.sx=s.x;s.sy=s.y}const u=Math.min(1,s.t);s.x=s.sx+(CX-s.sx)*u;s.y=s.sy+(CY-40-s.sy)*u-Math.sin(u*Math.PI)*160;if(s.t>=1&&!s.done){s.done=true;hitCastle(s.l)}}
 shots=shots.filter(s=>!s.done);if(shake>0)shake-=dt;if(toastT>0)toastT-=dt;
 saveT+=dt;if(saveT>5){saveT=0;save()}
 bb.textContent=`💣 Buy bomb 🪙${cost()}`;bb.disabled=S.coins<cost();bp.textContent=`⚡ Power Lv${S.power} 🪙${pcost()}`;bp.disabled=S.coins<pcost();bf.textContent=`🏭 Factory Lv${S.factory} 🪙${fcost()}`;bf.disabled=S.coins<fcost();
}
function text(s,a,b,size,col,al="center"){x.font=`bold ${size}px Arial`;x.textAlign=al;x.fillStyle=col;x.lineWidth=4;x.strokeStyle="#0f172a";x.lineJoin="round";x.strokeText(s,a,b);x.fillText(s,a,b)}
function bomb(px,py,l,sz=1){const col=COLS[(l-1)%COLS.length],r=(24+Math.min(10,l*1.2))*sz;x.fillStyle="rgba(0,0,0,.35)";x.beginPath();x.ellipse(px,py+r*.9,r*.8,r*.3,0,0,6.3);x.fill();
 const g=x.createRadialGradient(px-r*.3,py-r*.3,2,px,py,r);g.addColorStop(0,col);g.addColorStop(1,"#0f172a");x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,6.3);x.fill();x.strokeStyle=col;x.lineWidth=3;x.stroke();
 x.strokeStyle="#a16207";x.lineWidth=3;x.beginPath();x.moveTo(px+r*.5,py-r*.8);x.quadraticCurveTo(px+r*.9,py-r*1.2,px+r*1.1,py-r*.9);x.stroke();x.fillStyle=Math.random()<.5?"#fde047":"#fb923c";x.beginPath();x.arc(px+r*1.1,py-r*.9,4,0,6.3);x.fill();
 text(String(l),px,py+7*sz,20*sz,"#fff")}
function castle(){const sh=shake>0?(Math.random()-.5)*8:0,hue=(S.castle*40)%360,col=`hsl(${hue},20%,45%)`,dk=`hsl(${hue},20%,30%)`;x.save();x.translate(CX+sh,CY);
 x.fillStyle=dk;x.fillRect(-120,-130,50,130);x.fillRect(70,-130,50,130);x.fillStyle=col;x.fillRect(-90,-100,180,100);
 for(const bx of[-120,-100,70,90]){x.fillStyle=dk;x.fillRect(bx,-146,16,16)}for(const bx of[-90,-60,-20,20,60]){x.fillStyle=col;x.fillRect(bx,-116,16,16)}
 x.fillStyle="#1e293b";x.beginPath();x.arc(0,0,34,Math.PI,0);x.fill();
 x.fillStyle="#fde047";for(const wx of[-100,95]){x.fillRect(wx-3,-95,6,16)}
 x.fillStyle="#ef4444";x.fillRect(-98,-168,3,30);x.beginPath();x.moveTo(-95,-168);x.lineTo(-70,-160);x.lineTo(-95,-152);x.fill();
 x.restore()}
function draw(){
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1e1b4b");g.addColorStop(1,"#7c2d12");x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle="#431407";x.fillRect(520,CY,380,H-CY);x.fillStyle="#57534e";x.fillRect(520,CY,380,6);
 text(`🪙 ${Math.floor(S.coins)}`,24,40,32,"#fde047","left");const per=S.grid.reduce((a,l)=>a+(l?inc(l):0),0);text(`+${per.toFixed(1)}/s`,24,70,18,"#86efac","left");
 text(`Castle ${S.castle+1}`,CX,50,26,"#fff");x.fillStyle="#7f1d1d";x.fillRect(CX-130,62,260,16);x.fillStyle="#ef4444";x.fillRect(CX-130,62,260*Math.max(0,S.hp/chp(S.castle)),16);text(`${Math.max(0,Math.ceil(S.hp))} HP`,CX,76,13,"#fff");
 x.fillStyle="rgba(15,23,42,.8)";x.beginPath();x.roundRect(BXo-8,BYo-8,N*CS+16,N*CS+16,14);x.fill();
 for(let i=0;i<N*N;i++){const px=BXo+(i%N)*CS,py=BYo+Math.floor(i/N)*CS;x.fillStyle="#1e293b";x.beginPath();x.roundRect(px+3,py+3,CS-6,CS-6,10);x.fill()}
 for(let i=0;i<N*N;i++){const l=S.grid[i];if(!l||(drag&&drag.i===i))continue;const f=flash.find(q=>q.i===i);bomb(BXo+(i%N)*CS+CS/2,BYo+Math.floor(i/N)*CS+CS/2,l,f?1+f.t:1)}
 castle();
 for(const s of shots)bomb(s.x,s.y,s.l,.8);
 for(const f of fx){x.globalAlpha=Math.max(0,f.t);if(f.txt)text(f.txt,f.x,f.y,22,"#fff");else{x.fillStyle=f.c;x.fillRect(f.x-3,f.y-3,6,6)}}x.globalAlpha=1;
 if(drag){bomb(drag.x,drag.y,S.grid[drag.i],1.1);if(drag.x>520){x.strokeStyle="#fde047";x.lineWidth=4;x.setLineDash([10,8]);x.strokeRect(520,100,370,230);x.setLineDash([])}}
 text("Drag a bomb onto the castle to launch it",CX,H-18,16,"#fed7aa");text(`Best bomb Lv${S.best}`,W-12,40,16,"#fff","right");
 if(toastT>0)text(toast,W/2,H/2-30,26,"#fde047");
}
const bb=document.querySelector("#bb"),bp=document.querySelector("#bp"),bf=document.querySelector("#bf");
bb.onclick=buy;bp.onclick=()=>{if(S.coins>=pcost()){S.coins-=pcost();S.power++;save()}};bf.onclick=()=>{if(S.coins>=fcost()){S.coins-=fcost();S.factory++;save()}};
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();buy()}});
addEventListener("beforeunload",save);
let last=performance.now();
function loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>

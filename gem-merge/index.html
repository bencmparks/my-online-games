<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gem Merge | My Online Games</title><style>
:root{font-family:Arial,sans-serif;background:#101827;color:#f8fafc}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1.5rem;background:radial-gradient(circle at 15% 15%,rgb(192 132 252 / 25%) 0 5rem,transparent 5.2rem),linear-gradient(135deg,#101827,#312e81)}main{width:min(100%,31rem);padding:1.5rem;border:1px solid #818cf8;border-radius:1.25rem;background:#1e1b4b;text-align:center}a{color:#ddd6fe}h1{color:#c4b5fd}.stats{display:flex;justify-content:center;gap:1rem;color:#fef3c7;font-weight:bold}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;padding:.5rem;border-radius:.8rem;background:#312e81;touch-action:none}.tile{display:grid;place-items:center;aspect-ratio:1;border-radius:.55rem;background:#4338ca;font-size:clamp(1.25rem,7vw,2.25rem);font-weight:bold}.tile[data-value="0"]{background:rgb(15 23 42 / 55%)}.tile[data-value="2"]{background:#38bdf8}.tile[data-value="4"]{background:#2dd4bf}.tile[data-value="8"]{background:#a3e635}.tile[data-value="16"]{background:#facc15}.tile[data-value="32"]{background:#fb923c}.tile[data-value="64"]{background:#fb7185}.tile[data-value="128"],.tile[data-value="256"],.tile[data-value="512"]{background:#c084fc}button{margin-top:1rem;padding:.65rem 1rem;border:0;border-radius:.5rem;background:#c4b5fd;color:#312e81;cursor:pointer;font:inherit;font-weight:bold}#status{min-height:1.5rem;color:#e0e7ff}</style></head>
<body><main><a href="../">← All games</a> · <a href="../profile/">Profile</a><h1>Gem Merge</h1><p class="stats"><span>Score: <strong id="score">0</strong></span><span>Best: <strong id="best">0</strong></span></p><p id="status" aria-live="polite">Use arrow keys or swipe to merge gems.</p><div class="board" id="board" aria-label="Gem Merge board"></div><button id="new-game" type="button">New game</button></main><script src="../shared/profile.js"></script><script>
const size=4,boardEl=document.querySelector("#board"),scoreEl=document.querySelector("#score"),bestEl=document.querySelector("#best"),statusEl=document.querySelector("#status"),progress=GameProfiles.getGame("gem-merge",{bestScore:0});let board,score,startPoint;
function newGame(){board=Array.from({length:size},()=>Array(size).fill(0));score=0;addGem();addGem();statusEl.textContent="Use arrow keys or swipe to merge gems.";render()}
function addGem(){const empty=[];for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!board[r][c])empty.push([r,c]);if(empty.length){const [r,c]=empty[Math.floor(Math.random()*empty.length)];board[r][c]=Math.random()<.9?2:4}}
function render(){boardEl.replaceChildren();for(let r=0;r<size;r++)for(let c=0;c<size;c++){const tile=document.createElement("div");tile.className="tile";tile.dataset.value=board[r][c];tile.textContent=board[r][c]?`${gem(board[r][c])} ${board[r][c]}`:"";boardEl.append(tile)}scoreEl.textContent=score;bestEl.textContent=progress.bestScore}
function gem(value){return value<8?"💎":value<32?"🔷":value<128?"🔮":"🌟"}
function move(direction){const before=JSON.stringify(board);for(let index=0;index<size;index++){let line;if(direction==="left"||direction==="right")line=board[index];else line=board.map(row=>row[index]);if(direction==="right"||direction==="down")line=line.slice().reverse();line=merge(line);if(direction==="right"||direction==="down")line.reverse();if(direction==="left"||direction==="right")board[index]=line;else for(let row=0;row<size;row++)board[row][index]=line[row]}if(JSON.stringify(board)===before)return;addGem();if(score>progress.bestScore){progress.bestScore=score;GameProfiles.saveGame("gem-merge",progress)}if(!canMove())statusEl.textContent="No moves left! Start a new game.";render()}
function merge(line){const values=line.filter(Boolean);for(let i=0;i<values.length-1;i++)if(values[i]===values[i+1]){values[i]*=2;score+=values[i];values.splice(i+1,1)}return values.concat(Array(size-values.length).fill(0))}
function canMove(){for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!board[r][c]||(r<size-1&&board[r][c]===board[r+1][c])||(c<size-1&&board[r][c]===board[r][c+1]))return true;return false}
document.addEventListener("keydown",event=>{const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};if(map[event.key]){event.preventDefault();move(map[event.key])}});boardEl.addEventListener("pointerdown",event=>{startPoint={x:event.clientX,y:event.clientY}});boardEl.addEventListener("pointerup",event=>{if(!startPoint)return;const dx=event.clientX-startPoint.x,dy=event.clientY-startPoint.y;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?"right":"left":dy>0?"down":"up");startPoint=null});document.querySelector("#new-game").addEventListener("click",newGame);newGame();
</script></body></html>

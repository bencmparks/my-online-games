<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower Defense | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 50% 0,#7f1d1d,#0b1020)}
main{width:min(100%,44rem);padding:1.5rem;border:.2rem solid #f87171;border-radius:1.25rem;background:rgb(8 12 30 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.6rem 0;color:#f87171;letter-spacing:.05em;font-size:1.6rem}
canvas{display:block;width:100%;height:auto;margin:1rem 0;border:.2rem solid #475569;border-radius:.4rem;background:#166534;touch-action:none}
.pad{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.6rem;margin-top:.5rem;user-select:none;-webkit-user-select:none}
button{border:.2rem solid transparent;border-radius:.5rem;background:#f87171;color:#1e293b;cursor:pointer;font:inherit;font-weight:bold;touch-action:none;min-width:6.5rem;height:3.4rem;font-size:1rem}button.on{border-color:#fde047;box-shadow:0 0 .6rem #fde047}
</style></head>
<body><main><a href="../">← All games</a><h1>🏰 Tower Defense</h1>
<p>Stop 10 waves of invaders before they cross the path. You have 20 lives, and the last wave brings a boss!</p>
<p><strong>Pick a tower</strong> (buttons or keys <strong>1 / 2 / 3</strong>), then <strong>click or tap a build spot</strong>. <strong>Click a tower</strong> to upgrade it (up to level 3). <strong>E</strong> or the button starts the next wave.</p>
<canvas id="g" width="640" height="480" aria-label="Tower Defense game"></canvas>
<div class="pad"><button data-t="0" type="button">🏹 Archer 50</button><button data-t="1" type="button">💣 Cannon 90</button><button data-t="2" type="button">❄️ Frost 70</button><button data-k="wave" type="button">▶ START WAVE</button></div>
</main>
<script>
const C=document.querySelector("#g"),x=C.getContext("2d"),W=640,H=480,MAXW=10;
const PATH=[[-20,80],[540,80],[540,200],[100,200],[100,320],[540,320],[540,420],[660,420]];
const SPOTS=[[170,140],[270,140],[370,140],[470,140],[600,140],[170,260],[270,260],[370,260],[470,260],[600,260],[170,380],[300,380],[430,380],[40,260],[40,140]].map(p=>({x:p[0],y:p[1],t:null}));
const TT=[{n:"Archer",cost:50,range:110,rate:28,dmg:12,color:"#22c55e"},{n:"Cannon",cost:90,range:95,rate:80,dmg:28,splash:45,color:"#78716c"},{n:"Frost",cost:70,range:90,rate:50,dmg:3,splash:38,slow:.5,color:"#67e8f9"}];
const ET={grunt:{hp:1,sp:1,r:9,c:"#a3e635",rw:6,l:1},fast:{hp:.6,sp:1.9,r:7,c:"#fbbf24",rw:7,l:1},tank:{hp:3.2,sp:.65,r:12,c:"#a855f7",rw:16,l:2},boss:{hp:1,sp:.5,r:20,c:"#dc2626",rw:150,l:5}};
let segs=[],plen=0;PATH.slice(1).forEach((p,i)=>{const a=PATH[i],l=Math.hypot(p[0]-a[0],p[1]-a[1]);segs.push({a,p,l,s:plen});plen+=l});
function at(d){for(const s of segs)if(d<=s.s+s.l){const f=(d-s.s)/s.l;return[s.a[0]+(s.p[0]-s.a[0])*f,s.a[1]+(s.p[1]-s.a[1])*f]}return PATH[PATH.length-1]}
let mode="title",sel=0,coins=150,lives=20,wave=0,queue=[],spawnT=0,en=[],pj=[],fx=[],best=0,t=0,mouse=[0,0],msg="",msgT=0,active=false;
try{best=+localStorage.getItem("towerDefenseBest")||0}catch(e){}
function reset(){SPOTS.forEach(s=>s.t=null);coins=150;lives=20;wave=0;queue=[];en=[];pj=[];fx=[];active=false;mode="play";say("Place towers, then press E to start wave 1")}
function say(m){msg=m;msgT=180}
function makeWave(n){
 const q=[],hp=1+n*.45+n*n*.12;
 for(let i=0;i<5+n*2;i+=1)q.push("grunt");
 if(n>=2)for(let i=0;i<n*2;i+=1)q.push("fast");
 if(n>=4)for(let i=0;i<Math.floor(n/2);i+=1)q.push("tank");
 if(n===MAXW)q.push("boss");
 for(let i=q.length-1;i>0;i-=1){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
 if(n===MAXW){q.splice(q.indexOf("boss"),1);q.splice(Math.floor(q.length*.6),0,"boss")}
 return q.map(k=>({k,hp:hp}))
}
function startWave(){
 if(mode!=="play"||queue.length||wave>=MAXW)return;
 wave+=1;queue=makeWave(wave);spawnT=0;active=true;
 if(wave>best){best=wave;try{localStorage.setItem("towerDefenseBest",best)}catch(e){}}
 say(wave===MAXW?"FINAL WAVE - boss incoming!":`Wave ${wave}`)
}
function spawn(q){const d=ET[q.k],base=q.k==="boss"?1600:30*q.hp;en.push({k:q.k,d:0,hp:base*d.hp,max:base*d.hp,slow:0})}
function upCost(s){return Math.round(TT[s.t.k].cost*.8*s.t.l)}
function stat(s){const b=TT[s.t.k],m=1+(s.t.l-1)*.45;return{range:b.range*(1+(s.t.l-1)*.12),rate:b.rate/(1+(s.t.l-1)*.2),dmg:b.dmg*m,splash:b.splash?b.splash*(1+(s.t.l-1)*.1):0,slow:b.slow}}
function click(px,py){
 if(mode==="title"||mode==="over"||mode==="won"){reset();return}
 const s=SPOTS.find(s=>Math.hypot(s.x-px,s.y-py)<20);if(!s)return;
 if(!s.t){const c=TT[sel].cost;if(coins<c){say("Not enough coins");return}coins-=c;s.t={k:sel,l:1,cd:0}}
 else if(s.t.l>=3)say("Tower is at max level");
 else{const c=upCost(s);if(coins<c){say(`Upgrade costs ${c}`);return}coins-=c;s.t.l+=1}
}
function hit(e,dmg){e.hp-=dmg}
function update(){
 t+=1;if(msgT>0)msgT-=1;if(mode!=="play")return;
 if(queue.length){spawnT-=1;if(spawnT<=0){spawn(queue.shift());spawnT=wave>=6?28:40}}
 for(const e of en){const d=ET[e.k];if(e.slow>0)e.slow-=1;e.d+=d.sp*(e.slow>0?.5:1)*1.0}
 for(const e of en)if(e.d>=plen&&e.hp>0){lives-=ET[e.k].l;e.hp=-1;e.esc=true;fx.push({x:620,y:420,r:5,c:"#ef4444"})}
 for(const s of SPOTS){if(!s.t)continue;const st=stat(s);s.t.cd-=1;if(s.t.cd>0)continue;
  let tg=null;for(const e of en){if(e.hp<=0)continue;const p=at(e.d);if(Math.hypot(p[0]-s.x,p[1]-s.y)<=st.range&&(!tg||e.d>tg.d))tg=e}
  if(tg){s.t.cd=st.rate;pj.push({x:s.x,y:s.y,tg,k:s.t.k,dmg:st.dmg,sp:st.splash,sl:st.slow,lx:s.x,ly:s.y})}}
 for(const p of pj){
  if(p.tg.hp>0){const q=at(p.tg.d);p.lx=q[0];p.ly=q[1]}
  const dx=p.lx-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy),sp=p.k===1?5:8;
  if(d<=sp){p.done=true;
   if(p.sp){for(const e of en){if(e.hp<=0)continue;const q=at(e.d);if(Math.hypot(q[0]-p.lx,q[1]-p.ly)<=p.sp){hit(e,p.dmg);if(p.sl)e.slow=120}}fx.push({x:p.lx,y:p.ly,r:p.sp,c:p.k===1?"#fb923c":"#67e8f9",life:12})}
   else if(p.tg.hp>0)hit(p.tg,p.dmg)}
  else{p.x+=dx/d*sp;p.y+=dy/d*sp}}
 pj=pj.filter(p=>!p.done);
 for(const e of en)if(e.hp<=0&&!e.esc&&!e.paid){e.paid=true;coins+=ET[e.k].rw}
 en=en.filter(e=>e.hp>0);fx=fx.filter(f=>(f.life=(f.life??8)-1)>0);
 if(lives<=0){lives=0;mode="over"}
 else if(active&&!queue.length&&!en.length){active=false;const b=15+wave*5;coins+=b;if(wave>=MAXW){mode="won";return}say(`Wave ${wave} cleared! +${b} coins`)}
}
function key(k){
 if(k==="wave"){if(mode==="play")startWave();else click(0,0);return}
 if(k>=0&&k<3){sel=k;sync()}
}
function sync(){document.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",+b.dataset.t===sel))}
addEventListener("keydown",e=>{const m={KeyE:"wave",Enter:"wave",Digit1:0,Digit2:1,Digit3:2}[e.code];if(m===undefined)return;e.preventDefault();if(!e.repeat)key(m)});
document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>key(+b.dataset.t)));
document.querySelector("[data-k]").addEventListener("click",()=>key("wave"));
function pos(e){const r=C.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
C.addEventListener("pointermove",e=>{mouse=pos(e)});
C.addEventListener("pointerdown",e=>{e.preventDefault();mouse=pos(e);click(mouse[0],mouse[1])});
function text(s,a,b,size=18,color="#fff",align="left"){x.font=`bold ${size}px Arial,sans-serif`;x.fillStyle=color;x.textAlign=align;x.lineWidth=4;x.strokeStyle="#000";x.strokeText(s,a,b);x.fillText(s,a,b)}
function draw(){
 x.fillStyle="#166534";x.fillRect(0,0,W,H);x.fillStyle="#15803d";for(let i=0;i<40;i+=1)x.fillRect((i*83)%W,(i*131)%H,18,4);
 x.lineJoin="round";x.lineCap="round";x.strokeStyle="#92400e";x.lineWidth=36;x.beginPath();PATH.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
 x.strokeStyle="#b45309";x.lineWidth=28;x.stroke();
 x.fillStyle="#7f1d1d";x.fillRect(612,402,28,36);
 let hover=null;
 for(const s of SPOTS){if(Math.hypot(s.x-mouse[0],s.y-mouse[1])<20)hover=s;
  if(!s.t){x.fillStyle="rgb(0 0 0 / 30%)";x.strokeStyle="#fde68a";x.lineWidth=2;x.beginPath();x.arc(s.x,s.y,17,0,7);x.fill();x.stroke();continue}
  const b=TT[s.t.k];x.fillStyle="#44403c";x.beginPath();x.arc(s.x,s.y,17,0,7);x.fill();x.fillStyle=b.color;
  if(s.t.k===0){x.beginPath();x.moveTo(s.x,s.y-14);x.lineTo(s.x+12,s.y+10);x.lineTo(s.x-12,s.y+10);x.fill()}
  else if(s.t.k===1){x.beginPath();x.arc(s.x,s.y,11,0,7);x.fill();x.fillStyle="#1c1917";x.fillRect(s.x-3,s.y-16,6,14)}
  else{x.beginPath();x.moveTo(s.x,s.y-14);x.lineTo(s.x+12,s.y);x.lineTo(s.x,s.y+14);x.lineTo(s.x-12,s.y);x.fill()}
  x.fillStyle="#fde047";for(let i=0;i<s.t.l;i+=1)x.fillRect(s.x-9+i*7,s.y+17,5,5)}
 if(hover){const st=hover.t?stat(hover):TT[sel];x.strokeStyle="rgb(255 255 255 / 70%)";x.lineWidth=2;x.beginPath();x.arc(hover.x,hover.y,st.range,0,7);x.stroke();
  if(hover.t)text(hover.t.l>=3?"MAX":`Upgrade ${upCost(hover)}`,hover.x,hover.y-24,13,"#fde047","center")}
 for(const e of en){const d=ET[e.k],p=at(e.d);x.fillStyle=e.slow>0?"#38bdf8":d.c;x.strokeStyle="#000";x.lineWidth=2;x.beginPath();x.arc(p[0],p[1],d.r,0,7);x.fill();x.stroke();
  x.fillStyle="#000";x.fillRect(p[0]-12,p[1]-d.r-8,24,4);x.fillStyle="#22c55e";x.fillRect(p[0]-12,p[1]-d.r-8,24*Math.max(0,e.hp/e.max),4)}
 for(const p of pj){x.fillStyle=p.k===1?"#111":p.k===2?"#a5f3fc":"#fef9c3";x.beginPath();x.arc(p.x,p.y,p.k===1?5:3,0,7);x.fill()}
 for(const f of fx){x.fillStyle=f.c;x.globalAlpha=.4;x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill();x.globalAlpha=1}
 x.fillStyle="rgb(0 0 0 / 55%)";x.fillRect(0,0,W,30);
 text(`❤ ${lives}`,10,22,18,"#fca5a5");text(`💰 ${coins}`,90,22,18,"#fde047");text(`Wave ${wave}/${MAXW}`,W/2,22,18,"#fff","center");text(`Best wave ${best}`,W-10,22,16,"#86efac","right");
 if(msgT>0&&mode==="play")text(msg,W/2,H-20,22,"#fde047","center");
 if(mode!=="play"){
  x.fillStyle="rgb(2 6 23 / 65%)";x.fillRect(0,0,W,H);
  if(mode==="title")text("TOWER DEFENSE",W/2,190,52,"#f87171","center");
  else if(mode==="won")text("VICTORY!",W/2,190,56,"#4ade80","center");
  else{text("DEFEATED",W/2,180,52,"#f87171","center");text(`You reached wave ${wave}`,W/2,225,24,"#fff","center")}
  if(Math.floor(t/30)%2)text("Press E or click to "+(mode==="title"?"start":"play again"),W/2,300,24,"#fff","center")}
}
function frame(){update();draw();requestAnimationFrame(frame)}
sync();frame();
</script></body></html>

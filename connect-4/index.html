<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect 4 | My Online Games</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 8% 14%, rgb(250 204 21 / 22%) 0 4.5rem, transparent 4.7rem),
        radial-gradient(circle at 92% 18%, rgb(239 68 68 / 24%) 0 6rem, transparent 6.2rem),
        radial-gradient(circle at 86% 86%, rgb(250 204 21 / 18%) 0 5rem, transparent 5.2rem),
        radial-gradient(circle at 12% 88%, rgb(239 68 68 / 18%) 0 3.5rem, transparent 3.7rem),
        linear-gradient(135deg, #101827 20%, #1e3a5f 100%);
      background-attachment: fixed;
    }

    main {
      position: relative;
      width: min(100%, 42rem);
      padding: 1.5rem;
      border: 1px solid rgb(148 163 184 / 25%);
      border-radius: 1.5rem;
      background: rgb(15 23 42 / 72%);
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 30%);
      text-align: center;
      backdrop-filter: blur(0.5rem);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: #cbd5e1;
    }

    h1 {
      margin: 0;
      color: #facc15;
      font-size: clamp(2.25rem, 8vw, 4rem);
    }

    #status {
      min-height: 1.5rem;
      margin: 0.75rem 0 1.25rem;
      font-size: 1.125rem;
      font-weight: bold;
    }

    .mode-picker {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
    }

    .mode-picker label {
      cursor: pointer;
    }

    .player-guide {
      margin: 0 0 1rem;
      color: #cbd5e1;
    }

    .robot-record {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 0 0 1rem;
      color: #e0e7ff;
      font-weight: bold;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(0.25rem, 1vw, 0.5rem);
      padding: clamp(0.5rem, 2vw, 1rem);
      border-radius: 1rem;
      background: #2563eb;
      box-shadow: 0 0.75rem 0 #153e90;
    }

    .cell {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: #e2e8f0;
      box-shadow: inset 0 0.25rem 0.25rem rgb(15 23 42 / 25%);
      cursor: pointer;
      font-size: clamp(1.25rem, 5vw, 2.5rem);
      line-height: 1;
      transition: transform 100ms ease, background-color 100ms ease;
    }

    .cell:hover:not(:disabled),
    .cell:focus-visible:not(:disabled) {
      outline: 0.2rem solid #facc15;
      outline-offset: 0.1rem;
      transform: scale(1.08);
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.red {
      background: #ef4444;
    }

    .cell.yellow {
      background: #facc15;
    }

    .reaction-panel {
      margin-top: 1.75rem;
    }

    .reaction-panel p {
      margin: 0 0 0.5rem;
      color: #cbd5e1;
    }

    .reaction-buttons {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
    }

    .reaction {
      padding: 0.4rem;
      border: 1px solid #4b6382;
      border-radius: 0.5rem;
      background: #17243a;
      cursor: pointer;
      font-size: 1.5rem;
    }

    .reaction:hover,
    .reaction:focus-visible {
      border-color: #facc15;
      outline: 0.15rem solid #facc15;
      transform: translateY(-0.15rem);
    }

    #reaction-display {
      min-height: 1.25rem;
      margin-top: 0.5rem;
    }

    #celebration {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .celebration-emoji {
      position: absolute;
      top: 45%;
      left: var(--left);
      font-size: clamp(2rem, 8vw, 4rem);
      animation: celebrate 1.5s ease-out var(--delay) both;
    }

    @keyframes celebrate {
      from {
        opacity: 0;
        transform: translateY(1rem) scale(0.5) rotate(0deg);
      }

      25% {
        opacity: 1;
      }

      to {
        opacity: 0;
        transform: translateY(-16rem) translateX(var(--drift)) scale(1.2) rotate(20deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .celebration-emoji {
        animation-duration: 1ms;
      }
    }

    #restart {
      margin-top: 2rem;
      padding: 0.75rem 1.25rem;
      border: 0;
      border-radius: 0.5rem;
      background: #facc15;
      color: #17243a;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
    }

    #restart:hover,
    #restart:focus-visible {
      background: #fde047;
      outline: 0.2rem solid #f8fafc;
      outline-offset: 0.15rem;
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../">← All games</a>
    <h1>Connect 4</h1>
    <div class="mode-picker" aria-label="Game mode">
      <label><input type="radio" name="mode" value="robot" checked> Face the robot</label>
      <label><input type="radio" name="mode" value="local"> Two players</label>
    </div>
    <p class="player-guide">🔴 Red goes first · 🟡 Yellow or 🤖 Robot goes next</p>
    <p class="robot-record" aria-label="Robot mode record">
      <span>🧑 Wins: <span id="player-wins">0</span></span>
      <span>🤖 Wins: <span id="robot-wins">0</span></span>
      <span>🤝 Draws: <span id="draws">0</span></span>
    </p>
    <p id="status" aria-live="polite">Red's turn</p>
    <div class="board" id="board" role="grid" aria-label="Connect 4 board"></div>
    <section class="reaction-panel" aria-label="Reactions">
      <p>Send a reaction</p>
      <div class="reaction-buttons">
        <button class="reaction" type="button" data-emoji="👏" aria-label="Applause">👏</button>
        <button class="reaction" type="button" data-emoji="😄" aria-label="Happy">😄</button>
        <button class="reaction" type="button" data-emoji="😮" aria-label="Surprised">😮</button>
        <button class="reaction" type="button" data-emoji="🔥" aria-label="Fire">🔥</button>
      </div>
      <p id="reaction-display" aria-live="polite"></p>
    </section>
    <button id="restart" type="button">New game</button>
    <div id="celebration" aria-hidden="true"></div>
  </main>

  <script src="../shared/profile.js"></script>
  <script>
    const rows = 6;
    const columns = 7;
    const boardElement = document.querySelector("#board");
    const statusElement = document.querySelector("#status");
    const restartButton = document.querySelector("#restart");
    const modeInputs = document.querySelectorAll('input[name="mode"]');
    const celebrationElement = document.querySelector("#celebration");
    const reactionDisplay = document.querySelector("#reaction-display");
    const reactionButtons = document.querySelectorAll(".reaction");
    const playerWinsElement = document.querySelector("#player-wins");
    const robotWinsElement = document.querySelector("#robot-wins");
    const drawsElement = document.querySelector("#draws");
    const robotStats = GameProfiles.getGame("connect-4", { playerWins: 0, robotWins: 0, draws: 0 });
    let board;
    let currentPlayer;
    let gameOver;
    let robotMoveTimeout;
    let celebrationTimeout;

    function playerName(player) {
      if (player === "red") {
        return "🔴 Red";
      }

      return isRobotMode() ? "🤖 Robot" : "🟡 Yellow";
    }

    function playerColorName(player) {
      return player === "red" ? "Red" : "Yellow";
    }

    function pieceEmoji(player) {
      if (player === "red") {
        return "🔴";
      }

      return isRobotMode() ? "🤖" : "🟡";
    }

    function createBoard() {
      board = Array.from({ length: rows }, () => Array(columns).fill(null));
      currentPlayer = "red";
      gameOver = false;
      clearTimeout(robotMoveTimeout);
      clearTimeout(celebrationTimeout);
      celebrationElement.replaceChildren();
      boardElement.replaceChildren();

      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          const cell = document.createElement("button");
          cell.className = "cell";
          cell.type = "button";
          cell.dataset.row = row;
          cell.dataset.column = column;
          cell.setAttribute("role", "gridcell");
          cell.setAttribute("aria-label", `Column ${column + 1}, row ${row + 1}`);
          cell.addEventListener("click", () => placePiece(column));
          boardElement.append(cell);
        }
      }

      statusElement.textContent = "🔴 Red's turn";
    }

    function getCell(row, column) {
      return boardElement.children[row * columns + column];
    }

    function placePiece(column, isRobotMove = false) {
      if (gameOver || (isRobotMode() && currentPlayer === "yellow" && !isRobotMove)) {
        return;
      }

      const row = getOpenRow(column);
      if (row === -1) {
        statusElement.textContent = `Column ${column + 1} is full. Choose another column.`;
        return;
      }

      board[row][column] = currentPlayer;
      const cell = getCell(row, column);
      cell.classList.add(currentPlayer);
      cell.textContent = pieceEmoji(currentPlayer);
      cell.setAttribute("aria-label", `${playerColorName(currentPlayer)} piece in column ${column + 1}, row ${row + 1}`);

      if (hasWon(row, column)) {
        gameOver = true;
        statusElement.textContent = `🏆 ${playerName(currentPlayer)} wins!`;
        recordRobotResult(currentPlayer === "red" ? "playerWins" : "robotWins");
        disableBoard();
        showCelebration([pieceEmoji(currentPlayer), "🏆", "🎉"]);
        return;
      }

      if (board.every((boardRow) => boardRow.every(Boolean))) {
        gameOver = true;
        statusElement.textContent = "🤝 It's a draw!";
        recordRobotResult("draws");
        showCelebration(["🤝", "✨"]);
        return;
      }

      currentPlayer = currentPlayer === "red" ? "yellow" : "red";
      statusElement.textContent = `${playerName(currentPlayer)}'s turn`;

      if (isRobotMode() && currentPlayer === "yellow") {
        statusElement.textContent = "🤖 Robot is thinking...";
        robotMoveTimeout = setTimeout(() => {
          placePiece(chooseRobotColumn(), true);
        }, 450);
      }
    }

    function getOpenRow(column) {
      for (let row = rows - 1; row >= 0; row -= 1) {
        if (board[row][column] === null) {
          return row;
        }
      }

      return -1;
    }

    function hasWon(row, column, player = currentPlayer) {
      const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
      return directions.some(([rowStep, columnStep]) =>
        countPieces(row, column, rowStep, columnStep, player) +
        countPieces(row, column, -rowStep, -columnStep, player) - 1 >= 4
      );
    }

    function countPieces(row, column, rowStep, columnStep, player) {
      let count = 0;
      let currentRow = row;
      let currentColumn = column;

      while (
        currentRow >= 0 &&
        currentRow < rows &&
        currentColumn >= 0 &&
        currentColumn < columns &&
        board[currentRow][currentColumn] === player
      ) {
        count += 1;
        currentRow += rowStep;
        currentColumn += columnStep;
      }

      return count;
    }

    function disableBoard() {
      for (const cell of boardElement.children) {
        cell.disabled = true;
      }
    }

    function recordRobotResult(result) {
      if (!isRobotMode()) {
        return;
      }

      robotStats[result] += 1;
      GameProfiles.saveGame("connect-4", robotStats);
      updateRobotRecord();
    }

    function updateRobotRecord() {
      playerWinsElement.textContent = robotStats.playerWins;
      robotWinsElement.textContent = robotStats.robotWins;
      drawsElement.textContent = robotStats.draws;
    }

    function showCelebration(emojis) {
      celebrationElement.replaceChildren();
      for (let index = 0; index < 12; index += 1) {
        const emoji = document.createElement("span");
        emoji.className = "celebration-emoji";
        emoji.textContent = emojis[index % emojis.length];
        emoji.style.setProperty("--left", `${6 + ((index * 17) % 88)}%`);
        emoji.style.setProperty("--drift", `${-5 + ((index * 13) % 11)}rem`);
        emoji.style.setProperty("--delay", `${index * 60}ms`);
        celebrationElement.append(emoji);
      }

      celebrationTimeout = setTimeout(() => celebrationElement.replaceChildren(), 2300);
    }

    function showReaction(emoji) {
      reactionDisplay.textContent = `${emoji} Reaction sent!`;
    }

    function isRobotMode() {
      return document.querySelector('input[name="mode"]:checked').value === "robot";
    }

    function wouldWin(column, player) {
      const row = getOpenRow(column);
      if (row === -1) {
        return false;
      }

      board[row][column] = player;
      const wins = hasWon(row, column, player);
      board[row][column] = null;
      return wins;
    }

    function chooseRobotColumn() {
      const openColumns = Array.from({ length: columns }, (_, column) => column)
        .filter((column) => getOpenRow(column) !== -1);
      const winningColumn = openColumns.find((column) => wouldWin(column, "yellow"));
      if (winningColumn !== undefined) {
        return winningColumn;
      }

      const blockingColumn = openColumns.find((column) => wouldWin(column, "red"));
      if (blockingColumn !== undefined) {
        return blockingColumn;
      }

      const preferredColumns = [3, 2, 4, 1, 5, 0, 6];
      return preferredColumns.find((column) => openColumns.includes(column));
    }

    restartButton.addEventListener("click", createBoard);
    for (const modeInput of modeInputs) {
      modeInput.addEventListener("change", createBoard);
    }
    for (const reactionButton of reactionButtons) {
      reactionButton.addEventListener("click", () => showReaction(reactionButton.dataset.emoji));
    }
    updateRobotRecord();
    createBoard();
  </script>
</body>
</html>

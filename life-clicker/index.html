bodyEl.innerHTML=svg+"</svg>";
PARTS.forEach(p=>{const r=document.createElement("div");r.className="part";r.innerHTML=`<div class="e">${p.e}</div><div><strong>${p.n}</strong> <span id="l_${p.id}"></span><small class="nx" id="n_${p.id}"></small><small id="d_${p.id}"></small><div class="bar"><i id="r_${p.id}"></i></div></div><button id="u_${p.id}"></button>`;listEl.appendChild(r);
 $("u_"+p.id).onclick=()=>{const c=cost(p);if(lv[p.id]>=p.st.length||cells<c||locked(p))return;cells-=c;gm[p.id+lv[p.id]]=0;const pe=$("p_"+p.id+(p.org?0:lv[p.id]));lv[p.id]++;render();if(pe){pe.classList.remove("new");void pe.getBoundingClientRect();pe.classList.add("new")}save()}});
function pop(e,t){const d=document.createElement("div");d.className="pop";d.textContent=t;d.style.left=e.clientX-10+"px";d.style.top=e.clientY-20+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function spark(e){const cl=["#f472b6","#fde047","#60a5fa","#4ade80"];for(let i=0;i<8;i++){const d=document.createElement("div"),a=Math.random()*6.283,r=30+Math.random()*40;d.className="spark";d.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;background:${cl[i%4]};--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),700)}}function growAll(a){PARTS.forEach(p=>{for(let i=0;i<lv[p.id];i++){const k=p.id+i;gm[k]=Math.min(1,(gm[k]||0)+a)}})}
bodyEl.onpointerdown=e=>{e.preventDefault();const g=click();cells+=g;total+=g;growAll(.15);pop(e,"+"+fmt(g));spark(e);bodyEl.classList.add("sq");setTimeout(()=>bodyEl.classList.remove("sq"),80);render()};
function render(){$("cells").textContent=fmt(cells)+" cells";$("rate").textContent=`${fmt(click())} per click · ${fmt(cps())} per second`;
 let grown=0,full=0;
 PARTS.forEach(p=>{const n=p.st.length,l=lv[p.id];grown+=l;
  p.st.forEach((_,i)=>{const k=p.id+i,g=gm[k]||0;if(i<l&&g>=1)full++;if(p.org&&i)return;const el=$("p_"+k);
   const on=i<l;el.style.opacity=on?.25+.75*g:0;
   const sc=p.org?(.4+.6*l/n)*(.55+.45*g):.4+.6*g;el.style.transform=on?`scale(${sc})`:"scale(.3)"});
  const nxt=p.st[l];$("l_"+p.id).textContent=`(${l}/${n})`;$("n_"+p.id).textContent=nxt?"Next: "+nxt:"Fully grown!";
  const dc=eff(p,"clk"),ds=eff(p,"cps");$("d_"+p.id).textContent=[dc?`+${fmt(dc)}/click`:"",ds?`+${fmt(ds)}/sec`:""].filter(Boolean).join(" · ")+" per piece";
  $("r_"+p.id).style.width=l/n*100+"%";const u=$("u_"+p.id);const lk=locked(p);u.textContent=!nxt?"Done":lk?"🔒 Finish the rest first":`Grow ${nxt} · ${fmt(cost(p))}`;u.disabled=!nxt||lk||cells<cost(p)});
 $("stage").classList.toggle("done",full>=TOTAL);$("stage").textContent=STAGES[Math.min(STAGES.length-1,Math.floor(full/TOTAL*(STAGES.length-1)+(grown>0?.5:0)))]+` · ${grown}/${TOTAL} parts started · ${full} fully grown`}
function save(){try{localStorage.setItem("lifeClicker",JSON.stringify({cells,total,lv,gm}))}catch(e){}}
setInterval(()=>{const g=cps()/10;if(g){cells+=g;total+=g}growAll(.01);render()},100);setInterval(save,5000);
$("reset").onclick=()=>{if(confirm("Start over from a single cell?")){cells=0;total=0;PARTS.forEach(p=>{lv[p.id]=0;p.st.forEach((_,i)=>gm[p.id+i]=0)});save();render()}};
render();
</script></body></html>

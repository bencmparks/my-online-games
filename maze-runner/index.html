<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze Runner | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 50% 0,#4c1d95,#0b1020 70%)}
main{width:min(100%,38rem);padding:1.25rem;border:.2rem solid #a78bfa;border-radius:1.25rem;background:rgb(8 12 30 / 94%);text-align:center}a{color:#7dd3fc}h1{margin:.5rem 0;color:#c4b5fd;font-size:1.6rem}
canvas{display:block;width:100%;max-width:34rem;height:auto;margin:.8rem auto;border:.2rem solid #475569;border-radius:.4rem;background:#0f172a;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,4rem);gap:.4rem;justify-content:center;margin:.5rem auto}.pad button{height:3.2rem;font-size:1.4rem;border:0;border-radius:.6rem;background:#7c3aed;color:#fff}
.row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}.row button{padding:.5rem 1rem;border:0;border-radius:.6rem;background:#fbbf24;font-weight:700;cursor:pointer}
</style></head>
<body><main><a href="../">← All games</a><h1>🧭 Maze Runner</h1>
<p>Find the 🔑 key, then reach the 🚪 exit before time runs out. Mazes grow bigger each level and later levels have fog — you only see nearby!</p>
<p><strong>Arrows / WASD</strong> move · <strong>H</strong> hint (costs 10 seconds) · <strong>R</strong> new maze · <strong>Space</strong> start / continue</p>
<canvas id="c" width="600" height="600" aria-label="Maze Runner game"></canvas>
<div class="pad"><span></span><button data-d="0">▲</button><span></span><button data-d="3">◀</button><button data-d="2">▼</button><button data-d="1">▶</button></div>
<div class="row"><button id="hint">💡 Hint (−10s)</button><button id="go">▶ Start / Next</button></div>
</main>
<script>
const C=document.querySelector("#c"),x=C.getContext("2d"),S=600,KEY="mazeRunnerBest";
const DX=[0,1,0,-1],DY=[-1,0,1,0];
let N,cell,walls,px,py,kx,ky,ex,ey,hasKey,level=1,mode="title",time,fog,hintPath=null,hintT=0,score=0,best=0,hold=-1,holdT=0,last=performance.now();
try{best=+localStorage.getItem(KEY)||0}catch(e){}
function gen(){
 N=Math.min(26,7+level*2);cell=S/N;
 walls=Array.from({length:N*N},()=>15);
 const seen=new Uint8Array(N*N),st=[0];seen[0]=1;
 while(st.length){
  const c=st[st.length-1],cx=c%N,cy=(c/N)|0,opts=[];
  for(let d=0;d<4;d+=1){const nx=cx+DX[d],ny=cy+DY[d];if(nx>=0&&ny>=0&&nx<N&&ny<N&&!seen[ny*N+nx])opts.push(d)}
  if(!opts.length){st.pop();continue}
  const d=opts[Math.floor(Math.random()*opts.length)],n=(cy+DY[d])*N+cx+DX[d];
  walls[c]&=~(1<<d);walls[n]&=~(1<<((d+2)%4));seen[n]=1;st.push(n)}
 for(let k=0;k<N*2;k+=1){const cx=Math.floor(Math.random()*(N-1)),cy=Math.floor(Math.random()*(N-1)),d=Math.random()<.5?1:2;walls[cy*N+cx]&=~(1<<d);walls[(cy+DY[d])*N+cx+DX[d]]&=~(1<<((d+2)%4))}
 px=0;py=0;ex=N-1;ey=N-1;
 const far=dist(0,0);let bi=0,bd=-1;
 for(let i=0;i<N*N;i+=1)if(far[i]>bd&&i!==N*N-1){const e=Math.abs((i%N)-ex)+Math.abs(((i/N)|0)-ey);if(e>N/2){bd=far[i];bi=i}}
 kx=bi%N;ky=(bi/N)|0;hasKey=false;hintPath=null;
 time=Math.round(N*N*.55+30);fog=level>=4?Math.max(2.5,6-(level-4)*.4):0}
function dist(sx,sy){
 const d=new Array(N*N).fill(-1),q=[sy*N+sx];d[q[0]]=0;
 for(let h=0;h<q.length;h+=1){const c=q[h],cx=c%N,cy=(c/N)|0;
  for(let k=0;k<4;k+=1)if(!(walls[c]&(1<<k))){const n=(cy+DY[k])*N+cx+DX[k];if(d[n]<0){d[n]=d[c]+1;q.push(n)}}}
 return d}
function path(fx,fy,tx,ty){
 const prev=new Array(N*N).fill(-1),q=[fy*N+fx];prev[q[0]]=q[0];
 for(let h=0;h<q.length;h+=1){const c=q[h],cx=c%N,cy=(c/N)|0;
  for(let k=0;k<4;k+=1)if(!(walls[c]&(1<<k))){const n=(cy+DY[k])*N+cx+DX[k];if(prev[n]<0){prev[n]=c;q.push(n)}}}
 const r=[];let c=ty*N+tx;while(c!==fy*N+fx){r.push(c);c=prev[c]}r.push(c);return r}
function move(d){
 if(mode!=="play")return;
 if(walls[py*N+px]&(1<<d))return;
 px+=DX[d];py+=DY[d];
 if(!hasKey&&px===kx&&py===ky){hasKey=true;hintPath=null}
 if(hasKey&&px===ex&&py===ey)win()}
function win(){score+=Math.round(time*10+level*100);mode="win";if(level>best){best=level;try{localStorage.setItem(KEY,best)}catch(e){}}}
function startGame(){level=1;score=0;gen();mode="play"}
function act(){
 if(mode==="title"||mode==="over")startGame();
 else if(mode==="win"){level+=1;gen();mode="play"}}
function hint(){
 if(mode!=="play"||time<=10)return;
 time-=10;hintPath=path(px,py,hasKey?ex:kx,hasKey?ey:ky);hintT=240}
const KM={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener("keydown",e=>{
 if(e.code in KM){e.preventDefault();if(hold!==KM[e.code]){hold=KM[e.code];holdT=0;move(hold)}return}
 if(e.code==="Space"||e.code==="Enter"){e.preventDefault();act()}
 if(e.code==="KeyH")hint();
 if(e.code==="KeyR"&&mode==="play")gen()});
addEventListener("keyup",e=>{if(e.code in KM&&hold===KM[e.code])hold=-1});
document.querySelectorAll(".pad button").forEach(b=>{
 const d=+b.dataset.d;
 b.addEventListener("pointerdown",e=>{e.preventDefault();hold=d;holdT=0;move(d)});
 for(const ev of["pointerup","pointerleave","pointercancel"])b.addEventListener(ev,()=>{if(hold===d)hold=-1})});
document.querySelector("#hint").onclick=hint;document.querySelector("#go").onclick=act;
let sx=0,sy=0;
C.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;if(mode!=="play")act()});
C.addEventListener("pointerup",e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))});
function text(s,a,b,size,color,al="center"){x.font=`bold ${size}px Arial`;x.textAlign=al;x.fillStyle=color;x.lineWidth=4;x.strokeStyle="#0f172a";x.strokeText(s,a,b);x.fillText(s,a,b)}
function draw(){
 x.fillStyle="#0f172a";x.fillRect(0,0,S,S);
 if(mode==="title"){text("MAZE RUNNER",S/2,230,56,"#c4b5fd");text("Find the key, reach the exit!",S/2,290,24,"#fff");text(`Best level: ${best}`,S/2,335,20,"#fde047");text("Press Space or tap to start",S/2,400,22,"#fff");return}
 x.fillStyle="#1e293b";x.fillRect(0,0,S,S);
 x.strokeStyle="#a78bfa";x.lineWidth=Math.max(2,cell/10);x.lineCap="round";x.beginPath();
 for(let i=0;i<N*N;i+=1){const cx=(i%N)*cell,cy=((i/N)|0)*cell,w=walls[i];
  if(w&1){x.moveTo(cx,cy);x.lineTo(cx+cell,cy)}
  if(w&2){x.moveTo(cx+cell,cy);x.lineTo(cx+cell,cy+cell)}
  if(w&4){x.moveTo(cx,cy+cell);x.lineTo(cx+cell,cy+cell)}
  if(w&8){x.moveTo(cx,cy);x.lineTo(cx,cy+cell)}}
 x.stroke();
 const fs=Math.max(12,cell*.7);x.textAlign="center";x.textBaseline="middle";x.font=`${fs}px Arial`;
 if(!hasKey)x.fillText("🔑",(kx+.5)*cell,(ky+.5)*cell);
 x.globalAlpha=hasKey?1:.45;x.fillText("🚪",(ex+.5)*cell,(ey+.5)*cell);x.globalAlpha=1;
 if(hintPath&&hintT>0){x.strokeStyle="#4ade80";x.lineWidth=Math.max(3,cell/6);x.beginPath();hintPath.forEach((c,k)=>{const a=((c%N)+.5)*cell,b=(((c/N)|0)+.5)*cell;k?x.lineTo(a,b):x.moveTo(a,b)});x.stroke()}
 x.fillStyle="#38bdf8";x.beginPath();x.arc((px+.5)*cell,(py+.5)*cell,cell*.3,0,6.3);x.fill();x.strokeStyle="#fff";x.lineWidth=2;x.stroke();
 x.textBaseline="alphabetic";
 if(fog){const cx=(px+.5)*cell,cy=(py+.5)*cell,g=x.createRadialGradient(cx,cy,cell*fog*.5,cx,cy,cell*fog);g.addColorStop(0,"rgba(2,6,23,0)");g.addColorStop(1,"rgba(2,6,23,.97)");x.fillStyle=g;x.fillRect(0,0,S,S)}
 text(`Level ${level}`,10,24,20,"#fff","left");text(`⏱ ${Math.ceil(time)}`,S/2,24,22,time<15?"#f87171":"#fde047");text(hasKey?"Got the key! Find the exit":"Find the key",S-10,24,16,"#a7f3d0","right");
 text(`Score ${score}`,10,S-10,16,"#fde047","left");
 if(mode==="win"){x.fillStyle="rgba(2,6,23,.7)";x.fillRect(0,0,S,S);text("Maze Complete!",S/2,250,48,"#4ade80");text(`Score ${score}`,S/2,300,26,"#fde047");text("Press Space for the next maze",S/2,350,22,"#fff")}
 if(mode==="over"){x.fillStyle="rgba(2,6,23,.75)";x.fillRect(0,0,S,S);text("Time's up!",S/2,250,50,"#f87171");text(`Reached level ${level} · Score ${score}`,S/2,300,24,"#fde047");text("Press Space to try again",S/2,350,22,"#fff")}}
function loop(ts){
 const dt=Math.min(.1,(ts-last)/1000);last=ts;
 if(mode==="play"){time-=dt;if(time<=0){time=0;mode="over"}
  if(hold>=0){holdT+=dt;if(holdT>.14){holdT=0;move(hold)}}
  if(hintT>0){hintT-=1;if(!hintT)hintPath=null}}
 draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Echo | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#1e1b4b;color:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(145deg,#1e1b4b,#312e81)}
main{width:min(100%,32rem);text-align:center;padding:1.5rem;border:1px solid #a5b4fc;border-radius:1rem;background:#312e81}a{color:#c7d2fe}h1{margin:.4rem 0;color:#fef08a}
.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin:1rem auto;max-width:22rem}.pad{aspect-ratio:1;border:0;border-radius:1rem;cursor:pointer;opacity:.55;transition:opacity .1s,transform .1s}
.pad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 1.5rem currentColor}.pad:focus-visible{outline:3px solid #fff}
#p0{background:#ef4444;color:#ef4444}#p1{background:#3b82f6;color:#3b82f6}#p2{background:#22c55e;color:#22c55e}#p3{background:#eab308;color:#eab308}
button.start{min-height:3rem;padding:0 1.5rem;border:0;border-radius:.6rem;background:#fef08a;color:#312e81;font:inherit;font-weight:bold;cursor:pointer}#status{min-height:1.5rem;color:#fef08a;font-weight:bold}
</style></head>
<body><main><a href="../">← All games</a><h1>🎵 Color Echo</h1><p>Watch the pattern, then repeat it. It gets one step longer every round. Keys Q, W, A, S also work.</p>
<p>Round: <strong id="round">0</strong> · Best: <strong id="best">0</strong></p>
<div class="pads"><button class="pad" id="p0" aria-label="Red"></button><button class="pad" id="p1" aria-label="Blue"></button><button class="pad" id="p2" aria-label="Green"></button><button class="pad" id="p3" aria-label="Yellow"></button></div>
<button class="start" id="start" type="button">Start game</button><p id="status" aria-live="polite">Press Start to begin.</p></main>
<script>
const pads=[...document.querySelectorAll(".pad")],roundEl=document.querySelector("#round"),bestEl=document.querySelector("#best"),statusEl=document.querySelector("#status"),startButton=document.querySelector("#start");
const tones=[261.6,329.6,392,523.3];let seq=[],pos=0,accepting=false,best=Number(localStorage.getItem("colorEchoBest"))||0,audio;bestEl.textContent=best;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function beep(i){try{audio=audio||new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=tones[i];g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.25)}catch{}}
async function flash(i,ms=380){pads[i].classList.add("lit");beep(i);await wait(ms);pads[i].classList.remove("lit");await wait(130)}
async function play(){accepting=false;pos=0;seq.push(Math.floor(Math.random()*4));roundEl.textContent=seq.length;statusEl.textContent="Watch...";await wait(600);const speed=Math.max(170,380-seq.length*12);for(const i of seq)await flash(i,speed);statusEl.textContent="Your turn!";accepting=true}
function press(i){if(!accepting)return;flash(i,200);if(i!==seq[pos]){accepting=false;const score=seq.length-1;if(score>best){best=score;localStorage.setItem("colorEchoBest",best);bestEl.textContent=best;statusEl.textContent=`Wrong! New best: ${score} rounds.`}else statusEl.textContent=`Wrong! You cleared ${score} rounds.`;startButton.disabled=false;return}
pos++;if(pos===seq.length){accepting=false;statusEl.textContent="Nice!";setTimeout(play,700)}}
pads.forEach((p,i)=>p.addEventListener("click",()=>press(i)));
document.addEventListener("keydown",e=>{const i="qwas".indexOf(e.key.toLowerCase());if(i>=0)press(i)});
startButton.addEventListener("click",()=>{seq=[];startButton.disabled=true;play()});
</script></body></html>

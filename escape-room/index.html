<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escape Room</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#12100c;color:#f3e9d2;font-family:"Courier New",monospace;text-align:center;user-select:none}
a{color:#9fe870}
#top{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:6px auto;padding:0 8px;font-size:14px}
button{font-family:inherit;cursor:pointer}
.btn{background:#3b2f1c;color:#f3e9d2;border:2px solid #8a6d3b;padding:6px 12px;border-radius:4px}
.btn:hover{background:#54421f}
#room{position:relative;width:100%;max-width:820px;aspect-ratio:16/9;margin:0 auto;border:4px solid #000;overflow:hidden;image-rendering:pixelated}
#room .floor{position:absolute;left:0;right:0;bottom:0;height:34%}
.hs{position:absolute;transform:translate(-50%,-50%);font-size:clamp(26px,6.5vw,54px);background:none;border:none;padding:4px;line-height:1;filter:drop-shadow(0 3px 0 #0006);transition:transform .1s}
.hs:hover{transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 0 8px #ffe08a)}
.hs.big{font-size:clamp(40px,10vw,84px)}
#roomname{position:absolute;left:8px;top:6px;font-size:13px;background:#0008;padding:2px 8px;border-radius:3px}
#msg{max-width:820px;min-height:46px;margin:8px auto;padding:8px 12px;background:#241c10;border:2px solid #8a6d3b;border-radius:4px;font-size:15px;text-align:left}
#inv{max-width:820px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;min-height:56px;padding:4px;background:#1c160c;border:2px solid #5b4725;border-radius:4px;align-items:center}
.it{font-size:30px;background:#2f2515;border:2px solid #5b4725;border-radius:4px;padding:2px 8px}
.it.sel{border-color:#ffe08a;background:#5b4725}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}
#modal .box{background:#2a2112;border:3px solid #8a6d3b;padding:18px 22px;border-radius:6px;max-width:92vw}
#modal input{font:inherit;font-size:28px;width:5.5em;text-align:center;letter-spacing:6px;background:#0d0a05;color:#ffe08a;border:2px solid #8a6d3b;padding:6px;text-transform:uppercase}
</style></head><body>
<div id="top"><a href="../">&larr; Games</a><span id="timer">0:00</span><span><button class="btn" id="hint">💡 Hint</button> <button class="btn" id="books">📚</button> <button class="btn" id="restart">↺</button></span></div>
<div id="room"><div class="floor"></div><div id="roomname"></div></div>
<div id="msg"></div>
<div id="inv"></div>
<p style="font-size:13px;opacity:.7">Click things to examine them. Click an item in your bag to select it, then click something to use it.</p>
<div id="modal"><div class="box" id="mbox"></div></div>
<script>
const $=id=>document.getElementById(id);
let S,timerT,t0,sel=null,potSeq=[];
const ITEMS={
 brass:{e:'🔑',n:'Brass key',d:'A small brass key. It looks like it fits a drawer.'},
 note:{e:'📜',n:'Note',d:'"It never ends and never repeats. Four digits is all the safe needs: the start of the circle number — 3 . 1 4 1 ..."'},
 silver:{e:'🗝️',n:'Silver key',d:'A heavy silver key with a gear symbol. For a door.'},
 cog:{e:'⚙️',n:'Cog',d:'A big brass cog from the safe. It must belong to a machine.'},
 fuse:{e:'🔋',n:'Fuse',d:'A glowing fuse cell.'},
 gold:{e:'🔱',n:'Gold key',d:'A gold key. Surely for the last doors.'},
 p1:{e:'🧾',n:'Page 1',d:'A torn page: "M _ _ _"'},
 p2:{e:'📄',n:'Page 2',d:'A torn page: "_ O _ _"'},
 p3:{e:'📃',n:'Page 3',d:'A torn page: "_ _ O N"'},
 exit:{e:'🔓',n:'Exit key',d:'The way out!'},
};
function fresh(){return{room:0,f:{},inv:[],hints:0,pen:0,book:0}}
function say(t){$('msg').textContent=t}
function has(i){return S.inv.includes(i)}
function give(i){if(!has(i))S.inv.push(i);renderInv()}
function take(i){S.inv=S.inv.filter(x=>x!==i);if(sel===i)sel=null;renderInv()}
function renderInv(){
  $('inv').innerHTML=S.inv.length?'':'<span style="opacity:.5;padding:6px">Your bag is empty</span>';
  S.inv.forEach(i=>{const b=document.createElement('button');b.className='it'+(sel===i?' sel':'');b.textContent=ITEMS[i].e;b.title=ITEMS[i].n;
    b.onclick=()=>{sel=sel===i?null:i;say(ITEMS[i].n+': '+ITEMS[i].d+(sel?'  (selected)':''));renderInv()};$('inv').appendChild(b)})
}
function modal(html){$('mbox').innerHTML=html;$('modal').style.display='flex'}
function close(){$('modal').style.display='none'}
function codeLock(title,len,answer,ok,hint){
  modal(`<h3 style="margin-top:0">${title}</h3><input id="ci" maxlength="${len}" autocomplete="off"><p style="font-size:13px;opacity:.7">${hint||''}</p><button class="btn" id="cok">Try</button> <button class="btn" id="cno">Close</button>`);
  const i=$('ci');i.focus();
  const go=()=>{if(i.value.toUpperCase()===answer){close();ok()}else{i.value='';S.pen+=20;say('Wrong code. Nothing happens. (+20s penalty)');i.style.borderColor='#e33'}};
  $('cok').onclick=go;$('cno').onclick=close;i.onkeydown=e=>{if(e.key=='Enter')go()}
}
const ROOMS=[

  {x:50,y:24,e:'🔐',l:'Safe',big:1,v:()=>S.f.painting&&!S.f.safe,c(){codeLock('Wall safe',4,'3141',()=>{S.f.safe=1;give('silver');give('cog');say('Click! Inside: a silver key and a big cog.');draw()},'4 digits')}},
  {x:15,y:60,e:'🗄️',l:'Desk',c(){if(S.f.drawer)return say('The drawer is empty now.');if(sel==='brass'){S.f.drawer=1;take('brass');give('note');say('The brass key opens the drawer. Inside is a note — check your bag!')}else say('A locked drawer. It needs a small key.')}},
  {x:40,y:82,e:'🟫',l:'Rug',v:()=>true,c(){if(S.f.rug)return say('Just a rug.');S.f.rug=1;give('brass');say('You lift the rug and find a small brass key!')}},
  {x:82,y:35,e:'📚',l:'Bookshelf',c(){say('Titles: "Gears & Time", "The Number Pi: Circles Forever (3.14159…)", "How to Hide Keys". Interesting.')}},
  {x:27,y:28,e:'🕰️',l:'Clock',c(){say('The big clock is stopped at 3:14. Strange.')}},
  {x:92,y:58,e:'🚪',l:'Door',c(){if(S.f.door1)return go(1);if(sel==='silver'){S.f.door1=1;take('silver');say('The silver key turns. The door opens!');go(1)}else say('The door is locked with a silver lock.')}},
 ]},
 {name:'The Laboratory',bg:'linear-gradient(#2f4a52,#18262b)',floor:'#33454a',hs:[
  {x:6,y:58,e:'⬅️',l:'Back',c(){go(0)}},
  {x:20,y:25,e:'📋',l:'Corkboard',c(){say('Pinned note: "Mixing order for the safe cabinet — BLUE, then GREEN, then RED. Never the other way."')}},
  {x:40,y:28,e:'🔵',l:'Blue potion',v:()=>!S.f.cab,c(){pot('b')}},
  {x:48,y:28,e:'🟢',l:'Green potion',v:()=>!S.f.cab,c(){pot('g')}},
  {x:56,y:28,e:'🔴',l:'Red potion',v:()=>!S.f.cab,c(){pot('r')}},
  {x:48,y:28,e:'🧪',l:'Empty rack',v:()=>false,c(){}},
  {x:25,y:68,e:'🔬',l:'Microscope',c(){if(S.f.p1)return say('Just a microscope.');S.f.p1=1;give('p1');say('A torn page is stuck under the microscope!')}},
  {x:70,y:55,e:'🏭',l:'Machine',big:1,c(){
    if(S.f.mach)return say('The machine hums quietly. It is empty now.');
    if(sel==='cog'){S.f.mcog=1;take('cog');say('The cog slots into place.')}

    if(S.f.mcog&&S.f.mfuse&&!S.f.mach){S.f.mach=1;give('gold');say('The machine whirs and a hatch opens: a gold key!')}}},
  {x:92,y:58,e:'🚪',l:'Door',c(){if(S.f.door2)return go(2);if(sel==='gold'){S.f.door2=1;take('gold');say('The gold key fits! The door opens.');go(2)}else say('A heavy door with a golden lock.')}},
 ]},

  {x:6,y:58,e:'⬅️',l:'Back',c(){go(1)}},
  {x:25,y:38,e:'💡',l:'Lamp',c(){if(S.f.p2)return say('A lamp, still glowing.');S.f.p2=1;give('p2');say('Under the lamp base: a torn page!')}},
  {x:60,y:32,e:'🏺',l:'Vase',c(){if(S.f.p3)return say('An empty vase.');S.f.p3=1;give('p3');say('Inside the vase: a torn page!')}},
  {x:40,y:25,e:'🪞',l:'Mirror',c(){say('You see your tired face. Scratched in the frame: "Three pages. Four letters. Something bright in the night."')}},
  {x:75,y:62,e:'📦',l:'Chest',big:1,v:()=>!S.f.chest,c(){codeLock('Word chest',4,'MOON',()=>{S.f.chest=1;give('exit');say('The chest opens: the exit key!');draw()},'A 4-letter word. Combine your torn pages.')}},
  {x:92,y:58,e:'🚪',l:'Exit',c(){if(S.f.door3)return go(3);if(sel==='exit'){S.f.door3=1;take('exit');say('The exit key turns! But this is not the way out yet… the door leads deeper.');go(3)}else say('A door onward. It needs a key.')}},
 ]},
];
const SPECS=[

  lock:{x:70,y:55,e:'🧊',l:'Freezer',title:'Freezer lock',win:'The freezer pops open. A frosty key sits inside!'},hintL:'4 digits',key:'Frosty key',hint:'Look at the pie and the plates. Combine 27 and 48.'},

  btns:[{x:38,y:60,e:'🌷',id:'t',l:'Tulip'},{x:50,y:60,e:'🪻',id:'o',l:'Orchid'},{x:62,y:60,e:'🌹',id:'r',l:'Rose'},{x:74,y:60,e:'🌼',id:'d',l:'Daisy'}],
  win:'The plants bloom and a key unfolds from a flower!',fail:'The plants wilt. Wrong order — try again.',key:'Garden key',hint:'Read the sign for the watering order.'},

  from:{x:25,y:55,e:'🧰',l:'Trunk',t:'In the old trunk you find a crowbar!'},
  target:{x:70,y:50,e:'📦',l:'Nailed crate',need:'A crate nailed shut. You need something to pry it open.',win:'CRACK! The lid pops off. A key is inside!'},
  clues:[{x:50,y:30,e:'🧸',l:'Teddy',t:'A dusty teddy bear. It has no secrets.'}],key:'Attic key',hint:'Open the trunk, then use what you find on the crate.'},

  lock:{x:70,y:58,e:'🌌',l:'Star dial',title:'Star dial',win:'The dial clicks and a key drops from the ceiling!'},hintL:'A 4-letter word',key:'Star key',hint:'Combine S _ A _ and _ T _ R into one word.'},

  lock:{x:70,y:52,e:'🔒',l:'Cell lock',title:'Cell lock',win:'The cell lock opens. A key was hanging inside!'},hintL:'3 digits: torches, skulls, chains',key:'Cell key',hint:'Torches, then skulls, then chains: 3 digits.'},
 {name:'The Aquarium',bg:'linear-gradient(#0f5c8a,#08304a)',floor:'#c9b27c',type:'seq',order:'cfto',

  win:'The fish swim happily and a key floats up from the sand!',fail:'The animals ignore the food. Wrong order — try again.',key:'Pearl key',hint:'Follow the feeding chart order.'},

  btns:[{x:38,y:58,e:'🎻',id:'v',l:'Violin'},{x:50,y:58,e:'🎺',id:'t',l:'Trumpet'},{x:62,y:58,e:'🥁',id:'d',l:'Drum'},{x:74,y:58,e:'🔔',id:'b',l:'Bell'}],
  win:'A grand chord rings out and a key drops from the organ!',fail:'A sour note. Wrong order — try again.',key:'Brass key',hint:'Play the instruments in the sheet music order.'},
 {name:'The Wine Cellar',bg:'linear-gradient(#3a2418,#150c07)',floor:'#2e2018',type:'code',answer:'WINE',
  clues:[{x:22,y:40,e:'🍷',l:'Glass',t:'Etched on the glass: "W _ N _"'},{x:48,y:60,e:'🛢️',l:'Barrel',t:'Carved in the barrel: "_ I _ E"'}],
  lock:{x:72,y:50,e:'🗝️',l:'Cellar lock',title:'Cellar lock',win:'The cellar lock opens. A key waits inside!'},hintL:'A 4-letter word',key:'Cellar key',hint:'Combine W _ N _ and _ I _ E.'},
 {name:'The Rooftop',bg:'linear-gradient(#1b2a5c,#0b1230)',floor:'#444',type:'code',answer:'1969',
  clues:[{x:20,y:30,e:'🌕',l:'Plaque',t:'A plaque: "First footsteps on the Moon — the year 19…"'},{x:45,y:55,e:'🧑‍🚀',l:'Statue',t:'The statue\'s base reads: "…69."'}],
  lock:{x:70,y:55,e:'🛸',l:'Hatch panel',title:'Hatch panel',win:'The panel opens. The final key!'},hintL:'A year: 4 digits',key:'Final key',hint:'The plaque starts the year, the statue ends it.'},

SPECS.forEach((s,k)=>{
  const i=3+k,last=i===3+SPECS.length-1,key='key'+i;
  ITEMS[key]={e:'🔑',n:s.key,d:'A key. It must open the door in this room.'};
  if(s.tool)ITEMS['tool'+i]={e:s.tool.e,n:s.tool.n,d:s.tool.d};
  const hs=[{x:6,y:58,e:'⬅️',l:'Back',c(){go(i-1)}}];
  s.clues.forEach(c=>hs.push({x:c.x,y:c.y,e:c.e,l:c.l,c(){say(c.t)}}));
  if(s.type==='code')hs.push({x:s.lock.x,y:s.lock.y,e:s.lock.e,l:s.lock.l,big:1,v:()=>!S.f['u'+i],c(){codeLock(s.lock.title,s.answer.length,s.answer,()=>{S.f['u'+i]=1;give(key);say(s.lock.win);draw()},s.hintL)}});
  if(s.type==='seq')s.btns.forEach(b=>hs.push({x:b.x,y:b.y,e:b.e,l:b.l,v:()=>!S.f['u'+i],c(){
    potSeq.push(b.id);if(potSeq.length<s.order.length)return say('You choose the '+b.l+'…');
    const ok=potSeq.join('')===s.order;potSeq=[];
    if(ok){S.f['u'+i]=1;give(key);say(s.win);draw()}else say(s.fail)}}));
  if(s.type==='tool'){
    hs.push({x:s.from.x,y:s.from.y,e:s.from.e,l:s.from.l,c(){if(S.f['t'+i])return say('Nothing else here.');S.f['t'+i]=1;give('tool'+i);say(s.from.t)}});
    hs.push({x:s.target.x,y:s.target.y,e:s.target.e,l:s.target.l,big:1,v:()=>!S.f['u'+i],c(){if(sel==='tool'+i){take('tool'+i);S.f['u'+i]=1;give(key);say(s.target.win);draw()}else say(s.target.need)}});
  }
  hs.push({x:92,y:58,e:'🚪',l:'Door',c(){
    const nx=()=>last?win():go(i+1);
    if(S.f['d'+i])return nx();
    if(sel===key){S.f['d'+i]=1;take(key);say('The key turns!');nx()}else say('The door is locked. Find the key.')}});

function pot(c){potSeq.push(c);const s=potSeq.join('');
  if(s.length<3)return say('You pour the '+{b:'blue',g:'green',r:'red'}[c]+' potion into the beaker…');
  if(s==='bgr'){S.f.cab=1;give('fuse');say('The mixture glows. A hidden panel slides open: a fuse!');draw()}
  else say('The beaker fizzes and goes dark. Wrong order — it resets.');
  potSeq=[]}
let CUR=ROOMS;
function go(r){S.room=r;potSeq=[];say('You enter: '+CUR[r].name);draw()}
function draw(){
  const R=CUR[S.room],rm=$('room');
  rm.querySelectorAll('.hs').forEach(n=>n.remove());
  rm.style.background=R.bg;rm.querySelector('.floor').style.background=R.floor;$('roomname').textContent=R.name;
  R.hs.forEach(h=>{if(h.v&&!h.v())return;const b=document.createElement('button');b.className='hs'+(h.big?' big':'');b.textContent=h.e;b.title=h.l;
    b.style.left=h.x+'%';b.style.top=h.y+'%';b.onclick=h.c;rm.appendChild(b)});
  renderInv();
}
function hintText(){
  const f=S.f;
  if(S.book>0){const i=S.room;return f['u'+i]?'Select the key and use it on the door.':CUR[i].hint}
  if(S.room==0){
    if(!f.rug)return'Something is hiding under the rug.';
    if(!f.drawer)return'The brass key opens the desk. Select it, then click the desk.';
    if(!f.painting)return'Look behind the painting.';
    if(!f.safe)return'The note and the bookshelf both mention pi: 3 . 1 4 1';
    return'Select the silver key and use it on the door.'}
  if(S.room==1){
    if(!f.cab)return'Read the corkboard: Blue, Green, Red.';
    if(!f.p1)return'Check the microscope.';
    if(!f.mach)return'The machine needs the cog and the fuse. Select each, then click the machine.';
    return'Use the gold key on the door.'}
  if(S.room>2){const R=ROOMS[S.room],i=S.room;return f['u'+i]?'Select the key and use it on the door.':R.hint}
  if(!f.p2||!f.p3||!f.p1)return'Three torn pages: microscope, lamp, vase.';
  if(!f.chest)return'Put the pages together: M _ _ _ / _ O _ _ / _ _ O N. The word is MOON.';
  return'Select the exit key and use it on the exit door.'}

const THEMES=[
 {n:'Pirate Ship',e:'🏴‍☠️',bg:['#14425c','#082030'],fl:'#6b4a2a',word:'SAIL',key:'Pirate key',o:[['⚓','Anchor'],['🦜','Parrot'],['🗺️','Map'],['🪙','Coin'],['🧭','Compass'],['🍾','Bottle'],['💣','Cannonball'],['🦀','Crab']]},

 {n:'Space Station',e:'🚀',bg:['#0b1030','#02030a'],fl:'#2c3550',word:'MARS',key:'Airlock key',o:[['🚀','Rocket'],['🛰️','Satellite'],['👽','Alien'],['🪐','Planet'],['🔭','Telescope'],['☄️','Comet'],['🧑‍🚀','Astronaut'],['🔋','Battery']]},

function mkrng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const SLOTS=[[20,30],[42,24],[60,30],[22,68],[42,72],[58,66]];
const HINTS={sum:'Count three objects, then follow the faded note. Ignore the crossed-out number.',order:'Combine the three "must come before" clues into one order, then press the items in that order.',lights:'Open the light panel. A press flips that light and its 4 neighbours. Work from the top row down.',cipher:'Shift every letter of the scrap BACK by the number in the note.',lens:'One object hides a magnifier. Select it, then use it on the object with tiny writing.'};
THEMES.forEach((T,bi)=>{
  const B=bi+1,rnd=mkrng(B*977+5),list=[],types=['sum','order','lights','cipher','lens','sum'];
  types.forEach((ty,ri)=>{
    const id='k'+B+'_'+ri,last=ri===types.length-1,u='u'+ri;
    ITEMS[id]={e:'🔑',n:T.key+' '+(ri+1),d:'A key. It should open the door in this room.'};
    const O=T.o.map((_,k)=>T.o[(k+ri*2)%T.o.length]);
    const hs=[{x:6,y:58,e:'⬅️',l:'Back',c(){ri===0?say('The way back is sealed.'):go(ri-1)}}];
    const obj=(k,fn)=>{const [e,l]=O[k];hs.push({x:SLOTS[k%6][0],y:SLOTS[k%6][1],e,l,c(){fn(l)}})};
    const main=(e,l,c)=>hs.push({x:74,y:50,e,l,big:1,v:()=>!S.f[u],c});
    const solve=m=>{S.f[u]=1;give(id);say(m);draw()};
    const pick=n=>2+Math.floor(rnd()*n);
    if(ty==='sum'){
      let a,b;do{a=pick(8);b=pick(8)}while(a*b<10);const c=pick(8),d=pick(8),ans=String(a*b)+c,n=O.map(x=>x[1]);
      obj(0,l=>say(`Counting every ${l} you can find: ${a}.`));
      obj(1,l=>say(`Counting every ${l} you can find: ${b}.`));
      obj(2,l=>say(`Counting every ${l} you can find: ${c}.`));
      obj(3,()=>say(`A faded note: "Multiply the ${n[0]} count by the ${n[1]} count, then write the ${n[2]} count after it."`));
      obj(4,()=>say(`A crossed-out scribble: "${d}${a}". Probably an old, wrong number.`));
      obj(5,l=>say(`Just a ${l}. Nothing useful.`));
      main('🔢','Number lock',()=>codeLock('Number lock',ans.length,ans,()=>solve('Click! A key drops out.'),'Follow the faded note.'));
    }else if(ty==='order'){
      const perm=[0,1,2,3].sort(()=>rnd()-.5),ids='abcd',order=perm.map(k=>ids[k]).join('');
      for(let j=0;j<3;j++)obj(4+j,()=>say(`A scrawled message: "The ${O[perm[j]][1]} must come before the ${O[perm[j+1]][1]}."`));
      obj(7,()=>say('A note: "Press them from first to last."'));
      [0,1,2,3].sort(()=>rnd()-.5).forEach((k,pos)=>hs.push({x:36+pos*12,y:48,e:O[k][0],l:O[k][1],v:()=>!S.f[u],c(){
        potSeq.push(ids[k]);if(potSeq.length<4)return say('You press the '+O[k][1]+'…');
        const ok=potSeq.join('')===order;potSeq=[];
        if(ok)solve('Everything clicks into place. A key appears!');else{S.pen+=15;say('Nothing happens. Wrong order. (+15s)')}}}));
    }else if(ty==='lights'){
      const key='g'+ri;
      const start=()=>{const g=Array(9).fill(0);let n=0;while(n<5||g.every(x=>!x)){const k=Math.floor(rnd()*9);flip(g,k);n++}return g};
      const flip=(g,k)=>{const r=Math.floor(k/3),c=k%3;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc;if(rr>=0&&rr<3&&cc>=0&&cc<3)g[rr*3+cc]^=1})};
      obj(0,()=>say('A note: "Pressing a light flips it and the lights next to it (up, down, left, right). Turn them all off."'));
      obj(1,l=>say(`Just a ${l}.`));obj(2,l=>say(`Nothing here but a ${l}.`));
      main('💡','Light panel',()=>{
        if(!S.f[key])S.f[key]=start();const g=S.f[key];
        const show=()=>{modal('<div id="lg" style="display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center"></div><p style="font-size:13px">Turn every light OFF.</p><button class="btn" id="cl">Close</button>');
          g.forEach((v,k)=>{const b=document.createElement('button');b.style.cssText='height:64px;font-size:28px;border:2px solid #8a6d3b;border-radius:4px;background:'+(v?'#ffe08a':'#1a1408');b.textContent=v?'💡':'';b.onclick=()=>{flip(g,k);if(g.every(x=>!x)){close();solve('All the lights go dark. A hidden compartment opens: a key!')}else show()};$('lg').appendChild(b)});
          $('cl').onclick=close};show()});
    }else if(ty==='cipher'){
      const s=1+Math.floor(rnd()*4),sh=w=>[...w].map(ch=>String.fromCharCode((ch.charCodeAt(0)-65+s)%26+65)).join('');
      obj(0,()=>say(`A scrap of paper reads: "${sh(T.word)}"`));
      obj(1,()=>say(`A note: "Every letter was moved ${s} place${s>1?'s':''} forward in the alphabet."`));
      obj(2,()=>say(`An old crossed-out scrap: "${sh('ABCD').slice(0,3)}${sh('Z')}". Nonsense.`));
      obj(3,l=>say(`Just a ${l}.`));
      main('🔤','Word lock',()=>codeLock('Word lock',T.word.length,T.word,()=>solve('The lock opens. A key!'),`A ${T.word.length}-letter word.`));
    }else{
      const code=String(1000+Math.floor(rnd()*9000)),fake=String(1000+Math.floor(rnd()*9000)),lens='lens'+B;
      ITEMS[lens]={e:'🔍',n:'Magnifier',d:'A magnifying glass. Handy for tiny writing.'};
      obj(0,l=>{if(S.f['t'+ri])return say(`Nothing else behind the ${l}.`);S.f['t'+ri]=1;give(lens);say(`Behind the ${l} you find a magnifying glass!`)});
      obj(1,l=>{if(sel===lens)say(`Through the lens, tiny writing on the ${l}: "The code is ${code}."`);else say(`There is writing on the ${l}, far too tiny to read.`)});
      obj(2,()=>say(`Scratched in a hurry: "${fake}". It looks fake.`));
      obj(3,l=>say(`Just a ${l}.`));
      main('🔢','Number lock',()=>codeLock('Number lock',4,code,()=>solve('Click! A key drops out.'),'4 digits'));
    }
    hs.push({x:92,y:58,e:'🚪',l:'Door',c(){const nx=()=>last?win():go(ri+1);if(S.f['d'+ri])return nx();if(sel===id){S.f['d'+ri]=1;take(id);say('The key turns!');nx()}else say('The door is locked.')}});
    list.push({name:`${T.n} ${ri+1}/6`,bg:`linear-gradient(${T.bg[0]},${T.bg[1]})`,floor:T.fl,hs,hint:HINTS[ty]});
  });
  BOOKS.push({name:T.n,e:T.e,rooms:list});
});
function elapsed(){return Math.floor((Date.now()-t0)/1000)+S.pen}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function win(){
  clearInterval(timerT);const sec=elapsed(),b=S.book,key='escape-room-bt'+b,old=+(localStorage.getItem(key)||1e9);
  if(sec<old)localStorage.setItem(key,sec);
  if(b+1>+(localStorage.getItem('escape-room-books')||0))localStorage.setItem('escape-room-books',b+1);
  const nxt=b+1<BOOKS.length;
  modal(`<h2 style="margin-top:0">📖 ${BOOKS[b].name} complete!</h2><p>Time: ${fmt(sec)} (with penalties)<br>Hints used: ${S.hints}<br>Best: ${fmt(Math.min(old,sec))}</p>${nxt?'<button class="btn" id="nb">Next book ▶</button> ':''}<button class="btn" id="bl2">Book list</button>`);
  if(nxt)$('nb').onclick=()=>{close();startBook(b+1)};
  $('bl2').onclick=()=>{close();menu()}}
function menu(){
  clearInterval(timerT);const done=+(localStorage.getItem('escape-room-books')||0);
  modal('<h2 style="margin-top:0">📚 Choose a book</h2><div id="bk" style="display:grid;gap:6px;max-height:60vh;overflow:auto"></div>');
  BOOKS.forEach((B,i)=>{const b=document.createElement('button'),open=i<=done,bt=+(localStorage.getItem('escape-room-bt'+i)||0);b.className='btn';
    b.textContent=(open?B.e+' ':'🔒 ')+'Book '+(i+1)+': '+B.name+' ('+B.rooms.length+' rooms)'+(bt?' ✔ '+fmt(bt):'');
    b.disabled=!open;b.style.opacity=open?1:.5;b.onclick=()=>{close();startBook(i)};$('bk').appendChild(b)})}
function startBook(b){S=fresh();S.book=b;CUR=BOOKS[b].rooms;sel=null;potSeq=[];t0=Date.now();clearInterval(timerT);
  timerT=setInterval(()=>{$('timer').textContent=fmt(elapsed())},500);
  say(b==0?"You wake up locked in an old clockmaker's study. Find a way out!":'Book '+(b+1)+': '+BOOKS[b].name+'. Wrong codes and hints cost time. Good luck!');draw()}
$('hint').onclick=()=>{S.hints++;S.pen+=60;say('💡 '+hintText()+'  (+60s)')};
$('books').onclick=()=>{if(confirm('Leave this book and pick another?'))menu()};
$('restart').onclick=()=>{if(confirm('Restart this book?'))startBook(S.book)};
S=fresh();draw();menu();</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giraffe Maze | My Online Games</title><style>
:root{color-scheme:dark;font-family:Arial;background:#78350f;color:#fffbeb}*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;background:radial-gradient(circle at 12% 15%,#fef08a 0 5rem,transparent 5.2rem),linear-gradient(145deg,#78350f,#365314)}main{width:min(100%,42rem);padding:1.5rem;border:2px solid #fde68a;border-radius:1.25rem;background:rgb(69 26 3 / 90%);text-align:center}a{color:#fef3c7}h1{margin:.5rem;color:#fef08a}canvas{display:block;width:100%;height:auto;margin:1rem auto;border:3px solid #fde68a;border-radius:.65rem;background:#d9f99d;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;max-width:14rem;margin:.75rem auto}.controls button:first-child{grid-column:2}button{min-height:2.7rem;border:0;border-radius:.5rem;background:#fef08a;color:#78350f;font:inherit;font-weight:bold;cursor:pointer}#status{min-height:1.5rem;color:#fde68a;font-weight:bold}</style></head>
<body><main><a href="../">← All games</a><h1>🦒 Giraffe Maze</h1><p>Guide the giraffe through 50 hedge mazes. Collect all three leaves before reaching each exit.</p><p>Level: <strong id="level">1</strong>/50 · Leaves: <strong id="leaves">0</strong>/3 · Steps: <strong id="steps">0</strong></p><canvas id="game" width="588" height="420" aria-label="Giraffe Maze game"></canvas><div class="controls" aria-label="Controls"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div><button id="restart">Restart campaign</button><p id="status" aria-live="polite">Find all three leaves, then reach the red gate.</p></main><script>
const c=document.querySelector("#game"),x=c.getContext("2d"),leavesEl=document.querySelector("#leaves"),stepsEl=document.querySelector("#steps"),levelEl=document.querySelector("#level"),status=document.querySelector("#status"),tile=28,width=21,height=15,leafTotal=3;let maze,player,leaves,steps,level,done;
function buildLevel(){maze=Array.from({length:height},()=>Array(width).fill("#"));function carve(cx,cy){maze[cy][cx]=".";[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5).forEach(([dx,dy])=>{let nx=cx+dx,ny=cy+dy;if(nx>0&&nx<width-1&&ny>0&&ny<height-1&&maze[ny][nx]==="#"){maze[cy+dy/2][cx+dx/2]=".";carve(nx,ny)}})}carve(1,1);maze[1][1]="S";maze[height-2][width-2]="E";let placed=0;while(placed<leafTotal){let lx=1+2*Math.floor(Math.random()*10),ly=1+2*Math.floor(Math.random()*7);if(maze[ly][lx]==="."){maze[ly][lx]="L";placed++}}player={x:1,y:1};leaves=0;steps=0;leavesEl.textContent=0;stepsEl.textContent=0;draw()}
function start(){level=1;done=false;levelEl.textContent=level;status.textContent="Find all three leaves, then reach the red gate.";buildLevel()}
function move(direction){if(done)return;let dx=direction==="left"?-1:direction==="right"?1:0,dy=direction==="up"?-1:direction==="down"?1:0,nx=player.x+dx,ny=player.y+dy,next=maze[ny]?.[nx];if(!next||next==="#")return;player={x:nx,y:ny};steps++;stepsEl.textContent=steps;if(next==="L"){leaves++;maze[ny][nx]=".";leavesEl.textContent=leaves;status.textContent=leaves===leafTotal?"All leaves found! Find the exit.":`${leafTotal-leaves} leaf${leafTotal-leaves===1?"":"s"} left.`}if(next==="E"){if(leaves===leafTotal){if(level===50){done=true;status.textContent=`You completed all 50 mazes in ${steps} steps on the final level!`}else{level++;levelEl.textContent=level;status.textContent=`Level ${level}: find all three leaves.`;buildLevel()}}else status.textContent="The gate opens only after you collect all three leaves."}draw()}
function draw(){x.fillStyle="#d9f99d";x.fillRect(0,0,600,440);maze.forEach((row,y)=>row.forEach((cell,z)=>{let px=z*tile,py=y*tile;if(cell==="#"){x.fillStyle="#3f6212";x.fillRect(px,py,tile,tile);x.fillStyle="#65a30d";x.fillRect(px+5,py+5,10,10)}if(cell==="L"){x.fillStyle="#16a34a";x.beginPath();x.ellipse(px+20,py+20,10,16,-.5,0,7);x.fill()}if(cell==="E"){x.fillStyle="#dc2626";x.fillRect(px+12,py+5,16,31);x.fillStyle="#fde68a";x.fillRect(px+15,py+8,10,4)}}));let px=player.x*tile,py=player.y*tile;x.fillStyle="#fbbf24";x.fillRect(px+14,py+13,15,24);x.fillRect(px+25,py+5,8,25);x.beginPath();x.arc(px+29,py+6,8,0,7);x.fill();x.fillStyle="#92400e";[[17,20],[25,31],[30,8]].forEach(([a,b])=>{x.beginPath();x.arc(px+a,py+b,3,0,7);x.fill()});x.fillStyle="#111827";x.fillRect(px+31,py+6,2,3)}
document.addEventListener("keydown",e=>{let direction={ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"}[e.key];if(direction){e.preventDefault();move(direction)}});document.querySelectorAll("[data-move]").forEach(button=>button.onclick=()=>move(button.dataset.move));document.querySelector("#restart").onclick=start;start();
</script></body></html>
